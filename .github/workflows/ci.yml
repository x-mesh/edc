name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # macOS runner는 proxy.golang.org 연결이 끊겨 module download만으로 job이 실패한 적이 있다.
      - name: Download modules
        run: |
          for attempt in 1 2 3; do
            if go mod download; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "go mod download failed, retrying in 10s"
            sleep 10
          done

      - name: Test and vet
        run: make check

      - name: Build
        run: make build VERSION=ci

  # --tls의 BPF는 amd64와 arm64에서 uprobe 인자를 다른 register로 읽는다. 두 machine에서 실제 curl 요청을 잡아 본다.
  tls-smoke:
    name: tls smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build VERSION=ci

      - name: Show kernel and libssl
        run: |
          uname -srm
          openssl version
          curl --version | head -1
          ldd "$(command -v curl)" | grep libssl

      - name: Trace an HTTPS request
        run: ./scripts/ci-tls-smoke.sh

      - name: Trace Go TLS plaintext
        run: go test ./internal/edc -run '^TestTraceTLSGoCaptures$' -count=1 -v

  cross:
    name: cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # release가 쓰는 것과 같은 target을 미리 빌드해 태그 뒤에 실패하지 않게 한다.
      - name: Build every release target
        run: make dist VERSION=ci

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check checksums.txt
