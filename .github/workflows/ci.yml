name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # macOS runner는 proxy.golang.org 연결이 끊겨 module download만으로 job이 실패한 적이 있다.
      - name: Download modules
        run: |
          for attempt in 1 2 3; do
            if go mod download; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "go mod download failed, retrying in 10s"
            sleep 10
          done

      - name: Test and vet
        run: make check

      # fanotify는 CAP_SYS_ADMIN이 있어야 시작하므로 make check는 fanotify 시험을 건너뛴다. root로 다시 돌리고,
      # EDC_TEST_FANOTIFY=required로 건너뛰는 대신 실패하게 한다. 마운트 시험은 mount가 실패하면 건너뛰므로,
      # 건너뛴 시험이 log에 있어도 실패시킨다.
      - name: Test watch fs drivers as root
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test -c -o edc.test ./internal/edc
          cd internal/edc
          sudo env EDC_TEST_FANOTIFY=required ../../edc.test -test.run '^TestFSWatch' -test.count=1 -test.v 2>&1 | tee watch-fs.log
          ! grep -- '--- SKIP' watch-fs.log

      - name: Build
        run: make build VERSION=ci

  # --tls의 BPF는 amd64와 arm64에서 uprobe 인자를 다른 register로 읽는다. 두 machine에서 실제 curl 요청을 잡아 본다.
  tls-smoke:
    name: tls smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true

      - name: Build
        run: make build VERSION=ci

      - name: Show kernel and libssl
        run: |
          uname -srm
          openssl version
          curl --version | head -1
          ldd "$(command -v curl)" | grep libssl

      - name: Trace an HTTPS request
        run: ./scripts/ci-tls-smoke.sh

      # capture 시험은 BPF 권한이 없으면 건너뛰므로 root로 돌린다. 건너뛰어도 step은 통과하므로, log에 SKIP이 있으면 실패시킨다.
      - name: Trace Go 1.27.1 TLS plaintext
        shell: bash
        run: |
          go test -c -o edc.test ./internal/edc
          cd internal/edc
          sudo env "PATH=$PATH" EDC_TEST_GO="$(command -v go)" ../../edc.test -test.run '^TestTraceTLSGo(Captures|HTTP2CapturesStreamsAndBodies)$' -test.count=1 -test.v 2>&1 | tee go-tls.log
          ! grep -- '--- SKIP' go-tls.log

      # trace exec의 BPF는 make check에서 root가 아니라 건너뛴다. runner kernel의 verifier에 올려 실제 process를 잡아 본다.
      # 건너뛰거나 시험 이름이 바뀌어 아무것도 돌지 않아도 PASS 줄이 없으므로 실패한다.
      - name: Trace exec, signal, and exit
        shell: bash
        working-directory: internal/edc
        run: |
          sudo ../../edc.test -test.run '^TestTraceExecCapturesExecSignalAndExit$' -test.count=1 -test.v 2>&1 | tee exec.log
          grep -q -- '--- PASS: TestTraceExecCapturesExecSignalAndExit' exec.log

      # trace sched의 BPF도 make check에서 root가 아니라 건너뛴다. runner kernel에서 기다린 구간에 syscall 이름이 붙는지 본다.
      # 이름은 사용자 register에서 읽으므로 arm64 runner가 arm64 배치를 확인한다.
      - name: Trace sched names the syscall of a wait
        shell: bash
        working-directory: internal/edc
        run: |
          sudo ../../edc.test -test.run '^TestTraceSchedNamesTheSyscallOfAWait$' -test.count=1 -test.v 2>&1 | tee sched.log
          grep -q -- '--- PASS: TestTraceSchedNamesTheSyscallOfAWait' sched.log

      # trace syscall의 BPF도 make check에서 root가 아니라 건너뛴다. runner kernel에서 필터, 오류, 진행 중인 호출,
      # edc 자신의 제외를 본다. 32비트 호환 호출은 x86_64에만 있어 arm64 runner는 그 시험을 건너뛴다.
      - name: Trace syscall counts
        shell: bash
        working-directory: internal/edc
        run: |
          sudo env "PATH=$PATH" EDC_TEST_GO="$(command -v go)" ../../edc.test -test.run '^TestTraceSyscall(CountsTheSelectedProcesses|LeavesOutEdcItself|NamesCompatCalls)$' -test.count=1 -test.v 2>&1 | tee syscall.log
          grep -q -- '--- PASS: TestTraceSyscallCountsTheSelectedProcesses' syscall.log
          grep -q -- '--- PASS: TestTraceSyscallLeavesOutEdcItself' syscall.log
          if [ "$(uname -m)" = x86_64 ]; then grep -q -- '--- PASS: TestTraceSyscallNamesCompatCalls' syscall.log; fi

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: false

      - name: Trace Go 1.26.8 TLS plaintext
        shell: bash
        working-directory: internal/edc
        run: |
          sudo env "PATH=$PATH" EDC_TEST_GO="$(command -v go)" ../../edc.test -test.run '^TestTraceTLSGo(Captures|HTTP2CapturesStreamsAndBodies)$' -test.count=1 -test.v 2>&1 | tee go-tls.log
          ! grep -- '--- SKIP' go-tls.log

  cross:
    name: cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # release가 쓰는 것과 같은 target을 미리 빌드해 태그 뒤에 실패하지 않게 한다.
      - name: Build every release target
        run: make dist VERSION=ci

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check checksums.txt
