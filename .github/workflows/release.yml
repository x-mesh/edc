name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # tag v0.2.0은 version 0.2.0이 된다. asset 이름과 edc version이 같은 값을 쓴다.
      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test and vet
        run: make check

      - name: Build release assets
        run: make dist VERSION=${{ steps.version.outputs.value }}

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check checksums.txt

      - name: Verify the built binary reports the tag version
        run: |
          tar -xzf "dist/edc_${{ steps.version.outputs.value }}_linux_amd64.tar.gz" -C /tmp
          got=$(/tmp/edc version)
          echo "$got"
          case "$got" in
            "edc ${{ steps.version.outputs.value }} "*) ;;
            *) echo "version mismatch: $got" >&2; exit 1 ;;
          esac

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "edc $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
