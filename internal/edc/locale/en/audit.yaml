# English messages for the audit command.
audit:
  skip:
    linux_only: "edc audits Linux hosts only"
    needs_root: "needs root to read %s"
    unreadable: "cannot read %s: %s"
    no_firewall_tool: "neither nft nor iptables-save is installed"
    no_sshd: "no sshd config at %s"
    no_sysctl: "no hardening value is readable under /proc/sys"
  net:
    exposed_none: "no database or control port listens beyond loopback (%d sockets)"
    exposed_open: "%s listens beyond loopback, and the host firewall accepts inbound traffic"
    exposed_filtered: "%s listens beyond loopback, the host firewall drops inbound traffic by default"
    exposed_unknown: "%s listens beyond loopback, the firewall is unknown without root"
    cloud_note: "edc sees only this host, a cloud security group can still block the port"
    docker_note: "docker-proxy owns a port, docker publishes it through FORWARD, so the INPUT policy does not apply, check the DOCKER-USER chain"
    firewall_drops: "%s drops inbound traffic that no rule accepts (%d input chains, %d rules)"
    firewall_rules: "%s accepts by default, %d input rules (edc does not read the rule order)"
    firewall_open: "%s has no input rule, the host accepts all inbound traffic"
    forward_off: "IP forwarding is off"
    forward_container: "IP forwarding is on for %s"
    forward_on: "IP forwarding is on, and edc found no container runtime"
  ssh:
    root_login_yes: "PermitRootLogin yes allows root to log in with a password (%s)"
    root_login_ok: "PermitRootLogin %s (%s)"
    match_note: "edc does not evaluate Match blocks, `sshd -T` shows the effective values"
    empty_passwords: "PermitEmptyPasswords yes with password login on"
    password_on: "password login is on: %s"
    password_off: "password login is off"
    keys_ok: "%d authorized_keys files, none writable by other users"
    keys_bad: "%d ~/.ssh paths are writable by other users"
    keys_skipped: "%d home directories are unreadable without root"
  account:
    uid0_ok: "only root has UID 0"
    uid0_bad: "UID 0 also belongs to %s"
    empty_ok: "no account has an empty password"
    empty_bad: "accounts with an empty password: %s"
    sudo_ok: "no sudo rule runs every command without a password"
    sudo_bad: "%d sudo rules run every command without a password"
    groups_ok: "the docker and lxd groups have no members"
    groups_bad: "root-equivalent group members: %s"
  file:
    sensitive_ok: "%d sensitive files have safe modes"
    sensitive_bad: "%d sensitive files are open to other users"
    path_ok: "no PATH directory is writable by other users (%d checked)"
    path_bad: "PATH entries that other users can change: %s"
  kernel:
    sysctl_ok: "%d hardening values match"
    sysctl_bad: "hardening values differ: %s"
  patch:
    reboot_flag: "a package asks for a reboot: %s"
    reboot_kernel: "kernel %s is installed, %s is running"
    reboot_ok: "the running kernel %s is the newest installed"
    reboot_none: "no reboot request"
  ctr:
    privileged: "edc holds every capability, the %s container is privileged (CapEff %s)"
    caps_limited: "the container drops some capabilities (CapEff %s)"
    sock_mounted: "%s is mounted, the container can control the host docker daemon"
    sock_none: "no docker socket is mounted"
    root_user: "edc runs as UID 0 in the %s container"
    user_ok: "edc runs as UID %d"
    own_pid: "the container has its own PID namespace (%s), edc does not compare the network namespace"
    host_pid: "the container shares the host PID namespace"
    host_pid_net: "the container shares the host PID and network namespaces"
    net_unknown: "cannot read %s (%s), edc did not compare the network namespace"
  evidence:
    sockets: "sockets"
    files: "files"
    rules: "rules"
    values: "values"
    other_owner: "owned by another user"
    other_read: "readable by others"
    other_write: "writable by others"
