# English messages for the audit command.
audit:
  accepted: "accepted (%s): %s"
  skip:
    linux_only: "edc audits Linux hosts only"
    needs_root: "needs root to read %s"
    unreadable: "cannot read %s: %s"
    no_firewall_tool: "neither nft nor iptables-save is installed"
    no_sshd: "no sshd config at %s"
    login_sqlite: "only the SQLite login records (wtmpdb, lastlog2) exist, edc reads the binary wtmp and lastlog only"
    no_sysctl: "no hardening value is readable under /proc/sys"
  net:
    exposed_none: "no database or control port listens beyond loopback (%d sockets)"
    exposed_open: "%s listens beyond loopback, and the host firewall accepts inbound traffic"
    exposed_filtered: "%s listens beyond loopback, the host firewall drops inbound traffic by default"
    exposed_unknown: "%s listens beyond loopback, the firewall is unknown without root"
    cloud_note: "edc sees only this host, a cloud security group can still block the port"
    docker_note: "docker-proxy owns a port, docker publishes it through FORWARD, so the INPUT policy does not apply, check the DOCKER-USER chain"
    firewall_drops: "%s drops inbound traffic that no rule accepts (%d input chains, %d rules)"
    firewall_rules: "%s accepts by default, %d input rules (edc does not read the rule order)"
    firewall_open: "%s has no input rule, the host accepts all inbound traffic"
    allowed_ports: "allow_ports in the config accepts %s"
    forward_off: "IP forwarding is off"
    forward_container: "IP forwarding is on for %s"
    forward_on: "IP forwarding is on, and edc found no container runtime"
  ssh:
    root_login_yes: "PermitRootLogin yes allows root to log in with a password (%s)"
    root_login_ok: "PermitRootLogin %s (%s)"
    match_note: "edc does not evaluate Match blocks, `sshd -T` shows the effective values"
    empty_passwords: "PermitEmptyPasswords yes with password login on"
    password_on: "password login is on: %s"
    password_off: "password login is off"
    keys_ok: "%d authorized_keys files, none writable by other users"
    keys_bad: "%d ~/.ssh paths are writable by other users"
    key_changed_ok: "no authorized_keys file changed in the last 7 days (%d checked)"
    key_changed_bad: "%d authorized_keys files changed in the last 7 days"
    key_changed_at: "changed at %s"
    key_mtime_older: "mtime %s is older, touch or chmod changed only the inode"
    key_no_login: "wtmp has no earlier login"
    key_login: "previous login %s %s %s from %s"
    keys_command: "AuthorizedKeysCommand %s supplies keys, edc did not check them"
    keys_skipped: "%d home directories are unreadable without root"
  account:
    external: "nsswitch.conf takes accounts from %s, edc checked only the accounts in /etc/passwd"
    uid0_ok: "only root has UID 0"
    uid0_bad: "UID 0 also belongs to %s"
    empty_ok: "no account has an empty password"
    empty_bad: "accounts with an empty password: %s"
    sudo_ok: "no sudo rule runs every command without a password"
    sudo_bad: "%d sudo rules run every command without a password"
    groups_ok: "the docker and lxd groups have no members"
    groups_bad: "root-equivalent group members: %s"
  file:
    sensitive_ok: "%d sensitive files have safe modes"
    sensitive_bad: "%d sensitive files are open to other users"
    path_ok: "no PATH directory is writable by other users (%d checked)"
    path_bad: "PATH entries that other users can change: %s"
  login:
    mismatch_bad: "%d accounts have a lastlog login that disagrees with wtmp or the sshd journal (wtmp from %s)"
    mismatch_ok: "lastlog and wtmp agree for %d accounts (wtmp from %s)"
    wtmp_empty: "wtmp has no records, lastlog has logins for %d accounts"
    zeroed: "wtmp has %d records filled with zeros (wtmp from %s)"
    none: "no login records"
    before_since: "%d accounts last logged in before wtmp starts, edc did not compare them"
    journal_root: "edc reads the journal only as root, so it did not find session ends and ssh access without a terminal"
    journal_none: "journalctl is not installed, so edc did not find session ends and ssh access without a terminal"
    journal_error: "cannot read the journal: %s"
    journal_limited: "the journal has more than %d entries in the range, edc read only the newest"
    later_login: "sshd and wtmp record a later login at %s %s from %s"
    unlogged: "%d remote terminal logins in wtmp have no sshd Accepted entry in the journal (journal from %s)"
    joined_by_time: "%d wtmp logins match no sshd journal PID (OpenSSH before 9.8), so edc joined them by user, host, and time"
    unjoinable: "the sshd journal matches no wtmp login by PID or by user, host, and time, so edc did not join the journal with wtmp"
    compressed: "%s is compressed, the check starts at the next file"
    limited: "edc read only the last 64 MiB of %s"
    truncated: "%s ends in a partial record"
  history:
    tampered_ok: "the history of %d accounts shows no sign of removal"
    tampered_bad: "%d history files were removed or redirected after a login"
    older_bad: "%d history files did not change during the last session of more than one minute"
    since: "(wtmp from %s)"
    empty_after: "%s  %s is empty or missing after the session %s to %s from %s"
    older_than: "%s  %s last changed at %s, before the session %s to %s"
    char_device: "character device"
    no_logins: "edc cannot read the login records, so it checked only redirection to /dev/null"
    no_logout: "%d accounts have logins but neither wtmp nor the journal has a logout record, edc did not compare times"
    short_only: "%d accounts have only sessions of one minute or less, edc did not compare times"
    skipped: "%d home directories are unreadable without root"
    disabled_ok: "no start file turns off the shell history"
    disabled_bad: "%d start file settings turn off the shell history"
    not_judged:
      zsh_no_histfile: "%s: zsh saves no history without HISTFILE, edc did not check it"
      histfile_off: "%s: HISTFILE turns off the history, see history.disabled"
      history_off: "%s: a start file turns off the history, see history.disabled"
      histfile_custom: "%s: HISTFILE names another path, edc did not check it"
  proc:
    exe_ok: "no process runs from a temporary directory, from memory, or from a file or library deleted outside the package directories (%d checked)"
    exe_bad: "%d processes run from a temporary directory, from memory, or from a file or library deleted outside the package directories"
    unreadable: "%d processes are unreadable without root"
    preload_ok: "no preloaded library (%d processes checked)"
    preload_bad: "/etc/ld.so.preload has %d entries, and %d processes run with LD_PRELOAD"
    env_unreadable: "edc cannot read the environment of %d processes"
    proc_unreadable: "cannot read /proc (%s), edc did not check LD_PRELOAD of processes"
    reason:
      temp: "runs from a temporary directory"
      deleted: "the binary was deleted"
      deleted_lib: "a deleted library outside the package directories is loaded"
      memfd: "runs from memory (memfd)"
  kernel:
    sysctl_ok: "%d hardening values match"
    sysctl_bad: "hardening values differ: %s"
  patch:
    reboot_flag: "a package asks for a reboot: %s"
    reboot_kernel: "kernel %s is installed, %s is running"
    reboot_ok: "the running kernel %s is the newest installed"
    reboot_none: "no reboot request"
  ctr:
    privileged: "edc holds every capability, the %s container is privileged (CapEff %s)"
    caps_limited: "the container drops some capabilities (CapEff %s)"
    sock_mounted: "%s is mounted, the container can control the host docker daemon"
    sock_none: "no docker socket is mounted"
    root_user: "edc runs as UID 0 in the %s container"
    user_ok: "edc runs as UID %d"
    own_pid: "the container has its own PID namespace (%s), edc does not compare the network namespace"
    host_pid: "the container shares the host PID namespace"
    host_pid_net: "the container shares the host PID and network namespaces"
    net_unknown: "cannot read %s (%s), edc did not compare the network namespace"
  evidence:
    no_tty: "ssh access without a terminal, not in wtmp (user, host, method, count)"
    processes: "processes"
    settings: "settings"
    accounts: "accounts"
    sockets: "sockets"
    files: "files"
    rules: "rules"
    values: "values"
    other_owner: "owned by another user"
    other_read: "readable by others"
    other_write: "writable by others"
