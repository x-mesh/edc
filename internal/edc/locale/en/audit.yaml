# English messages for the audit command.
audit:
  removed_accept: "%s in audit.accept is no longer an audit check, see %s"
  accepted: "accepted (%s): %s"
  skip:
    unsupported_os: "not checked on this OS"
    no_dpkg: "no dpkg records; edc checks package files on dpkg hosts only"
    linux_only: "edc audits Linux and macOS hosts only"
    needs_root: "needs root to read %s"
    unreadable: "cannot read %s: %s"
    no_firewall_tool: "neither nft nor iptables-save is installed"
    no_sshd: "no sshd config at %s"
    login_sqlite: "only the SQLite login records (wtmpdb, lastlog2) exist, edc reads the binary wtmp and lastlog only"
    no_sysctl: "no hardening value is readable under /proc/sys"
    no_journal: "edc did not read the sshd journal"
  net:
    listen_partial: "not root, so sockets of other users' processes were not read"
    exposed_app_filter: "%s listens beyond loopback, the Application Firewall filters per app, so edc cannot tell whether the port is blocked"
    firewall_alf_blocks: "the Application Firewall blocks all inbound connections except essential services"
    firewall_alf_apps: "the Application Firewall filters inbound connections per app (allowed apps are not judged)"
    firewall_pf_drops: "pf blocks inbound connections that no rule accepts (%d input rules)"
    firewall_mac_open: "the Application Firewall is off and pf has no rule that blocks inbound connections, the host accepts all inbound traffic"
    ipv6_blocks: "IPv6 inbound connections are also blocked (%s)"
    ipv6_app_filter: "the Application Firewall filters IPv4 and IPv6 the same way"
    pf_unread: "pf  not read without root"
    ipv6_none: "no public IPv6 address, edc did not judge the IPv6 firewall"
    ipv6_unknown: "the host has a public IPv6 address, but edc cannot read the IPv6 input rules"
    ipv6_drops: "IPv6 input also drops traffic that no rule accepts (%d chains, %d rules)"
    ipv6_no_listen: "public IPv6 %s, but no socket listens on IPv6"
    ipv6_open: "public IPv6 %s, the IPv6 input accepts by default, and %d sockets listen on IPv6"
    ipv6_rules: "%s IPv6 input: %d chains, %d rules, no default drop"
    ipv4_rules: "IPv4 input drops by default: %t"
    docker_published: "docker publishes ports %s on all addresses; they pass FORWARD, so the INPUT drop does not apply"
    reverse_ok: "no reverse ssh tunnel (%d ssh clients, %d sshd sockets checked)"
    reverse_bad: "reverse ssh tunnels: %d listeners on this host, %d clients that open this host to a remote host"
    reverse_listener_note: "an ssh client opened this port with -R; a connection to it goes through that ssh connection"
    reverse_client_note: "-R or -w opens a way from the remote host into this host"
    reverse_x11: "%d sshd sockets are X11 forwarding on loopback ports 6010-6099, edc did not judge them"
    reverse_no_listen: "cannot read the listening sockets (%s), edc checked ssh clients only"
    forward_markers: "no container marker: %s"
    exposed_none: "no database or control port listens beyond loopback (%d sockets)"
    exposed_open: "%s listens beyond loopback, and the host firewall accepts inbound traffic"
    exposed_filtered: "%s listens beyond loopback, the host firewall drops inbound traffic by default"
    exposed_unknown: "%s listens beyond loopback, the firewall is unknown without root"
    cloud_note: "edc sees only this host, a cloud security group can still block the port"
    docker_note: "docker-proxy owns a port, docker publishes it through FORWARD, so the INPUT policy does not apply, check the DOCKER-USER chain"
    firewall_drops: "%s drops inbound traffic that no rule accepts (%d input chains, %d rules)"
    firewall_rules: "%s accepts by default, %d input rules (edc does not read the rule order)"
    firewall_open: "%s has no input rule, the host accepts all inbound traffic"
    allowed_ports: "allow_ports in the config accepts %s"
    forward_off: "IP forwarding is off"
    forward_on_host: "IP forwarding is on, this host relays packets for other devices"
    forward_container: "IP forwarding is on for %s"
    forward_on: "IP forwarding is on, and edc found no container runtime"
  ssh:
    forwarding_ok: "sshd opens no forwarding to other hosts (GatewayPorts %s, PermitTunnel %s)"
    forwarding_bad: "sshd opens forwarding or a tunnel to other hosts: %s"
    advice_gateway: "recommended no: with yes, a port that ssh -R opens listens on all interfaces, so other hosts can enter through the tunnel"
    advice_tunnel: "recommended no: ssh -w can then create a network device (tun) between this host and the remote host"
    extra_ok: "only the ssh service runs an sshd listener (%d)"
    extra_bad: "%d sshd listeners run outside the ssh service"
    extra_multi: "%d sshd listeners run, and edc cannot tell the service of each without systemd"
    extra_note: "an sshd outside the ssh service can use its own config and log file, so its logins can miss the journal"
    advice_root: "recommended prohibit-password: root logs in with keys only"
    advice_empty: "recommended no: an account with an empty password logs in without a password"
    advice_kbd: "recommended no: with UsePAM yes, this method also asks for a password through PAM"
    advice_password: "recommended no: it stops password guessing, and users log in with keys only"
    setting_default: "(default)"
    setting_ignored: "ignored: an earlier line wins, so a change here has no effect"
    root_login_yes: "PermitRootLogin yes allows root to log in with a password (%s)"
    root_login_ok: "PermitRootLogin %s (%s)"
    match_note: "edc does not evaluate Match blocks, `sshd -T` shows the effective values"
    empty_passwords: "PermitEmptyPasswords yes with password login on"
    password_on: "password login is on: %s"
    password_off: "password login is off"
    keys_ok: "%d authorized_keys files, none writable by other users"
    keys_bad: "%d ~/.ssh paths are writable by other users"
    key_changed_ok: "no authorized_keys file changed in the last 7 days (%d checked)"
    key_changed_bad: "%d authorized_keys files changed in the last 7 days"
    key_changed_at: "changed at %s"
    key_mtime_older: "mtime %s is older, touch or chmod changed only the inode"
    key_no_login: "wtmp has no earlier login"
    key_login: "previous login %s %s %s from %s"
    keys_command: "AuthorizedKeysCommand %s supplies keys, edc did not check them"
    keys_skipped: "%d home directories are unreadable without root"
  account:
    external_ds: "the Directory Services search path includes %s, edc checked only the accounts in the local node (/Local/Default)"
    external: "nsswitch.conf takes accounts from %s, edc checked only the accounts in /etc/passwd"
    uid0_ok: "only root has UID 0"
    uid0_bad: "UID 0 also belongs to %s"
    empty_ok: "no account has an empty password"
    empty_bad: "accounts with an empty password: %s"
    sudo_ok: "no sudo rule runs every command without a password"
    sudo_bad: "%d sudo rules run every command without a password"
    groups_ok: "the docker and lxd groups have no members"
    groups_bad: "root-equivalent group members: %s"
  file:
    pkg_ok: "%d files of %d packages match their package checksums"
    pkg_bad: "%d package files differ from their package checksums"
    pkg_package: "package %s"
    pkg_note: "the content differs from the file that the package installed; if nobody changed it on purpose, suspect a replaced binary"
    pkg_missing: "%d package files are missing: %s"
    pkg_unread: "could not read %d checksum lists or files, so they are not compared: %s"
    path_relative: "a relative path, it changes with the current directory"
    sensitive_ok: "%d sensitive files have safe modes"
    sensitive_bad: "%d sensitive files are open to other users"
    path_ok: "no PATH directory is writable by other users (%d checked)"
    path_bad: "PATH entries that other users can change: %s"
  login:
    peer: "peer process"
    mismatch_bad: "%d accounts have a lastlog login that disagrees with wtmp or the sshd journal (wtmp from %s)"
    mismatch_ok: "lastlog and wtmp agree for %d accounts (wtmp from %s)"
    wtmp_empty: "wtmp has no records, lastlog has logins for %d accounts"
    zeroed: "wtmp has %d records filled with zeros (wtmp from %s)"
    none: "no login records"
    before_since: "%d accounts last logged in before wtmp starts, edc did not compare them"
    journal_root: "edc reads the journal only as root, so it did not find session ends and ssh access without a terminal"
    journal_none: "journalctl is not installed, so edc did not find session ends and ssh access without a terminal"
    journal_error: "cannot read the journal: %s"
    journal_limited: "the journal has more than %d entries in the range, edc read only the newest"
    later_login: "sshd and wtmp record a later login at %s %s from %s"
    unlogged: "%d remote terminal logins in wtmp have no sshd Accepted entry in the journal (journal from %s)"
    joined_by_time: "%d wtmp logins match no sshd journal PID (OpenSSH before 9.8), so edc joined them by user, host, and time"
    joined_by_connection: "%d terminal logins have no Accepted entry of their own, so edc joined them with an open connection of the same user and host (ControlMaster, OpenSSH before 9.8)"
    unjoinable: "the sshd journal matches no wtmp login by PID or by user, host, and time, so edc did not join the journal with wtmp"
    local_source_ok: "no sshd login came from this host (%d checked, journal from %s)"
    local_source_bad: "%d sshd logins came from this host, %d of them still open (journal from %s)"
    local_addrs: "cannot read the interface addresses (%s), edc compared loopback sources only"
    local_tcp: "cannot read the connected TCP sockets (%s), edc did not look for peer processes"
    local_fd: "cannot read the fd of sshd (%[2]s), so edc does not know whether %[1]d logins are still open"
    local_unparsed: "%d sshd Accepted entries have a source that is not an address, edc did not judge them"
    peer_none: "peer process not found"
    peer_forward: "carries a tunnel of the ssh login of %s from %s (%s, %s)"
    peer_forward_unknown: "carries a tunnel of the ssh connection from %s, which is not in the journal range"
    compressed: "%s is compressed, the check starts at the next file"
    limited: "edc read only the last 64 MiB of %s"
    truncated: "%s ends in a partial record"
  history:
    modified: "last changed at %s"
    tampered_ok: "the history of %d accounts shows no sign of removal"
    tampered_bad: "%d history files were removed or redirected after a login"
    older_bad: "%d history files did not change during the last session of more than one minute"
    since: "(wtmp from %s)"
    empty_after: "empty or missing after the session %s to %s from %s"
    older_than: "did not change during the session %s to %s of more than one minute"
    char_device: "character device"
    no_logins: "edc cannot read the login records, so it checked only redirection to /dev/null"
    no_logout: "%d accounts have logins but neither wtmp nor the journal has a logout record, edc did not compare times"
    short_only: "%d accounts have only sessions of one minute or less, edc did not compare times"
    skipped: "%d home directories are unreadable without root"
    disabled_ok: "no start file turns off the shell history"
    disabled_bad: "%d start file settings turn off the shell history"
    not_judged:
      zsh_no_histfile: "%s: zsh saves no history without HISTFILE, edc did not check it"
      histfile_off: "%s: HISTFILE turns off the history, see history.disabled"
      history_off: "%s: a start file turns off the history, see history.disabled"
      histfile_custom: "%s: HISTFILE names another path, edc did not check it"
  proc:
    shell_ok: "no process uses a TCP socket as its input or output (%d checked)"
    shell_bad: "%d processes use a TCP socket as their input or output, the shape of a reverse shell"
    shell_peer: "peer %s on fd %s"
    shell_note: "its input or output goes to a remote host over TCP; a shell like this takes commands from that host"
    raw_ok: "no process outside the packages holds a packet or raw socket (%d sockets)"
    raw_bad: "%d processes outside the packages hold a packet or raw socket"
    raw_kinds: "socket: %s"
    raw_note: "a packet or raw socket sees traffic without a listening port; a passive backdoor waits for a magic packet this way"
    file_replaced: "a new file replaced it at %s, the process runs the old binary until a restart"
    file_removed: "the file is gone from the path, the process runs from memory"
    started: "started %s"
    started_days: "started %s (%d days)"
    parent: "parent %d %s"
    exe_ok: "no process runs from a temporary directory, from memory, or from a file or library deleted outside the package directories (%d checked)"
    exe_bad: "%d processes run from a temporary directory, from memory, or from a file or library deleted outside the package directories"
    unreadable: "%d processes are unreadable without root"
    preload_ok: "no preloaded library (%d processes checked)"
    preload_bad: "/etc/ld.so.preload has %d entries, and %d processes run with LD_PRELOAD"
    preload_env: "%d processes run with LD_PRELOAD"
    preload_file: "/etc/ld.so.preload has %d entries"
    lib_package: "a file of the %s package"
    lib_no_package: "no dpkg package owns this file"
    env_unreadable: "edc cannot read the environment of %d processes"
    proc_unreadable: "cannot read /proc (%s), edc did not check LD_PRELOAD of processes"
    reason:
      temp: "runs from a temporary directory"
      deleted: "the binary was deleted"
      deleted_lib: "a deleted library outside the package directories is loaded"
      memfd: "runs from memory (memfd)"
  persist:
    changed_ok: "no autostart location changed in the last 7 days (%d files checked)"
    changed_bad: "%d autostart files changed in the last 7 days; they run commands at login, at boot, or on a schedule"
    upgraded: "%d package files changed with their package upgrade, edc did not judge them"
    not_root: "edc runs without root and cannot read every location (/var/spool/cron, the homes of other accounts)"
  kernel:
    taint_ok: "no out-of-tree, unsigned, or forced kernel module (tainted %d)"
    taint_bad: "the kernel has an out-of-tree, unsigned, or forced module: %s (tainted %d)"
    taint_kept: "no loaded module shows the taint; the kernel keeps the taint until a reboot, so the module can be unloaded now"
    module_no_file: "no file under %s"
    module_missing: "the module file is not in the kernel module directory; someone loaded it from another path"
    module_dkms: "built by DKMS"
    sysctl_ok: "%d hardening values match"
    sysctl_bad: "hardening values differ: %s"
  ctr:
    escape_none: "no docker socket"
    escape_ok: "no running container has a setting that reaches the host (%d checked)"
    escape_bad: "%d running containers have a setting that reaches the host"
    risk_privileged: "privileged: the container has all devices and capabilities of the host"
    risk_host_pid: "host PID namespace: the container sees and signals host processes"
    risk_cap: "added capability %s"
    risk_docker_sock: "mounts %s at %s: the container controls the host docker and can get host root"
    risk_root_mount: "mounts the host / with write access at %s"
    privileged: "edc holds every capability, the %s container is privileged (CapEff %s)"
    caps_limited: "the container drops some capabilities (CapEff %s)"
    sock_mounted: "%s is mounted, the container can control the host docker daemon"
    sock_none: "no docker socket is mounted"
    root_user: "edc runs as UID 0 in the %s container"
    user_ok: "edc runs as UID %d"
    own_pid: "the container has its own PID namespace (%s), edc does not compare the network namespace"
    host_pid: "the container shares the host PID namespace"
    host_pid_net: "the container shares the host PID and network namespaces"
    net_unknown: "cannot read %s (%s), edc did not compare the network namespace"
  evidence:
    containers: "containers"
    tunnel_listeners: "ports that ssh -R opened on this host"
    tunnel_clients: "ssh clients that open this host to a remote host"
    modules: "modules"
    paths: "PATH entries"
    sshd_settings: "sshd settings (setting, value, file:line)"
    no_tty: "ssh access without a terminal, not in wtmp (user, host, method, count)"
    open_logins: "open ssh logins from this host (user, source, method, time, peer process)"
    unverified_logins: "ssh logins from this host that may be open (user, source, method, count, last time)"
    closed_logins: "closed ssh logins from this host (user, source, method, count, last time)"
    processes: "processes"
    settings: "settings"
    accounts: "accounts"
    sockets: "sockets"
    files: "files"
    rules: "rules"
    values: "values"
    other_owner: "owned by another user"
    other_read: "readable by others"
    other_write: "writable by others"
