    vm_disks_volumes_db: "VM disks, Docker volumes, databases"
    app_caches_logs: "app caches and logs"
    worktrees: "worktrees"
    trash_downloads: "trash and downloads"
    project_build_dirs: "project build folders"
    sdk_simulators_models: "SDKs, simulators, models"
  not_measured_reason:
