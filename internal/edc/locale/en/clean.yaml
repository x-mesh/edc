# English messages for the clean command.
clean:
  skip:
    unsupported: "edc clean reads cache locations on Linux and macOS only"
  error:
    home: "cannot find the home directory"
  summary: "%d candidates, %d measured, %d without a size"
  warning:
    timeout: "edc stopped at the time limit, so the candidates after that point are marked not scanned"
    stopped: "you stopped edc, so the candidates after that point are marked not scanned"
  category:
    build_cache: "build cache"
    package_cache: "package cache"
  candidate:
    go-build: "Go build cache"
    go-mod: "Go module cache"
    npm: "npm cache"
    pnpm: "pnpm store"
    uv: "uv cache"
    homebrew: "Homebrew cache"
    xcode-derived-data: "Xcode DerivedData"
    swiftpm: "SwiftPM cache"
  status:
    measured: "measured"
    partial: "partial"
    absent: "not found"
    tool_absent: "tool not found"
    unknown_location: "location unknown"
    unreadable: "unreadable"
    rejected: "rejected"
    duplicate: "duplicate"
    not_scanned: "not scanned"
  reason:
    timeout: "time limit"
    stopped: "stopped"
    tool_timeout: "tool timed out"
    tool_failed: "tool failed"
    invalid_output: "unexpected tool output"
    permission_denied: "permission denied"
    stat_error: "cannot read the path"
    root_unreadable: "cannot read the folder"
    covers_user_data: "covers user data"
    same_as: "same path"
    unreadable_dirs: "unreadable directories"
    skipped_mounts: "skipped mounts"
  cost:
    low: "low"
    medium: "medium"
  lower_bound: "at least %s"
  tool_absent: "%s (%s)"
  duplicate: "%s (%s)"
  with_reason: "%s (%s)"
  resolved: "%s → %s"
  inside: "inside %s, not added to the total again"
  group: "%s  %d folder(s)  %s"
  group_more: "%d more, -v shows all"
  unreadable: "%d unreadable directories are not counted"
  regen: "cost to recreate: %s"
  cleanup: "to clean, run %s (edc does not run it)"
