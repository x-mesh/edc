    column:
      name: "NAME"
      state: "STATE"
      restarts: "RESTARTS"
      uptime: "UPTIME"
      memory: "MEM"
      cpu: "CPU%"
      memory_percent: "MEM%"
      pids: "PIDs"
      network: "NET I/O"
      block: "BLOCK I/O"
      image: "IMAGE"
