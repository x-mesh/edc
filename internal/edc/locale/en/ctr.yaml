# English messages for the ctr command.
ctr:
  skip:
    linux_only: "edc ctr supports Linux and macOS"
    no_docker: "Docker Engine socket is not available"
    not_running: "the container has no running process"
    needs_docker_access: "needs permission to access the Docker Engine socket"
    api_unavailable: "unavailable through the Docker Engine API"
