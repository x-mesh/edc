  evidence:
    resources: "Resource values"
    resource_cpu: "CPU: %s"
    resource_memory: "Memory: %s"
    resource_pids: "PIDs: %s"
    resource_oom: "OOM: %s"
    resource_throttle: "Throttle: %s"
    resource_unavailable: "unavailable (%s)"
    log: "log"
    log_file: "log file"
    health: "health checks"
    published: "published ports"
    unavailable: "unavailable"
