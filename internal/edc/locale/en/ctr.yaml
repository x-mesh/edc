    no_tag: "%s is not on this host, so edc cannot compare it. The container runs %s, created %s"
    no_id: "the inspect response has no image ID"
    created: "%s (%s ago)"
  listen:
  limits:
    summary: "memory %s · OOM kills %s · CPU throttled %s · pids %s"
