# English messages for the du command.
du:
  skip:
    linux_only: "edc du reads directories on Linux only"
  error:
    path: "cannot read %s"
  summary: "%s in %s, %d entries, %s, workers %d"
  summary_partial: "%s in %s so far, %d entries, stopped at %s"
  summary_stopped: "%s in %s so far, %d entries, stopped"
  warning:
    partial: "edc stopped at the time limit, so the size covers only what it read"
    stopped: "you stopped edc, so the size covers only what it read"
    unreadable_root: "%d directories are unreadable and not counted, run as root to count them"
    unreadable: "%d directories are unreadable and not counted"
    no_mountinfo: "cannot read the mount table (%s), so bind mounts below the path are counted"
    deleted_open: "%s in deleted files that processes still hold open on %s, the largest by %s (pid %d)"
  evidence:
    unreadable: "unreadable directories"
  other: "(%d other entries)"
  fs:
    title: "file system  %s  %s  %s used of %s"
    counted: "counted"
    deleted: "deleted, open"
    files: "in %d files"
    not_found: "not found"
    not_found_hint: "files under a mount point, or file system metadata"
    partial_hint: "run as root to read every process"
  browse:
    title: "edc du · %s · %s · %d entries"
    help: "↑↓ move · Enter open · ← up · q quit"
    reading: "reading %s · %d directories · %s"
    stop_help: "q stops and shows what edc read"
    stopping: "stopping…"
    empty: "(empty)"
    other: "(%d other files)"
    unreadable: "(unreadable)"
    mount: "(%s mount, not counted)"
    fs: "file system %s %s · %s used of %s"
    deleted: "deleted, open %s"
    partial: "partial"
    unreadable_count: "%d unreadable"
  diff:
    count: "%d directory deltas (e detail)"
    path_differs: "directories not compared, the paths differ: %s → %s"
    partial: "directories not compared, one scan stopped before the end"
  mounts:
    title: "skipped mounts"
    used: "%s used"
    more: "%d more, -v shows all"
