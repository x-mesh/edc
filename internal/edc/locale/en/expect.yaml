# English messages for edc tcp expect.
expect:
  prompt_port: "port"
  prompt_hint: "Runs on the target host and shows whether SYNs reach the port and how this host answers.\nEnter the port that the client connects to, for example 2142."
  port_invalid: "the port must be a number from 1 to 65535: %s"
  from_invalid: "--from needs an IP address or a CIDR range: %s"
  duration_range: "--duration must be 0s or more and %s at most"
  until_invalid: "--until must be syn or handshake: %s"
  stop_after_invalid: "--stop-after must be 1 or more: %d"
  listen_busy: "--listen: something already listens on port %d (%v). edc does not take over a port. Remove --listen to test the service"
  listen_failed: "--listen: edc cannot listen on port %d: %v"
  linux_only: "tcp expect requires Linux, not %s"
  live:
    from: "from %s"
    stop: "stop"
    until_syn: "until the first SYN"
    until_handshake: "until the first handshake"
    stop_after: "until %d attempts"
    drop_on: "kernel drop reasons: on (a packet that the kernel drops shows as a DROP line with the reason)"
    drop_skip: "kernel drop reasons: skip (%s)"
    waiting: "Waiting for SYNs to port %d. Connect from the client now, for example: %s"
    this_host: "<this-host>"
    other_addresses: "other addresses of this host: %s"
    retransmit: "retransmit %d"
    duplicate: "same packet on another interface"
    handshake_time: "handshake %s"
  listener:
    present: "listener: %[1]s on %[2]s"
    loopback: "listener: %[1]s on %[2]s, loopback only. SYNs from other hosts get an RST"
    none: "listener: none. No process accepts connections on this port, so SYNs get an RST. To test the path only, add --listen"
    unknown: "listener: unknown (%s)"
    temporary: "listener: temporary. edc accepts and closes connections on %s until the end"
    unknown_process: "unknown process"
  summary:
    no_syn: "No SYN for port %d arrived in %s. Packets do not reach this host"
    no_syn_ipsec: "No SYN for port %d was visible in %s. IPsec transport mode can hide arriving packets from edc"
    completed: "%[1]s on %[2]s: %[3]d of %[4]d connections completed the handshake"
    rst: "%[1]s on %[2]s: SYN %[3]d arrived, RST %[4]d sent. No process listens on the port, or a host firewall rejects it"
    synack_no_ack: "%[1]s on %[2]s: SYN %[3]d arrived, SYN-ACK %[4]d sent, no ACK came back. Suspect the return path (reverse route or reverse IPsec selector)"
    syn_no_reply: "%[1]s on %[2]s: SYN %[3]d arrived, but this host sent no SYN-ACK or RST. A host firewall, rp_filter, or a full listen queue drops it"
    reply_hidden_ipsec: "%[1]s on %[2]s: SYN %[3]d arrived and no handshake completed. The reply leaves through an IPsec policy as ESP, so edc cannot see it"
    rst_cause: "%[1]s on %[2]s: SYN %[3]d arrived, RST %[4]d sent. %[5]s"
    rst_hidden: "%[1]s on %[2]s: SYN %[3]d arrived, and the RST left as ESP through an IPsec policy, so edc cannot see it. %[4]s"
    dropped_unseen: "%[1]s: the packet socket saw no SYN for port %[2]d, but the kernel dropped packets for it. Packets reach this host"
    drops: "(kernel drops: %s)"
    more_sources: "(+%d more sources)"
  cause:
    firewall: "A host firewall rule rejects the SYNs"
    no_listener: "No process listens on port %d"
    listener_address: "The listener takes %s only"
    no_socket: "The kernel found no socket for %s"
    listening: "A host firewall rejects the SYNs, or the listener on %s does not take this address"
  warning:
    route_failed: "edc cannot look up the route back to %s: %s"
    rp_filter_strict: "rp_filter is strict (1) on %[1]s and the route back to %[2]s leaves through %[3]s. The kernel drops these SYNs"
    asymmetric: "the reply to %[1]s leaves through %[2]s, not through %[3]s where the SYN arrived"
    ipsec_transport: "this host has IPsec transport mode policies for this source. The kernel does not show their decrypted packets to the packet socket, so edc can miss a SYN that arrives. Check the counters of ip -s xfrm state"
    socket_drops: "the packet socket dropped %d packets. The counts can be low"
    drop_lost: "the drop trace lost %d events, so kernel drops for this port can be missing"
    untracked: "%d connection attempts were not tracked because too many attempts or sources were live. Narrow the observation with --from"
    other_ports: "no SYN came for port %[1]d, but SYNs came for other ports: %[2]s. Check the port that the client uses"
  status:
    syn: "SYN %d"
    handshakes: "handshakes %d"
    drops: "drops %d"
    other_ports: "other ports: %s"
  next:
    step: "next step: %s"
    no_syn: "the SYN does not reach this host. Check the path: tunnel selector, firewall, NAT"
    no_syn_ipsec: "IPsec transport mode can hide an arriving SYN. Compare the counters of ip -s xfrm state before and after a connect"
    rst: "nothing listens or the host firewall rejects. Run edc listen --tcp, or rerun with --listen to test the path only"
    rst_listening: "check the address of the listener with edc listen --tcp, and the host firewall with sudo nft list ruleset or iptables -S"
    rst_firewall: "find the rule that rejects port %d: sudo nft list ruleset or iptables -S"
    rst_no_listener: "start the service on port %d, or rerun with --listen to test the path only"
    rst_loopback_only: "bind the service to 0.0.0.0 or %s, not to loopback"
    rst_other_address: "bind the service to 0.0.0.0 or %[1]s, or connect the client to %[2]s"
    rst_docker: "Docker publishes this port on %[2]s only. Publish it with -p %[3]s:… or -p %[1]d:…, or change the ports entry in compose the same way"
    rst_no_socket: "check which process listens on port %d, and on which address: edc listen --tcp"
    synack_no_ack: "the reply does not get back. Check the reverse route and the reverse selector"
    syn_no_reply: "this host does not answer the SYN. Check the host firewall, rp_filter and the listen queue (edc trace drop)"
    dropped_unseen: "the kernel drops the SYN on this host. Read the drop reasons above"
    reply_hidden_ipsec: "the reply leaves as ESP. Run edc tcp check --diagnose on the client and join the two reports"
    completed: "the path works. Check the service and the application next"
    completed_temporary: "the path works. The service itself was not tested, because the temporary listener of --listen answered"
    join_file: "join with the client report: %s"
    join_rerun: "to join with the client report, rerun with --json target.json: %s"
  evidence:
    sources: "sources"
    return: "return path"
    drops: "kernel drops"
    verdict: "VERDICT"
    more: "... %d more sources"
    drop_on: "on"
    drop_skip: "skip: %s"
    other_drops: "drops outside a connection attempt: %s"
  verdict:
    no_syn: "no SYN"
    completed: "handshake completed"
    rst: "RST sent"
    synack_no_ack: "no ACK after SYN-ACK"
    syn_no_reply: "no reply"
    dropped_unseen: "dropped, not seen"
    reply_hidden_ipsec: "reply hidden by IPsec"
  route:
    unknown: "unknown"
    failed: "lookup failed: %s"
    device: "dev %s"
    via: "via %s"
    source: "src %s"
    table: "table %s"
    same_interface: "same as the arrival interface"
    other_interface: "differs from the arrival interface %s"
    ipsec: "IPsec policy"
