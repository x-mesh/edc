# English messages of the find command.
find:
  error:
    type: "invalid type %q: use f, d, or l"
    size: "invalid size %q: use a number with K, M, G, or T, such as +100M or -1K"
    changed: "invalid time %q: use a duration such as 10m, 2h, or 1d"
    range: "--workers must be from 1 to 64, and --timeout must be more than 0"
    regex: "invalid pattern: %s"
    group_args: "--group needs a pattern and a path, for example: edc find --group web nginx.conf /etc"
    inventory_without_group: "--inventory works only with --group"
    stdin_filter: "--type, --size, and --changed need paths on disk; give a path instead of stdin lines"
  note:
    summary: "%d matches in %d entries, %s"
    skipped: "skipped %s · -v lists them"
    count_mount: "%d other file systems (--cross-mounts)"
    count_pseudo: "%d kernel file systems"
    count_layer: "%d container image layers (--layers)"
    skip_mount: "mount"
    skip_pseudo: "kernel"
    skip_layer: "layer"
    unreadable: "%d directories are unreadable, so the list can be incomplete"
    unreadable_path: "unreadable"
    stalled: "%d directories did not answer, edc did not read them: %s"
    partial: "the time limit %s ended the search, so the list can be incomplete"
    limited: "edc stopped at %d entries"
    query_cut: "edc uses only the first %d bytes of the query"
    long_line: "a line is longer than %d bytes, edc uses only its start"
    stdin_error: "reading stdin failed, so the candidates stop there: %s"
    mount_error: "cannot read the mount table (%s), so edc skips only /proc, /sys, /dev, and /run"
    skipped_short: "skipped %s"
  picker:
    reading: "reading"
    unreadable: "%d unreadable"
    stalled: "%d not answering: %s"
    partial: "time limit reached"
    exec_failed: "%s failed: %s"
    open_pipe: "stdout is not a terminal, so enter only prints the path"
    view_dir: "edc view opens files, not directories"
    grep_prompt: "grep in %s:"
    hint: "enter print · esc cancel · ↑↓ move · tab preview · ctrl+o edit · ctrl+v view · ctrl+g grep"
    hint_pipe: "enter print · esc cancel · ↑↓ move · tab preview"
    grep_hint: "enter search · esc back"
  preview:
    loading: "reading…"
    error: "cannot read: %s"
    link: "→ %s"
    link_missing: "→ %s (missing)"
    special: "%s, edc does not open it"
    empty: "empty file"
    empty_dir: "empty directory"
    binary: "binary file, %s"
    truncated: "the first %s"
    more: "+%d more"
  group:
    too_old: "the remote edc has no find command, run edc update on the host"
    truncated: "the output is larger than %s"
    partial: "the search did not finish, the list can be incomplete"
    none: "no match"
    summary: "matches on %d of %d hosts"
    status:
      edc_missing: "edc is not installed"
      edc_too_old: "edc is too old"
      unreachable: "cannot connect"
      timeout: "time limit reached"
      invalid_output: "the output is not edc find JSON"
      failed: "failed"
