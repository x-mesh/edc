# English messages for the grep command.
grep:
  failed: "edc grep: %v"
  stdin: "(standard input)"
  bad_level: "edc grep: unknown level %q; use trace, debug, info, warn, error, or fatal"
  bad_status: "edc grep: cannot read status %q; use 5xx, 404, or 500-503, separated by commas"
  bad_time: "edc grep: cannot read time %q; use 10m, 2h, 1d, 2026-10-27 09:00, or 09:00"
  verify_failed: "the index found %d lines but the whole file has %d; the index was removed"
  reason:
    short: "the file has no full block"
  hint:
    prefix: "hint: "
    last: "%s: --last read %s from the end"
    since_whole: "%s: --since read the file whole; add --ordered when the log is in time order to bisect it"
    index_off: "%s: index off (--no-index); the file was read whole"
    index_small: "%d files under %s: no index; files this small are read whole"
    index_first: "%s: first search of this file, read whole; a search within 24h builds an index (--index builds it now)"
    index_built: "%s: index built (%s, %.1f%% of the file, %s); later searches skip blocks"
    index_used: "%s: index used; read %s of %s blocks (%s)"
    index_sequential_read: "%s: more than %d%% of the blocks could match, so the file was read in order"
    index_not_built: "%s: index not built (%s); the file was read whole"
    index_none: "%s: index not used; the file was read whole"
    index_extended: "%s: index extended by %s new blocks"
    index_no_letters: "%s: the pattern has no letters, so the index skipped blocks only by time, level, or status"
    index_invalid: "%s: index discarded (%s)"
    index_stale: "%s: a block did not match its index; the index was removed and the file read whole"
    index_last: "%s: --last reads from the end without the index; read %s"
    index_sequential: "%s: pipes and .gz files are read in order; no index"
    index_unavailable: "%s: no index; the cache directory is not available"
    seek: "%s: --since skipped %s and read %s"
    seek_failed: "%s: lines are not in time order, so the file was read whole"
    no_time: "%s: no timestamps found, so --since and --until matched nothing"
    counted: "%s: counted %s skipped lines for -n"
    skipped_old: "%d files were skipped because they end before --since (by last timestamp, or by modification time for .gz): %s"
    binary: "%d binary files skipped: %s"
