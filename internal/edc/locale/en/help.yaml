  ai:
    summary: "AI coding tool usage and reset times"
    option:
      poll: "time between limit calls, 30s or more, 5m or more for Claude"
      count: "samples to print, 0 runs until you quit"
    notes:
      - "In a terminal, edc opens a table of tokens per interval on this host."
      - "The ▸ row is still open. ↑↓ moves back, +/- changes rows, End goes live."
      - "Σ rows sum the last 10 minutes, hour, and 24 hours at any row size."
      - "The boxes show Claude and Codex limits, reset times, and time left."
      - "On Linux, Claude answers with the token in ~/.claude/.credentials.json."
      - "On macOS, edc reads the Claude usage that edc ai statusline saves."
      - "edc ai statusline install wraps statusLine.command in ~/.claude/settings.json."
      - "That command keeps the old status line. uninstall restores it."
      - "edc never prints or stores that token."
      - "Codex answers through codex app-server."
      - "Each detected reset goes to ai-resets.jsonl next to the history DB."
      - "The last Claude values stay in ai-claude.json in the same directory."
  snapshot:
    summary: "Save host state as one report for report diff"
    option:
      no_write: "save JSON only; requires --output and cannot be combined with --write"
      output: "report file, - for stdout"
      since: "how far back events and changes look (default 6h)"
      force: "replace an existing output file"
      du: "also save edc du of this path; repeat for more paths"
      write: "history DB path (recording is enabled by default); omit the path for the default DB"
    notes:
      - "View a snapshot: edc report show <file.json> (interactive in a terminal)."
      - "List snapshot and diagnostic JSON reports: edc report list [directory]."
      - "By default, snapshot records in the history DB without creating a JSON file. --output also saves JSON; --no-write --output <file|-> saves JSON only."
      - "It saves info, listen, audit, events, and changes results in one report."
      - "The file has mode 0600. It holds accounts, sudo rules, and process names."
      - "JSON files are created only with --output. Use edc history export to export an earlier DB snapshot."
      - "It does not replace an existing file. Add --force to replace it."
      - "Compare two snapshots: edc report diff before.json after.json"
      - "On macOS, info.pressure, audit, events, and changes show skip."
      - "--redact hides the host name, the home path, and IP addresses only."
  report:
    summary: "View and compare saved edc diagnostic results"
    notes:
      - "Reads results saved with --json by edc diagnostic commands."
      - "General JSON, report diff output, and edc log text logs are unsupported."
      - "list [directory] shows paths, run times, and result counts, newest first."
      - "Only that directory is searched, without subdirectories."
      - "In a terminal, edc opens a viewer. f filters, e shows the details, q quits."
      - "diff shows the status change and the metric difference of each probe."
      - "A worse probe returns exit code 1."
  log:
    summary: "Record command output and exit status"
    sub:
      run: "run a command, save its output and exit status"
      history: "browse the saved runs of each command"
      prune: "delete old runs"
    option:
      stream: "stream to record (default both)"
      output: "log file; default creates one file per run"
      command_display: "command detail in markers"
      max_size: "max MiB; 0 disables rotation (default 10)"
      keep_files: "rotated files to keep (default 3)"
      restart: "restart policy (default never)"
      max_restarts: "maximum additional attempts (default 3)"
      restart_delay: "delay before another attempt (default 5s)"
      timeout: "limit per attempt; 0 disables (default 0s)"
      kill_after: "SIGKILL grace period (default 5s)"
    notes:
      - "edc history log opens the same viewer."
      - "history lists argument keys; select one to view its runs."
      - "Enter opens runs, then details. Esc goes back; q quits."
      - "history <command> [args...] matches argv; --command lists keys."
      - "Use --failed for failures and --limit for recent attempts."
      - "d deletes the selected command or run after y. A shared log file stays."
      - "prune deletes old runs: edc log prune --older-than 30d."
      - "The viewer refreshes every 2s. r refreshes now and p pauses."
      - "--follow prints one line when each run starts and ends."
      - "Piped history prints keys without waiting for input."
      - "No setup is required. stdout and stderr go to a separate file for each run."
      - "Each run records its CPU time, peak and average memory, and disk bytes."
      - "Twice the usual duration, memory, or CPU time is yellow."
      - "An explicit shared output file serializes commands with a stable lock file."
      - "Restart and timeout are disabled by default."
      - "External stop signals prevent restarts."
      - "Rotation keeps only this log's .edc.N archives."
      - "It does not expire files from other runs."
      - "Use name or none when arguments can contain credentials."
  remote:
    summary: "Run a recipe on an inventory group"
    option:
      inventory: "inventory YAML path"
      recipe: "recipe YAML path"
      dry_run: "print the plan and exit"
      list: "print the groups and hosts of the inventory"
      force: "skip the question"
      parallel: "hosts to run at the same time"
      group: "an alias for the group argument"
      connect_timeout: "SSH connection time limit"
      output_limit: "output byte limit for each command"
    notes:
      - "Without a group, edc opens a selector."
      - "edc finds inventory.yaml and recipe.yaml."
      - "It looks here first, then in the config directory."
      - "The plan and the results share one host by step table."
      - "Ctrl-C marks the remaining steps as SKIP and returns exit code 4."
  tunnel:
    summary: "Manage SSH tunnels and see which ones are running"
    option:
      file: "tunnels YAML path"
      name: "name of an ad hoc tunnel, default is built from the host and port"
      local: "local forward, [port|auto]:host:port"
      reverse: "remote forward, port:host:port"
      socks: "SOCKS proxy port, or auto"
      save: "save an ad hoc tunnel in tunnels.yaml after it starts"
      all: "apply to every running tunnel"
      connect_timeout: "SSH connection time limit"
    sub:
      list: "print the defined and running tunnels"
      up: "start a tunnel by name, or an ad hoc tunnel with -L, -R, or -D"
      test: "test the connection of a tunnel without starting it"
      down: "stop tunnels by name"
    notes:
      - "Without a subcommand, edc opens a terminal screen to start, stop, create, and remove tunnels."
      - "Without a terminal or with --json, edc prints the list."
      - "Tunnels live in tunnels.yaml. edc looks in ./.edc, the current directory, and the config directory."
      - "host is an inventory host name or an alias of ~/.ssh/config."
      - "edc runs OpenSSH in the background and keeps one state file for each tunnel."
      - "Ports bind to 127.0.0.1. auto picks a free port."
      - "reach is ok if the destination keeps the connection open, and refused if it closes at once. Reverse tunnels show -."
      - "test checks the local port, the SSH login, and the destination as the host sees it. For a reverse tunnel, it checks the remote port and the local target. It starts no tunnel."
  shell:
    summary: "Print shell completion and short aliases"
    option:
      no_alias: "print completion only, without aliases"
    notes:
      - "Without a shell name, edc uses $SHELL. Supports zsh and bash."
      - "Run source <(edc shell) to apply to the current shell."
      - "For future zsh sessions, add source <(edc shell zsh) at the end of ~/.zshrc."
      - "For future bash sessions, add source <(edc shell bash) at the end of ~/.bashrc."
      - "edc prints a script and does not edit startup files. Remove the line to disable it for future sessions."
      - "Existing aliases, functions, and commands are preserved."
    unsupported_shell: "edc shell: %s is not supported; use zsh or bash."
    current_session: "Current session: %s"
    startup: "For future sessions, add this line at the end of %s:"
    read_only: "Prints a script only; startup files are not edited."
  alias:
    summary: "Print short aliases for the shell"
    sub:
      zsh: "print the aliases for zsh"
      bash: "print the aliases for bash"
    option:
      plain: "print bare alias lines without the guard, for pasting into a shell file"
    notes:
      - "source <(edc alias zsh) or source <(edc alias bash). Without a shell name, edc uses $SHELL."
      - "The script skips a name that is already an alias, a function, or a command in your shell, and says how to rename it or remove yours."
      - "An alias adds options before your arguments, and the same option later on the line wins: ege --last 50 app.log."
      - "route, disk, and change have no alias, because a short name invites a mistake on a host change."
    unsupported_shell: "edc alias: %s is not supported; use zsh or bash."
  completion:
    summary: "Print the shell completion script"
    sub:
      zsh: "print the zsh completion script"
      bash: "print the bash completion script"
      groups: "print the inventory group names, one per line"
    notes:
      - "source <(edc completion zsh) or source <(edc completion bash)."
      - "groups prints the group names of the inventory, one per line."
  setup:
    summary: "Configure command defaults"
    option:
      inventory: "inventory file to edit, default is the one edc remote finds"
      recipe: "recipe file to edit, default is the one edc remote finds"
    notes:
      - "The wizard keeps existing values and edits selected sections."
      - "It previews the config before an atomic save."
      - "Setup needs a terminal; cancel returns exit code 4."
      - "edc setup remote edits the inventory of edc remote in a terminal screen."
      - "It keeps the comments of the file and replaces it atomically, with mode 0600 for a new file."
      - "It does not store passwords or keys. Use an SSH alias as the target."
      - "The Steps screen of the same command edits the recipe. It creates ./.edc/recipe.yaml on the first save if no recipe exists."
  update:
    summary: "Install the latest release"
    option:
      check: "print the versions and install nothing"
      yes: "skip the question"
      timeout: "network time limit"
    notes:
      - "edc reads the release asset and checks the SHA-256."
      - "It then replaces the running file."
      - "edc writes the new file beside the old one, so a failure keeps the earlier file."
      - "Without write permission, edc stops with exit code 3 before it downloads."
  version:
    summary: "Print the version"
    notes:
      - "A terminal gets the banner. Everything else gets one line."

  history:
    summary: "Search recorded resource observations"
    sub:
      list: "runs recorded by top -w and snapshot"
      overview: "a run or time window summary"
      export: "a recorded snapshot as a report file"
      trend: "count, min, avg, p95, max per period"
      growth: "disk growth per day, changed directories"
      prune: "delete runs older than an age"
      top: "host samples, newest first"
      process: "process samples, newest first"
      log: "command runs that edc log recorded"
