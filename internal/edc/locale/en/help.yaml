      - "--slow keeps only paired rows at or above the latency."
      - "Latency runs from the first request message to ReadyForQuery."
      - "It hides SQL string values. --show-secrets shows them and error details."
      - "It never shows passwords, Bind values, or COPY data."
      - "A TLS or GSSAPI connection shows one postgres_tls row and nothing more."
      - "It reads TCP only. psql without -h uses a unix socket."
      - "A large result loses framing. The end of the last write gives its latency."
      - "A second pipelined request then leaves both requests unanswered."
      - "trace redis shows plain Redis commands and replies on Linux 5.15+."
      - "It shows both sides. --port is the Redis port. The default is 6379."
      - "--slow keeps only paired rows at or above the latency."
