history:
  usage: "Usage: edc history <list|top|process|export|trend|growth|prune> [options] [DB]"
  option:
    run: "only this run ID"
    from: "inclusive start time (RFC3339)"
    to: "exclusive end time (RFC3339)"
    limit: "maximum rows, 200 by default; 0 means all"
    json: "one JSON line per result, - for stdout"
    metric: "numeric field to filter"
    min: "inclusive minimum; requires --metric"
    max: "inclusive maximum; requires --metric"
    output: "report file for export, - for stdout"
    probe: "trend a snapshot result, such as info.disk:/ or du.scan"
    by: "trend period: hour, day, or week (local time)"
    root: "growth: only the du results of this path"
    each: "trend: one row per process; needs --process"
    growth_process: "growth: RSS change per day of these processes"
    older_than: "prune: delete runs idle for this age (30d, 2w)"
    prune_command: "prune: only top or snapshot runs"
    dry_run: "prune: count without deleting"
    yes: "prune: delete without asking"
    vacuum: "prune: rewrite the file to give the space back"
  error:
    default_path: "The default database path is unavailable; specify --write <path>"
    path: "Use a database file path; JSON output must not overwrite the database or its journal files"
    regular: "The database path must be a regular file"
    schema: "Not a supported edc history database (schema version 1)"
    wal: "Cannot enable SQLite WAL mode on this database"
    queue: "The recording queue is full; stopping observation"
    write: "Recording failed: %v"
    read: "Cannot read history: %v"
    time: "Use RFC3339 times from 1678 to 2261, with --from earlier than --to"
    metric: "Use --metric with a finite --min or --max (min <= max). Fields: %s"
    no_snapshots: "This database has no snapshots. Record one with edc snapshot --write"
    no_run: "No run %s in this database"
    not_snapshot: "Run %s is a %s run, not a snapshot"
    trend_by: "Use --by with one of: %s"
    trend_metric: "Use --metric with a top field, or --probe with a snapshot metric. Top fields: %s"
    trend_probe: "No snapshot metrics named %s. Recorded: %s"
    trend_key: "No %s value named %s. Recorded: %s"
    trend_process_metric: "Use --metric with a process field. Fields: %s"
    trend_process_probe: "Use --process or --probe, not both"
    trend_each: "--each needs --process"
    growth_process_root: "Use --process or --root, not both"
  trend:
    title: "%s by %s, local time %s"
    empty: "No values in this range"
    process_title: "%s of %s by %s, local time %s"
    process_empty: "No samples of %s in this range. Record them with edc top -w --process %s"
    unfiltered: "Some samples of %s come from runs without --process; they count only the moments it was among the top CPU or memory users. Record it with edc top -w --process %s"
  growth:
    window: "Range: %s to %s (local time)"
    empty: "No disk or du snapshots in this range. Record them with edc snapshot -w --du <path>"
    few_samples: "too few samples (%d)"
    short_span: "under 1 hour of records"
    full_in: "about %s"
    days: "%.0f days"
    hours: "%.0f hours"
    per_day: "%s/day"
    dirs_title: "du %s: %s → %s (%.1f days, %d snapshots)"
    one_snapshot: "one snapshot in this range; record another to compare"
    no_change: "no directory changed"
    total: "total %s → %s (%s)"
    leak: "possible leak (fit %.2f)"
    more_processes: "… %d more processes; use --json for all"
  browser:
    targets: "TARGET"
    host: "host"
    loading: "loading"
    growth: "RSS %s, fastest pid %d"
    growth_none: "RSS change: %s"
    leak: "possible leak: %d of %d processes (fit %.2f)"
    help: "↑↓ Target   m Metric   b Period   e Each   PgUp/PgDn Scroll   q Quit"
  prompt:
    top_source: "top · host samples"
    source_title: "which records do you want to trend?"
    source_label: "records"
    metric_title: "which metric?"
    metric_label: "metric"
    run_title: "which snapshot do you want to export?"
    run_label: "snapshot"
    run_item: "%s  %s  %d results"
    target_title: "the whole host or one process?"
    target_label: "target"
    host_target: "host · all samples"
    process_item: "%s  %d samples"
  prune:
    usage: "Usage: edc history prune --older-than <age> [--command top|snapshot] [--dry-run] [--yes] [--vacuum] [DB]"
    none: "No run is older than that."
    plan: "Delete %d runs (top %d, snapshot %d) with %d samples."
    dry_plan: "Dry run: would delete %d runs (top %d, snapshot %d) with %d samples."
    dry_note: "Nothing was deleted. Run again without --dry-run to delete."
    confirm: "Delete them? y/N "
    yes_required: "Add --yes to delete without a terminal, or --dry-run to only count."
    done: "Deleted %d runs with %d samples."
    reusable: "The file keeps its size; %s is free for new records. Add --vacuum to give it back."
    vacuumed: "File size %s -> %s."
    vacuum_failed: "VACUUM failed: %v"
command:
  history:
    notes:
      - "growth estimates when a disk fills at the rate of the range (7d default)."
      - "trend groups one metric by local hour, day, or week, oldest first."
      - "snapshot -w [DB] records a snapshot; export --run <id> writes a report."
      - "top -w [DB] records while the dashboard stays open."
      - "Records append by run. Pausing top also pauses recording."
      - "list shows runs; top and process show newest samples first."
      - "CPU% is user+system for hosts and per core for processes."
      - "Use top-level numeric JSON field names with --metric."
      - "Process samples cover observed candidates, not every process."
      - "No automatic deletion; use a local database file."
      - "Omit the DB path to use the default history database."
