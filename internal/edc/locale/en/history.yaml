history:
  help_sections:
    storage:
      title: "Database and files"
      notes:
        - "The local history DB stores `snapshot` and `top` observations. Optional `<DB>` selects another database."
        - "JSON snapshots: `edc report list` lists files; `edc report show <file.json>` opens one."
    recording:
      title: "Record"
      notes:
        - "`edc snapshot` records by default. Add `--output <file>` for JSON; `edc history export --run <id>` exports an earlier snapshot."
        - "Use `edc top -w` or press `w` in top to start/stop recording. `p` pauses recording with collection."
    browsing:
      title: "Browse"
      notes:
        - "`edc history list`, `edc history top`, and `edc history process` open interactive browsers in a terminal."
        - "`↑↓` selects, `Enter` opens details, `Home` follows latest; wide screens add columns and a detail panel."
    analysis:
      title: "Trends and growth"
      notes:
        - "`edc history trend` reads DB metrics by local hour, day or week. `edc history growth` shows disk/directory growth or process RSS growth (7 days by default)."
        - "Use `--process <filter>` for processes. Unfiltered samples cover observed candidates; host CPU% uses all cores and process 100% uses one core."
    cleanup:
      title: "Cleanup"
      notes:
        - "`edc history prune` previews runs idle for `90d`; `t` changes the age, `d` then `y` confirms checked runs."
        - "No automatic deletion. See `edc history prune --help` for `--dry-run`, `--yes` and `--vacuum`."
  prune_help:
    interactive_title: "Interactive browser"
    retention: "Without `--older-than`, preview runs idle for `90d`. Scripts need an explicit `<age>`."
    keys: "`↑↓` select · `Space` check · `a` all · `Enter` details · `q` quit."
    period: "`t` chooses the age; presets or custom values such as `12h`, `14d`, `2w`."
    deletion_title: "Deletion and disk space"
    confirm: "`d` then `y` deletes checked runs and their observations. `--dry-run` only previews; `--yes` skips the browser and confirmation."
    recheck: "Last activity includes start, end and the latest observation. Runs with newer activity are checked again before deletion."
    vacuum: "Deleted space is reused inside the DB. `--vacuum` returns it to disk and can make other writers wait."
    storage_title: "Database"
    storage: "Optional `<DB>` selects another history database. Snapshot JSON files are managed with `edc report list` and `edc report show <file.json>`."
