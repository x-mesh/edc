command:
  history:
    notes:
      - "In the prune browser, t opens the age picker. Choose a preset or enter a duration; candidates reload and deletion uses the chosen age."
      - "In a terminal, history prune without --older-than previews runs idle for 90 days. Outside the browser, --older-than is required."
      - "growth opens a selection/details browser. prune shows candidates: Space toggles, a selects all, d then y confirms deletion. --dry-run only previews; --yes uses the existing command output."
      - "history process also opens a browser: ↑↓ selects, Enter shows PID, CPU, memory, I/O and available limits; wide screens add columns and details."
      - "In a terminal, history top opens a browser: ↑↓ selects, Enter opens details, Home follows the newest sample."
      - "Top history adds disk/network/swap columns as space allows; a wide screen shows selected sample details."
      - "The history DB is a local SQLite file holding snapshots (saved by default) and observations from top -w."
      - "trend and growth read this DB; they do not read JSON files made by snapshot."
      - "List JSON snapshots with edc report list; open one with edc report show <file.json>."
      - "growth estimates when a disk fills at the rate of the range (7d default)."
      - "trend groups one metric by local hour, day, or week, oldest first."
      - "overview summarizes a run or time window with host metrics and recorded top processes."
      - "snapshot records by default; snapshot -w <DB> selects a DB; export --run <id> writes JSON."
      - "top -w [DB] records while the dashboard stays open."
      - "Records append by run. Pausing top also pauses recording."
      - "list shows runs; top and process show newest samples first."
      - "CPU% is user+system for hosts and per core for processes."
      - "Use top-level numeric JSON field names with --metric."
      - "Process samples cover observed candidates, not every process."
      - "No automatic deletion; use a local database file."
      - "Omit the DB path to use the default history database."
