# English messages for edc report join.
join:
  error:
    not_pair: "report join needs one tcp.diagnose report and one tcp.expect report: %s is %s, %s is %s"
    no_probe: "neither tcp.diagnose nor tcp.expect"
  label:
    client: "client"
    target: "target"
    time: "time"
    verdict: "VERDICT"
    warning: "warning:"
    checklist: "checklist for the device engineer:"
  line:
    client_counts: "connected %d of %d · refused %d · timeouts %d · SYN retransmits %d · drops on the client: %s"
    target_source: "from %s on %s"
    target_overall: "no source matches the client (overall verdict %s)"
    target_counts: "SYN in %d · SYN-ACK out %d · RST out %d · handshakes %d · kernel drops: %s"
    time: "start skew %s (target minus client) · %s"
    overlap_yes: "the runs overlap"
    overlap_no: "the runs do not overlap (gap %s)"
  value:
    unknown: "unknown"
    none: "none"
  warning:
    no_overlap: "the two runs do not overlap in time: client %s, target %s, gap %s. The target did not watch while the client sent, so the verdict is weaker"
    port_mismatch: "the client connected to port %s, but the target watched port %d"
    from_excludes: "the target watched only --from %s, which does not include the client source %s"
    source_missing: "the client source %s is not among the target sources (%s). If the client did not connect, the target is judged as no_syn for this client. NAT on the path may have changed the source address"
    temporary_listener_works: "the path works. The service itself was not tested, because the target ran tcp expect --listen"
    temporary_listener: "the target ran tcp expect --listen, so a temporary listener of edc answered and not the service. The service itself was not tested"
  reason:
    basis_phases: "the client judged from connect phases only, without the event trace. A drop on the client host itself is not excluded"
    rst_lost: "the target sent RST, but the client saw no answer. The RST did not come back, which points at the return path"
    rst_from_path: "the client got RST, but no SYN reached the target. A device on the path sent the RST"
    reply_hidden: "the target's reply left through an IPsec policy as ESP, so edc cannot see whether it was sent. Compare the IPsec SA counters on both ends"
    intermittent: "some attempts connected and some did not. Compare the attempt counts on both sides to see whether SYNs were lost"
    mismatch: "the two reports do not describe the same flow: check the port, the time window, and the source address"
    dns_failed: "the client did not resolve the host, so it sent no SYN"
    no_attempt: "the client finished no attempt, so there is no client verdict"
    unreachable: "the client got a network error before any answer. Check the client route first"
    unknown_pair: "this pair of verdicts is not in the table"
    from_excludes: "the target filter excluded the client source, so no_syn is not evidence"
  segment:
    between_hosts: "the path between the hosts drops the SYN from %s to %s: tunnel selector, firewall policy, or NAT"
    return_path: "the return path from %s to %s drops the answer: reverse route, reverse selector, or rp_filter on the client side"
    target_host: "the target host %s answers wrong or not at all: no listener, host firewall, rp_filter, or a full listen queue"
    client_host: "the client host %s drops its own packets (%s): its own firewall"
    path_quality: "the path from %s to %s works but loses packets: run edc net mtu"
    works: "the path from %s to %s works. Check TLS and the application next"
    inconsistent: "the reports do not match (client %s, target %s): check the ports, the time window, and the source"
    undetermined: "edc cannot name a segment (client %s, target %s)"
  check:
    selector_forward: "the traffic selector must include %s → %s"
    policy_hits: "the policy hit count and the deny log for %s → %s"
    nat_exemption: "the NAT exemption for %s → %s (the SYN must keep its source address)"
    forward_path: "the forward route from the device toward %s and toward %s"
    target_filter: "a device filter in front of the target that blocks port %s toward %s"
    selector_reverse: "the reverse traffic selector must include %s → %s"
    reverse_route: "the reverse route on the device from %s back to %s"
    client_rp_filter: "rp_filter and the host firewall on the client %s for the returning packets"
    target_return: "the target sends its answer by: %s"
    listener: "a process listens on port %s: edc listen --tcp"
    host_firewall: "the host firewall on the target accepts port %s from %s: nft list ruleset"
    listen_queue: "the listen queue of port %s is not full: ss -ltn"
    target_drops: "the kernel drop reasons on the target: %s"
    target_rp_filter: "rp_filter on %s: the answer leaves by another interface (%s)"
    client_firewall: "the client firewall rules for %s → %s (drop reasons: %s)"
    client_ruleset: "sudo nft list ruleset or iptables -S on the client"
    mtu: "edc net mtu %s"
    retransmits: "retransmits: client SYN %d, data %d · target SYN %d, SYN-ACK %d"
    attempt_counts: "attempts: client %d (connected %d) · target %d (handshakes %d)"
    tls: "edc tls check %s"
    application: "the application log on the target"
    same_port: "the same port on both sides: client %s, target %d"
    same_time: "the two commands ran at the same time"
    same_source: "the same source address: client %s, target %s"
    rerun: "run both commands again at the same time, with root on the client for the event trace"
