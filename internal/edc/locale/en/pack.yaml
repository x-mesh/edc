# English messages for the pack command.
pack:
  packed: "%s → %s  %d files  %s → %s (%s)  %s"
  unpacked: "%s → %s  %d files, %d directories  %s → %s  %s"
  skipped: "  · %d special files skipped"
  not_smaller: "  · not smaller than the input; the data is likely compressed already"
  not_smaller_kept: "  · not smaller than the input, so edc kept %s although --rm was given"
  list_single: "%s: %s, one file, %s unpacked"
  list_summary: "%d files, %d directories, %s"
  cancelled: "edc pack: cancelled; edc deleted the partial output"
  paths: "%d paths"
  hint_bundle: "to make one archive: %s"
  error:
    level: "edc pack: --level takes 1 to 9: %d"
    unknown: "not gzip, zstd, xz, bzip2, zip, or tar data"
    directory_extract: "a directory is not an archive; run edc pack without -x to pack it"
    remove_directory: "--rm works with files only; edc does not delete a directory"
    inside: "the output is inside the directory that it packs; give -o outside it"
    root: "edc pack does not pack /"
    list_directory: "-l reads an archive, not a directory"
    exists: "the output exists; delete it or give -o"
    exists_named: "%s exists; delete it or give -o"
    exists_file: "%s exists; give --force to replace it, or -o %s"
    exists_dir: "%s exists; delete it or give -o %s"
    kept: "%d entries were skipped, so edc kept the archive; delete it yourself"
    no_replace: "this file system cannot move a directory without replacing one that exists, so edc does not extract here; give -o a directory on another file system"
    same_name: "%s and %s have the same name in the archive: %s; rename one or pack them apart"
    unsafe_path: "the archive has an entry outside the output directory: %s"
    unsafe_link: "the archive has a link that points outside the output directory: %s"
    zip_name: "zip data, but the name does not end in .zip, so it can be a document such as .docx; give -x to extract it or -z to compress it"
    foreign: "%s data is already compressed, and edc cannot extract it; give -z to compress it anyway"
    zip_encrypted: "the zip has an encrypted entry, and edc does not read encrypted zips: %s"
    zip_method: "a zip entry uses a compression method that edc does not read: %s"
  verbose:
    decision: "%s: %s → %s"
    kind_directory: "directory"
    kind_bundle: "one archive"
    kind_compressed: "%s, one file"
    kind_compressed_tar: "%s tar"
    kind_tar: "tar"
    kind_plain: "not compressed"
    kind_zip: "zip"
    action_pack: "pack"
    action_compress: "compress"
    action_extract: "extract"
    action_list: "list"
    progress: "%s  %s / %s (%d%%)  %s"
    progress_bytes: "%s  %s  %s"
    progress_files: "%s  %d files  %s  %s"
    apple_double: "macOS AppleDouble"
    socket: "socket"
    char_device: "character device"
    block_device: "block device"
