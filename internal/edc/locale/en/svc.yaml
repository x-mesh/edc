    summary: "%d processes, CPU %.1f%%, RSS %s"
  fd:
    denied: "permission denied"
    no_limit: "no limit"
    high: "%d processes use 80%% or more of the fd limit: %s"
    unlimited: "%d processes have no fd limit"
    ok: "highest fd use: %s"
  listen:
    none: "the unit processes own no listening tcp or udp socket"
    summary: "listens on %s"
  journal:
    none: "no error lines in the journal"
    errors: "%d recent error lines, latest: %s"
  evidence:
    processes: "processes (%d of %d)"
    fd: "open fds / soft limit"
    sockets: "sockets"
    journal: "journal"
