watchfs:
  summary: "%d events · %d actions · %d failed · %s"
  stop:
    duration: "stopped: --duration reached"
    cancelled: "stopped: interrupted"
    watch_error: "stopped: watcher error"
  option:
    recursive: "watch subdirectories; do not follow directory symlinks"
    event: "comma-separated create,modify,remove,rename events"
    match: "root-relative glob; ** matches across directories"
    exec: "shell command to execute when the filter matches"
    rules: "YAML rules file; command is an argv list"
    debounce: "coalesce events per rule; default 200ms"
    timeout: "action time limit; default 30s"
    json: "JSON Lines output path; - for stdout"
    dry_run: "show matching actions without executing them"
    smart: "merge a change into a line and hint at noisy dirs; on in a terminal"
    no_smart: "print every event as it comes, with no hints"
    exclude: "exclude glob; repeatable; adds to the defaults"
    no_default_exclude: "do not exclude .git, node_modules, .venv, and caches"
    driver: "Linux driver: auto, fanotify, or inotify; default auto"
  invalid_options: "Invalid watch fs options: one directory, nonnegative duration/debounce, and positive timeout are required."
  rules_exec_conflict: "--rules and --exec cannot be combined."
  smart_conflict: "--smart and --no-smart cannot be used together"
  smart_json_conflict: "--smart cannot be used with --json, because JSON keeps every event"
  by: "by %s"
  top_heading: "most active directories:"
  hint_prefix: "hint"
  noisy: "%s had %d events in the last %s. To leave it out, add --exclude %s"
  output_conflict: "JSON output must not overwrite the rules file."
  directory_required: "Watch/action directory is not available: %s"
  too_many_rules: "At most 128 action rules are allowed."
  too_many_files: "Too many files to watch for the open file limit; narrow the scope with --exclude"
  invalid_driver: "Unsupported driver %q; use auto, fanotify, or inotify."
  driver_unsupported: "The %s driver is not available on this OS; use --driver auto."
  watch_limit: "Exceeded the inotify watch limit (fs.inotify.max_user_watches); narrow the scope with --exclude or raise the limit. Run as root to use fanotify, which has no watch limit"
  overflow: "The file event queue overflowed and changes were lost; observation is incomplete."
  duplicate_rule: "Duplicate rule name: %s"
  command_required: "Rule %s needs a nonempty command argv list."
  single_document: "Rules must contain one YAML document, at most 1 MiB."
  rules_required: "The rules file must contain at least one action rule."
  invalid_event: "Unsupported file event %q; use create,modify,remove,rename. Reading files is not a change event."
  invalid_glob: "Invalid root-relative glob: %q"
  root_removed: "Watched directory was removed or renamed: %s"
  rescanned: "File events were dropped; rescanned %s. The order of its changes is unknown."
  rescan_partial: "File events were dropped; rescanned the first %[2]d entries of %[1]s. Some changes can be missing."
  source_closed: "Filesystem event source closed unexpectedly; observation is incomplete."
  fanotify:
    unavailable: "fanotify is not available: %v"
    fallback: "fanotify is not available; watching with inotify: %v"
    permission: "CAP_SYS_ADMIN is required; run as root."
    kernel: "The kernel does not support FAN_REPORT_TARGET_FID; Linux 5.17 or later is required."
    filesystem: "This filesystem does not support the file handles that fanotify needs."
    skipped: "fanotify cannot watch %d mounts below the watched directory; changes below them are not reported: %s"
    path: "The file handle of the watched directory resolves to a different path: %s"
    dropped: "Dropped %d events whose path could not be found; changes in the watched directory can be missing."
  walking: "Adding a watch to each directory under %s… A large tree takes time. Output starts when edc is ready."
  ready: "WATCH %s · recursive=%t · driver=%s"
  ready_reason: "WATCH %s · recursive=%t · driver=%s (%s)"
  driver_reason:
    not_recursive: "not recursive"
    fanotify_unavailable: "fanotify unavailable"
  status:
    actions: "action %d"
    failed: "failed %d"
    last: "last %s ago"
  output_truncated: "Action output truncated at %d bytes."
