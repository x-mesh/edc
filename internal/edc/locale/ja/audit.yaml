# audit コマンドの日本語メッセージ。
audit:
  accepted: "受け入れ済み (%s): %s"
  skip:
    linux_only: "audit は Linux でのみ動作します"
    needs_root: "%s を読むには root が必要です"
    unreadable: "%s を読めませんでした: %s"
    no_firewall_tool: "nft と iptables-save のどちらもありません"
    no_sshd: "%s に sshd の設定がありません"
