    older_bad: "%d 個の history ファイルが 1 分を超える最後のセッションの間に変わりませんでした"
    since: "(wtmp は %s から)"
    empty_after: "%s  %s が %s〜%s のセッション (%s) の後に空か、存在しません"
    older_than: "%s  %s の最終変更は %s で、%s〜%s のセッションより前です"
