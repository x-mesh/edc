    match_note: "Match ブロックは解釈しません。実際の値は `sshd -T` で確認してください"
    empty_passwords: "パスワードログインがオンで PermitEmptyPasswords yes です"
    password_on: "パスワードログイン オン: %s"
    password_off: "パスワードログイン オフ"
    keys_ok: "authorized_keys %d 個、他のユーザーが書き込めるファイルなし"
    keys_bad: "他のユーザーが書き込める ~/.ssh のパス %d 個"
    key_changed_ok: "直近 7 日に変更された authorized_keys なし (%d 個を確認)"
