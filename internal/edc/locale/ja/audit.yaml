  net:
    exposed_none: "loopback 以外で待ち受ける DB・制御ポートなし (ソケット %d 個)"
    exposed_open: "%s が loopback 以外で待ち受けており、ホストのファイアウォールが受信を許可しています"
    exposed_filtered: "%s が loopback 以外で待ち受けています。ホストのファイアウォールは既定で遮断します"
    exposed_unknown: "%s が loopback 以外で待ち受けています。root でないためファイアウォールは未確認です"
    cloud_note: "edc はこのホストだけを見ます。クラウドのセキュリティグループがポートを塞いでいる場合があります"
    docker_note: "docker-proxy が開いたポートは FORWARD を通るため INPUT のポリシーは効きません。DOCKER-USER chain を確認してください"
    firewall_drops: "%s: どのルールにも合わない受信を遮断 (input chain %d 個、ルール %d 個)"
    firewall_rules: "%s: 既定で許可、input ルール %d 個 (ルールの順序は解釈しない)"
    firewall_open: "%s に input ルールがなく、受信をすべて許可しています"
    allowed_ports: "設定の allow_ports が %s を許可しています"
