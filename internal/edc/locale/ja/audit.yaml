    keys_command: "AuthorizedKeysCommand %s が渡す鍵は確認しませんでした"
    keys_skipped: "root でないためホームディレクトリ %d 個を読めませんでした"
  account:
    external: "nsswitch.conf は %s からもアカウントを取得します。edc は /etc/passwd のアカウントだけを確認しました"
