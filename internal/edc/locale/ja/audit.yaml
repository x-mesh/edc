    no_logout: "%d 個のアカウントはログイン記録がありますが、wtmp にも journal にもログアウト記録がないため時刻を比較しませんでした"
    short_only: "%d 個のアカウントは 1 分以下のセッションしかないため、時刻を比較しませんでした"
    skipped: "root ではないため、%d 個のホームディレクトリを読めませんでした"
    disabled_ok: "shell history を止める起動ファイルの設定なし"
