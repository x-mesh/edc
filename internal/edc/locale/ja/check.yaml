    summary: "ホスト %d 台、点検 %d 台、結果なし %d 台 · FAIL ホスト %d 台、WARN ホスト %d 台"
    col:
      host: "ホスト"
    status:
      edc_missing: "edc がありません。install.sh でインストール"
