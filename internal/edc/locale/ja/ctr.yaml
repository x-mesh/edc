# ctr コマンドの日本語メッセージ。
ctr:
  skip:
    linux_only: "ctr は Linux の docker container だけを読みます"
    no_docker: "この host に docker がインストールされていません"
    not_running: "container に実行中の process がありません"
    needs_docker_access: "docker daemon に接続するには root か docker グループが必要です"
  list:
    summary: "container %d 件、失敗 %d 件、再起動・一時停止・unhealthy %d 件"
    failed: "container 一覧を読めません: %s"
    column:
      name: "名前"
      state: "状態"
      restarts: "再起動"
      uptime: "稼働"
      memory: "メモリ"
      image: "IMAGE"
  error:
    invalid_reference: "不正な container 名 %q: 英字、数字、_.-/ のみ使い、'-' で始められません"
    not_found: "container %s がありません"
  state:
    summary: "%s、稼働 %s、再起動 %d 回(%s)、image %s"
    no_policy: "再起動ポリシーなし"
    restart_gave_up: "%d 回再起動して %s の上限に達したため、docker は再起動しない"
    health_failed: "health check が %d 回連続で失敗、最新の exit %d: %s"
    inspect_failed: "docker inspect に失敗: %s"
  listen:
    none: "container の process が持つ listen 中の tcp・udp socket なし"
    published_none: "%s(%s で publish)を listen する container の process なし"
    published_loopback: "%s(%s で publish)を loopback でのみ listen。publish した port からの接続は loopback に届かない"
  limits:
    summary: "memory %s · OOM kill %s · CPU throttle %s · pids %s"
    no_limit: "上限なし"
    memory_high: "memory 使用量が上限に近いです: %s"
    oom: "カーネルがこの container の process %d 個をメモリ不足で kill しました"
    throttled: "CPU 上限が container を throttle しました: %s"
    pids_high: "pids 上限がほぼ使われています: %s"
  log:
    none: "最後のログ %d 行にエラー行なし"
    errors: "最後のログ %d 行のうちエラー %d 行、最新: %s"
  disk:
    summary: "%s · writable layer %s"
    log_file: "log %s (%s)"
    log_driver: "log driver %s"
    no_rotation: "rotation なし"
    log_unbounded: "json-file の log に max-size がなく、%s まで大きくなりました。container か daemon の log option で max-size を設定してください"
    writable_large: "container が writable layer に %s を書きました。container を作り直すと消えるため、データは volume に置いてください"
  evidence:
    log: "ログ"
    log_file: "log ファイル"
    health: "health check の記録"
    published: "publish した port"
