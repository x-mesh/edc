# tcp check --diagnose の日本語メッセージ。欠けたキーは en に落ちる。
diagnose:
  error:
    count_range: "--count は 1 から %d の間です"
    interval_range: "--interval は 0s から %s の間です"
    timeout_range: "--timeout は 0s より大きい値です"
  route:
    failed: "経路を調べられませんでした: %s"
  attempt:
    connected: "%s で接続"
    refused: "%s で拒否 (RST)"
    timeout: "%s 応答なし"
    other: "%s: %s"
    local_port: "local port %d"
  fact:
    syn_retransmits: "SYN 再送 %d"
    retransmits: "再送 %d"
    slow_connects: "%d 回は接続に %s 超"
    refused: "拒否 %d"
    timeouts: "応答なし %d"
    other: "その他のエラー %d"
    resets_received: "RST 受信 %d"
    rtt: "rtt %s"
    drops: "この host の drop %s"
  trace:
    skipped: "skip: %s"
    tcp_counts: "SYN 再送 %d、再送 %d、RST 受信 %d、RST 送信 %d"
    tcp_skipped: "TCP イベントは skip"
    drop_counts: "フローを止めた drop %d、その他の drop %d"
    drop_skipped: "drop は skip"
    lost: "追跡がイベントを %d 件取りこぼしたため、件数は実際より少ないことがあります"
    overflow: "追跡はイベントを最初の %d 件までしか残さず %d 件を数えなかったため、件数は実際より少ないことがあります"
    failed: "イベント追跡が止まりました: %v"
    not_ready: "イベント追跡が %s 以内に始まりませんでした"
    linux_only: "イベント追跡には Linux の eBPF が必要ですが、この host は %s です"
    stopped_early: "イベント追跡が始まる前に止まりました"
  basis:
    phases: "イベント追跡を省いたため、接続 phase だけで判定しました: %s"
    partial: "イベント追跡の一部だけで判定しました: %s"
  verdict:
    connected: "%d 回すべて再送や遅延なしで接続しました。TCP 経路は正常です。次は TLS、アプリケーション、LB backend を確認します"
    degraded: "%d 回すべて接続しましたが、問題がありました (%s)。tunnel の品質、MTU/MSS、非対称経路を疑います"
    intermittent: "%d/%d 回だけ接続しました (%s)。失敗する LB backend か、試行ごとに変わる経路を疑います"
    local_drop: "この host がこのフローの packet を破棄しました (%s)。まずこの host を疑います: NETFILTER_DROP なら firewall、それ以外は理由名が示す kernel の処理です"
    refused: "%d/%d 回がすぐに拒否されました (RST)。対象の listener、対象 host の firewall、LB ポリシーを疑います。経路途中の firewall も RST を送ることがあります"
    no_reply: "%d/%d 回が応答を受けませんでした: SYN 再送 %d、handshake なし、この host の drop なし。原因はこの host の外にあります: IPsec selector、外部 firewall、VPN 装置の手前の経路、戻りの経路"
    no_reply_untraced: "%d/%d 回が応答も handshake も受けませんでした。イベント追跡がないため、この host の drop は除外できません。そうでなければ IPsec selector、外部 firewall、VPN 装置の手前の経路、戻りの経路を疑います"
    unreachable: "応答の前に接続が失敗しました: %s。経路を確認します"
    no_attempt: "終わった試行がないため判定できません"
  evidence:
    attempts: "試行"
  next:
    on_host: "%s で実行"
  peer:
    cancelled_early: "最初の接続を試す前に止まったため、判定する結果はありません"
    invalid: "--peer には host や user@host のような ssh の接続先を指定します。%q は使えません"
    ssh_failed: "ssh で %s に接続できませんでした: %s"
    edc_missing: "%s に edc がインストールされていません。その host にインストールしてから、このコマンドをもう一度実行します: %s"
    version_unknown: "%s の edc が version を返しませんでした: %s"
    version_old: "edc %s (%s) は --peer に必要な %s より古いです。%s で edc update を実行します"
    sudo_password: "%s で tcp expect を実行するには root か CAP_NET_RAW が必要ですが、sudo がパスワードを求めます (%s)。ssh の接続先を root@%s にするか、%s をパスワードなしで sudo 実行できるようにします"
    not_ready: "%s の tcp expect が %s 以内に開始しませんでした: %s"
    ended: "%s の tcp expect が開始前に終了しました (exit %s): %s"
    no_report: "%s の tcp expect が report を返しませんでした (exit %s): %s"
    empty_report: "出力に tcp.expect の report がありません"
    saved: "保存: %s"
