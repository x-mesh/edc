# edc tcp expect の日本語メッセージ。
expect:
  prompt_port: "port"
  prompt_hint: "対象 host で実行し、port に SYN が届くかと、この host がどう応答するかを表示します。\nclient が接続する port を入力してください。例: 2142"
  port_invalid: "port は 1 から 65535 までの数値にしてください: %s"
  from_invalid: "--from には IP アドレスか CIDR 範囲を指定してください: %s"
  duration_range: "--duration は 0s 以上、%s 以下にしてください"
  until_invalid: "--until には syn か handshake を指定してください: %s"
  stop_after_invalid: "--stop-after は 1 以上にしてください: %d"
  listen_busy: "--listen: port %d ではすでに待ち受けている process があります (%v)。edc は port を奪いません。サービスを試すには --listen を外してください"
  listen_failed: "--listen: port %d を開けませんでした: %v"
  linux_only: "tcp expect は Linux でのみ動きます。現在は %s です"
  live:
    from: "送信元 %s"
    stop: "停止"
    until_syn: "最初の SYN まで"
    until_handshake: "最初の handshake まで"
    stop_after: "接続試行 %d 件まで"
    drop_on: "kernel drop 理由: 有効 (kernel が捨てた packet は理由付きの DROP 行に出ます)"
    drop_skip: "kernel drop 理由: skip (%s)"
    waiting: "port %d への SYN を待っています。いま client から接続してください。例: %s"
    this_host: "<この-host-のアドレス>"
    other_addresses: "この host の他のアドレス: %s"
    retransmit: "再送 %d"
    duplicate: "同じ packet が別の interface にも見えます"
    handshake_time: "handshake %s"
  listener:
    present: "listener: %[1]s、アドレス %[2]s"
    loopback: "listener: %[1]s、アドレス %[2]s。loopback だけに bind しているため、他の host からの SYN は RST を受けます"
    none: "listener: なし。--listen を付けないと SYN は RST を受けます"
    unknown: "listener: 不明 (%s)"
    temporary: "listener: 一時。終了まで edc が %s で接続を受け付けてすぐ閉じます"
    unknown_process: "不明な process"
  summary:
    no_syn: "%[2]s の間、port %[1]d への SYN はありませんでした。packet がこのホストまで届いていません"
    no_syn_ipsec: "%[2]s の間、port %[1]d への SYN は見えませんでした。IPsec transport mode は届いた packet を edc から隠すことがあります"
    completed: "%[1]s, %[2]s: 接続 %[4]d 件のうち %[3]d 件が handshake を終えました"
    rst: "%[1]s, %[2]s: SYN %[3]d 件が届き、RST %[4]d 件を返しました。port に listener がないか、host firewall が拒否しています"
    synack_no_ack: "%[1]s, %[2]s: SYN %[3]d 件が届き、SYN-ACK を %[4]d 回送りましたが ACK が戻りません。戻り経路 (逆方向 route や逆方向 IPsec selector) を疑ってください"
    syn_no_reply: "%[1]s, %[2]s: SYN %[3]d 件が届きましたが、このホストは SYN-ACK も RST も送っていません。host firewall、rp_filter、満杯の listen queue のどれかが破棄しています"
    reply_hidden_ipsec: "%[1]s, %[2]s: SYN %[3]d 件が届き、handshake は終わっていません。応答は IPsec policy で ESP として出るため、edc からは見えません"
    rst_hidden: "%[1]s, %[2]s: SYN %[3]d 件が届き、kernel は受け取る socket を見つけられませんでした (NO_SOCKET)。port に listener がありません。RST は IPsec policy で ESP として出るため、edc からは見えません"
    dropped_unseen: "%[1]s: packet socket には port %[2]d への SYN が見えませんでしたが、kernel がその port の packet を破棄しました。packet はこのホストまで届いています"
    drops: "(kernel drop: %s)"
    more_sources: "(ほかに送信元 %d 件)"
  warning:
    route_failed: "%s への戻り経路を調べられませんでした: %s"
    rp_filter_strict: "%[1]s の rp_filter が strict (1) で、%[2]s への戻り経路は %[3]s から出ます。kernel はこの SYN を破棄します"
    asymmetric: "%[1]s への応答は SYN が届いた %[3]s ではなく %[2]s から出ます"
    ipsec_transport: "このホストにはこの送信元を受ける IPsec transport mode policy があります。kernel は復号した packet を packet socket に見せないため、届いた SYN を edc が見逃すことがあります。ip -s xfrm state の counter を確認してください"
    socket_drops: "packet socket が packet %d 件を取りこぼしました。件数は実際より少ない可能性があります"
    drop_lost: "drop の追跡がイベントを %d 件取りこぼしたため、この port の kernel drop が欠けている可能性があります"
    untracked: "接続試行か送信元が多すぎたため、接続試行 %d 件を数えませんでした。--from で観測範囲を絞ってください"
    other_ports: "port %[1]d には SYN が来ませんでしたが、他の port には来ました: %[2]s。client が接続する port を確認してください"
  status:
    syn: "SYN %d"
    handshakes: "handshake %d"
    drops: "drop %d"
    other_ports: "他の port: %s"
  next:
    step: "次の手順: %s"
    no_syn: "SYN がこの host まで届いていません。経路 (tunnel selector、firewall、NAT) を確認してください"
    no_syn_ipsec: "IPsec transport mode は届いた SYN を隠すことがあります。接続の前後で ip -s xfrm state の counter を比べてください"
    rst: "listener がないか、host firewall が拒否しています。edc listen --tcp で確認するか、経路だけを試すには --listen を付けて再実行してください"
    synack_no_ack: "応答が client に戻りません。逆方向 route と逆方向 selector を確認してください"
    syn_no_reply: "この host が SYN に応答していません。host firewall、rp_filter、listen queue を確認してください (edc trace drop)"
    dropped_unseen: "この host の kernel が SYN を破棄しています。上の drop 理由を確認してください"
    reply_hidden_ipsec: "応答は ESP で出ていきます。client で edc tcp check --diagnose を実行し、2 つの report を結合してください"
    completed: "経路は動作しています。次にサービスとアプリケーションを確認してください"
    completed_temporary: "経路は動作しています。--listen の一時 listener が応答したため、サービス自体は試していません"
    join_file: "client の report と結合: %s"
    join_rerun: "client の report と結合するには --json target.json を付けて再実行してください: %s"
  evidence:
    sources: "送信元"
    return: "戻り経路"
    drops: "kernel drop"
    verdict: "判定"
    more: "... ほかに送信元 %d 件"
    drop_on: "有効"
    drop_skip: "skip: %s"
    other_drops: "接続試行の外の drop: %s"
  verdict:
    no_syn: "SYN なし"
    completed: "handshake 完了"
    rst: "RST 送信"
    synack_no_ack: "SYN-ACK 後に ACK なし"
    syn_no_reply: "応答なし"
    dropped_unseen: "破棄、見えない"
    reply_hidden_ipsec: "IPsec で応答が見えない"
  route:
    unknown: "不明"
    failed: "調べられません: %s"
    device: "dev %s"
    via: "via %s"
    source: "src %s"
    table: "table %s"
    same_interface: "到着 interface と同じ"
    other_interface: "到着 interface %s と異なる"
    ipsec: "IPsec policy"
