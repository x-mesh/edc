# grep コマンドの日本語メッセージ。
grep:
  failed: "edc grep: %v"
  model:
    embedding_progress: "コード断片をベクトル化中: %d/%d"
    preview: "%s モデルと ONNX Runtime 約 %d MiB を %s にダウンロードします。提供元: Hugging Face と Microsoft。"
    confirm: "ダウンロードして index を作成しますか？ [y/N] "
    noninteractive: "端末がありません。ダウンロードを許可するには --semantic-init --yes を使ってください。"
    cancelled: "モデルのダウンロードを中止しました。"
    unsupported: "このプラットフォームは semantic 検索に対応していません"
    missing: "MiniLM モデルまたは runtime がないか破損しています。edc grep --semantic-init を実行してください"
    status_missing: "モデル: なし、または破損"
    status_ready: "モデル: 準備済み %s"
    cleared: "共有モデルと runtime を削除しました。"
  semantic:
    changed: "ベクトル化中にファイルが変更されました。コマンドを再実行してください"
    method: "semantic 検索 (ローカル embedding + キーワード)"
    init_required: "まず --semantic-init でローカル index を作成してください。"
    usage: "edc grep --semantic-init [--yes] [directory] | --semantic-status [directory] | --semantic-files [directory] | --semantic-clear [directory] | --model-clear"
    one_root: "semantic 検索にはディレクトリが一つ必要です"
    invalid: "semantic index が不正です。--semantic-init で再作成してください"
    backend_error: "ローカル ONNX Runtime の実行に失敗しました"
    loading: "ローカル MiniLM モデルを読み index を確認しています..."
    cleared: "semantic index を削除しました。"
    empty_query: "質問を空にすることはできません。"
  ask:
    changed: "検索中にファイルが変更されました。再実行してください"
    query_limit: "質問が 32 語を超えています。短くしてください。"
    budget: "検索上限 (32 MiB または 50000 断片) に達しました。対象パスを絞ってください。結果は不完全です。"
    method: "キーワード順位検索 (ローカル、semantic モデルなし)"
    skipped: "%d ファイルを除外しました (binary、不正な UTF-8、2 MiB 超)"
  stdin: "(標準入力)"
  bad_level: "edc grep: 不明な level %q です。trace, debug, info, warn, error, fatal のいずれかを指定してください"
  bad_status: "edc grep: status %q を読めません。5xx, 404, 500-503 をコンマで区切って指定してください"
  bad_time: "edc grep: 時刻 %q を読めません。10m, 2h, 1d, 2026-10-27 09:00, 09:00 のように指定してください"
  verify_failed: "index では %d 行ですが全体を読むと %d 行です。index を削除しました"
  reason:
    short: "満杯の block がないファイル"
  hint:
    prefix: "hint: "
    last: "%s: --last で末尾から %s を読みました"
    since_whole: "%s: --since でファイル全体を読みました。ログが時刻順なら --ordered で二分探索します"
    index_off: "%s: index を使わず(--no-index)、ファイル全体を読みました"
    index_small: "%d 個のファイルは %s より小さいため index なしで全体を読みました"
    index_first: "%s: このファイルの初回検索のため全体を読みました。24 時間以内に再検索すると index を作ります (--index で今作成)"
    index_built: "%s: index を作りました (%s、ファイルの %.1f%%、%s)。次回から block を読み飛ばします"
    index_used: "%s: index を使いました。%s/%s block を読み取り (%s)"
    index_sequential_read: "%s: block の %d%% 超が一致し得るため、ファイルを順に読みました"
    index_not_built: "%s: index を作れませんでした (%s)。ファイル全体を読みました"
    index_none: "%s: index を使わずファイル全体を読みました"
    index_extended: "%s: index に新しい block を %s 個追加しました"
    index_no_letters: "%s: パターンに文字がないため、index は時刻、level、status だけで block を読み飛ばしました"
    index_invalid: "%s: index を破棄しました (%s)"
    index_stale: "%s: block が index と一致せず、index を削除してファイル全体を読みました"
    index_last: "%s: --last は index を使わず末尾から読みます。%s を読み取り"
    index_sequential: "%s: pipe と .gz は順に読むため index を使いません"
    index_unavailable: "%s: キャッシュディレクトリを使えないため index がありません"
    seek: "%s: --since で %s を読み飛ばし %s を読みました"
    seek_failed: "%s: 行が時刻順でないためファイル全体を読みました"
    no_time: "%s: 時刻が見つからず --since と --until に一致する行はありません"
    counted: "%s: -n のため読み飛ばした %s 行を数えました"
    skipped_old: "%d 個のファイルは --since より前で終わるため飛ばしました (最後の時刻、.gz は更新時刻で判定): %s"
    binary: "%d 個の binary ファイルを飛ばしました: %s"
