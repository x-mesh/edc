# 日本語メッセージ。欠けたキーは en.yaml に落ちる。
help:
  notes_label: "補足"
  tagline: "everyday carry for SE/SRE"
  usage_label: "使い方"
  usage: "edc <command> [options] [target]"
  common_label: "共通"
  detail_label: "詳細"
  help_command_summary: "command の一覧を表示"
  detail_hint: "edc help <command>"
  options_label: "options"
  common_options_label: "共通 options"
  examples_label: "例"
  group:
    diagnose: "診断"
    observe: "観測"
    host: "ホスト変更"
    record: "記録・遠隔"
    tool: "ツール"

option:
  timeout: "実行の制限時間"
  json: "JSON の出力先、stdout は - か値の省略"
  verbose: "詳細な evidence を表示"
  redact: "出力の機微な値を伏せる"

command:
  doctor:
    summary: "DNS・TCP・TLS・HTTP をまとめて確認"
    option:
      profile: "full は bandwidth と responsiveness を加える"
      all_ips: "DNS の全 IP を確認し ASN holder を参照します"
    notes:
      - "probe を 9 つまとめて実行し、同じ形式で並べます。"
      - "terminal では probe ごとに 1 行を保ち、その場で更新します。"
      - "Ctrl-C で中断すると exit code 4 を返します。"
  dns:
    summary: "名前解決と resolver 設定"
    sub:
      lookup: "システムの resolver が返すアドレス"
      compare: "システム DNS を 1.1.1.1 か --resolver と比較"
      config: "このホストの resolver 設定"
    option:
      resolver: "比較する DNS サーバー。複数指定できます"
    notes:
      - "lookup はアドレス、compare は system DNS と別の resolver を比較します。"
      - "compare は --resolver がなければ 1.1.1.1 を使います。"
  tcp:
    summary: "TCP 接続の確認"
    option:
      diagnose: "接続を繰り返しながら TCP イベントと kernel drop を追跡し、疑わしい区間を示します"
      count: "試行回数 (既定 5)、指定すると --diagnose で実行"
      interval: "試行間隔 (既定 1s)、指定すると --diagnose で実行"
      peer: "この host で ssh 経由で tcp expect を同時に実行し、両方の結果を結合します。指定すると --diagnose で実行"
      wait: "接続できるまで 1 秒ごとに再試行 (1 回の試行は --timeout、既定 3s)。-w=5m なら 5 分後に停止"
      from: "expect: このアドレスや範囲から来た packet だけを数えます"
      duration: "expect: 待つ時間、省略すると Ctrl-C まで"
      until: "expect: 最初の SYN (syn) を見た 1 秒後 (応答も記録するため) か、最初の handshake 完了 (handshake) で止まります"
      stop_after: "expect: N 件目の接続試行を見た 1 秒後に止まります"
      listen: "expect: port に listener がなければ一時 listener を開き、handshake を完了させます"
      ports: "scan: 確認する port と範囲、カンマ区切り (既定: audit の要注意 port と一般的なサービス port)"
      parallel: "scan: 同時に開く接続数 (既定 32、最大 256)"
    notes:
      - "接続できないと phase と cause を残し、exit code 1 を返します。"
      - "--diagnose のイベント追跡は Linux で root として実行したときだけ行います。それ以外は接続だけを繰り返し、追跡は skip です。"
      - "expect はすべての interface でこのホストに届いた SYN と、ホストが返した SYN-ACK や RST を数えます (Linux, root)。"
      - "expect は packet header だけを読み、payload は残しません。"
      - "scan は port ごとに 1 回接続します。open は handshake 成功、refused は RST、no reply は 2s 以内に応答なしで、closed と同じではありません。"
      - "scan は --timeout を scan 全体の予算として使います (既定 60s)。確認できなかった port は not scanned として残します。"
      - "--diagnose は追跡中、試行ごとに 300ms 待つため、試行間隔はそれより短くなりません。"
      - "IPsec transport mode では expect は復号した SYN を見られず、kernel の drop 理由で判定します。"
      - "-w はポートが接続を受け付けるまで待ってから check の結果を出力します。時間制限は -w=5m のように = で付けて書きます。Ctrl-C で止めると終了コード 4 です。"
  tls:
    summary: "証明書と handshake の確認"
    option:
      min_days: "残り日数が N より少なければ fail にします"
    notes:
      - "既定では残り 30 日未満が warning です。--min-days はその基準を fail に上げます。"
  http:
    summary: "HTTP 応答の確認"
    option:
      expect_status: "応答 code が N と違えば fail にします"
      header: "リクエスト header を追加、繰り返し指定可"
      body: "最後の応答の本文を保存、- は stdout に出力"
    notes:
      - "既定では 4xx が warning、5xx が fail です。"
      - "redirect があればリクエストごとに status、URL、時間、peer を順に表示。"
      - "-v は応答ごとの header と最後の応答の本文の先頭を追加。"
      - "Authorization、Cookie などの header の値は隠します。"
      - "--body - は本文を stdout に、結果を stderr に出力。"
  audit:
    summary: "ホストの公開状態と設定を点検、読み取り専用 (Linux)"
    notes:
      - "ファイル、sysctl の値、listen ソケット、ログイン記録、/proc だけを読みます。"
      - "何も変更せず、外部へ送信しません。"
      - "root で実行してください。root でなければ一部が skip です。"
      - "ファイアウォールはこのホストだけで、クラウド側は見ません。"
      - "パッケージのバージョンを CVE と照合しません。"
      - "ログインと history の fail は二つの記録の食い違いで、侵入の証拠ではありません。"
  changes:
    summary: "最近のパッケージ、/etc、service の変更 (Linux)"
    notes:
      - "dpkg・dnf・yum のログ、/etc の mtime、systemd の unit 状態だけを読みます。"
      - "何も変更せず、外部へ送信しません。"
      - "service ごとに最後の起動時刻と再起動回数だけを表示します。"
      - "/etc はファイルの内容ではなく mtime だけを見ます。"
      - "圧縮されたログは読まず、警告で知らせます。"
    option:
      since: "どこまでさかのぼるか、24h や 90m のような Go の duration"
      verbose: "最新の 50 件で切らずにすべて表示"
  check:
    summary: "いま壊れている箇所を一度に洗い出す点検 (Linux、macOS)"
    option:
      routine: "config.toml の [check.routines] にあるルーチンを実行"
      group: "edc remote グループのホストごとに check を実行"
      inventory: "--group で使う inventory ファイル"
      notify: "結果を [notify] の webhook に送る"
    notes:
      - "service、process、メモリ、ディスク、ディスクの健全性、証明書ファイル、カーネルログ、時刻、ネットワーク、container、ファイルハンドル、再起動の要否を見ます。"
      - "標準の点検は何も変更しません。--notify を付けなければ外部に何も送りません。"
      - "問題ごとに続けて見る edc コマンドを next で示します。"
      - "root でなければ一部の点検は pass ではなく skip です。"
      - "macOS では launchd、memory pressure、ディスク、ディスクの健全性、証明書ファイル、ネットワーク、container、ファイルハンドル、診断レポート、thermal pressure、Time Machine を見て、time と reboot は skip です。"
      - "--group は SSH でホストごとに edc check を実行します。各ホストに check を含む edc が必要です。"
      - "ルーチンは config.toml の unit ルール、基準値、シェルコマンドを加えます。コマンドは 0 で終われば pass です。"
  events:
    summary: "カーネル、systemd、macOS の jetsam・パニックのシグナルを時系列で整理"
    option:
      since: "読む期間 (例: 30m、48h)"
    notes:
      - "Linux ではカーネルログと systemd journal を読みます。"
      - "root か adm、systemd-journal グループで実行してください。"
      - "権限がなければ点検は pass ではなく skip です。"
      - "macOS では /Library/Logs/DiagnosticReports の jetsam・パニックレポートを読みます。"
  net:
    summary: "interface、route、ping、trace"
    sub:
      interfaces: "ネットワーク interface とアドレス"
      route: "ホストへ向かう interface と gateway"
      ping: "ホストへ ping"
      trace: "ホストまでの経路、traceroute か tracepath を使用"
      mtu: "分割されずにホストまで届く最大の packet"
    option:
      max: "mtu: 試す最大の packet サイズ (既定: 経路 interface の MTU)"
  route:
    summary: "gateway VM の default route を点検・切り替え・ロールバック"
    sub:
      check: "現在の状態を点検、変更なし"
      switch: "ロールバック timer 付きで切り替えて検証"
      status: "保留中または完了した切り替えを表示"
      rollback: "state ファイル一つでロールバック"
    notes:
      - "経路を変更する gateway VM 上でローカルに実行するコマンドです。"
      - "switch と rollback には root 権限が必要です。sudo は付けません。"
      - "check は経路を変更しません。switch はまずタイマーを武装します。"
      - "status は /run/edc を読み、rollback --state は 1 件を再実行します。"
  disk:
    summary: "ディスク増設後に拡張、残ったディスクイメージを整理"
    sub:
      check: "拡張できる mount か残ったイメージを表示、変更なし"
      grow: "パーティションとファイルシステムを拡張"
      detach: "残った読み取り専用ディスクイメージを取り外し (macOS)"
    notes:
      - "check は層を読むだけで何も変更しません。"
      - "root で実行するとすべての層のサイズが見えます。"
      - "grow には root 権限が必要です。sudo は付けません。"
      - "grow は元に戻せません。先にボリュームのスナップショットを作成してください。"
      - "detach は macOS でのみ動作します。インストール用 DMG のように /Volumes に接続された読み取り専用ディスクイメージを取り外します。"
  change:
    summary: "自動ロールバック付きのホスト変更"
    sub:
      apply: "変更を適用、確定しないとロールバック"
      status: "保留中の変更と残り時間"
      confirm: "変更を確定し、ロールバック timer を停止"
      rollback: "apply 前の状態に戻す"
  top:
    summary: "リアルタイムの resource ダッシュボード"
    option:
      interval: "sampling の間隔"
      count: "表示する行数、0 は継続実行"
      no_header: "host と列見出しを省く"
      process: "一致する PID か command 名のみ、カンマ区切り"
      top: "--process なしで JSON 行ごとに入れる上位 process 数、0 で無効"
      sort: "--top の順序: cpu か mem"
      full: "コマンドライン全体で照合して表示する"
      split: "cpu, mem, disk, net, psi を 1 画面の枠で表示、省略時は全部"
      view: "最初の表示、例: network, split"
      panels: "表の下のパネル: cpu,mem,disk,net,psi,ai,events"
      columns: "all 表示の列グループ、+ で詳細: net+,cpu,mem"
      interface: "net に加える interface: 名前、glob、physical、all"
      detail: "CPU 待ち・I/O 遅延 (Linux eBPF, root)、macOS は CPU 待ち"
      ebpf: "--detail と同じ"
      write: "SQLite に追記、path 省略時は既定 DB"
      auto_record: "高負荷・swap out・メモリ圧迫で5分前から自動記録"
      retain: "記録中、この期間より長く動きのない top 実行を削除 (30d, 2w)"
      json: "sample ごとに 1 行の JSON、stdout は - か値の省略"
    notes:
      - "wでDB記録を開始・停止します。再開すると新しい実行になり、pで記録も一時停止します。"
      - "terminal ではダッシュボードを開きます。q 終了、p 一時停止、+/- interval。"
      - "--count か --json を渡すか、terminal でないか、NO_COLOR なら表で出力します。"
      - "--process では process 表示で開きます。1 で host、f で戻ります。"
      - "f で signal を追跡 (表示→最も忙しい process)。/ で絞り込み、Esc で解除。"
      - "edc top setup は実際の画面を見ながら表示、枠、パネルを選びます。"
  watch:
    summary: "HTTP・ファイル変更の観測と条件付きaction実行"
    sub:
      http: "Ctrl-C まで URL を繰り返し要求"
      fs: "ファイル変更を観測、必要ならコマンド実行"
    option:
      interval: "sample 間隔(秒)、最小 0.1"
      duration: "指定時間で終了。省略時は Ctrl-C まで実行"
    notes:
      - "HTTP観測はwatch httpで実行します。従来のwatch URL形式も利用できます。"
      - "watch fsは既定で現在のディレクトリを監視します。"
      - "ファイルイベントはcreate,modify,remove,renameです。読み取りは検出しません。"
      - "--execまたは--rulesでcommandを実行します。"
  info:
    summary: "system、network、disk の情報"
    option:
      public: "外部 public IP の問い合わせを止める(DNS、-v では ipinfo.io)"
      timeout: "public 取得の制限時間"
      verbose: "public 取得に失敗した理由を表示"
    notes:
      - "既定で public IP を取得し、制限時間内に応答がなければその行を外します。"
      - "disk 使用量は全体から空き容量を引いた値です。"
  view:
    summary: "ログを色付きで読み、ファイルが伸びると追従"
    option:
      lines: "末尾 N 行、画面は N 行を保持 (既定 10,000)"
      follow: "pipe では tail -F のように追従、画面は常に追従"
      stats: "画面を開かずに入力全体の統計を出力して終了"
    notes:
      - "端末ではファイル末尾で画面を開き、新しい行を追従します。"
      - "↑ や PgUp で一覧が止まり、見出し行に新しい行数を数えます。End、l、Esc で再び追従します。"
      - "access log では一覧に時刻、status、method、bytes、path を表示します。保持した行ですべて同じ host、client、日付は隠し、見出し行にその値を示します。c は元の行を表示し、← → で一覧を横にずらします。"
      - "nginx と Apache の access log、JSON lines、ERROR や WARN などの level がある行を読みます。"
      - "統計パネルは status 区分や level 別の数、上位の例外・path・client・プログラム、最後のエラーを表示します。"
      - "統計は画面が保持する行だけを数えます。i でパネルを隠します。"
      - "画面が 120 列以上ならパネルを右に、狭ければ一覧の下に置きます。"
      - "Enter はフィールドと行全体、その下に続く stack trace の行を表示します。"
      - "ファイルがローテートまたは切り詰められると、その位置を示し、新しいファイルを先頭から読みます。"
      - "pipe や NO_COLOR では cat のようにバイトをそのまま出力します。-f は tail -F のように追従します。"
      - "edc alias は ev、evn、evf のような短い alias を出力します。"
      - "--stats は入力全体を一度読み、level や status 別の数、上位の例外・path・client・プログラム、時間範囲を出力します。"
  grep:
    summary: "ログ、コード、ファイルパスを検索"
    option:
      code: ".gitignore を適用してコードの内容を検索"
      paths: "内容ではなくファイルのパスを検索"
      hidden: "コード・パス検索に隠しファイルを含める"
      no_ignore: ".gitignore の規則を適用しない"
      ignore_case: "大文字小文字を無視"
      regex: "パターンを正規表現として解釈 (既定: そのままの文字列)"
      numbers: "行番号を表示"
      files: "一致する行があるファイル名だけ表示"
      context: "一致した行の前後 N 行を表示"
      level: "この level 以上の行: trace, debug, info, warn, error, fatal"
      status: "HTTP status: 5xx, 404, 500-503 をコンマで区切る"
      since: "この時刻以後の行: 10m, 2h, 1d, 2026-10-27 09:00, 09:00"
      until: "この時刻以前の行"
      ordered: "ログが時刻順: --since がファイルを二分探索し、その時刻より前で終わるファイルを飛ばす"
      index: "index を今作る、または使わない (既定: 24 時間以内の 2 回目の検索で作る)"
      jobs: "index を作る goroutine 数 (既定: コアの半分、最大 4、上限 64)"
      verify: "index の結果を全体読みと比較し、誤った index を削除"
      last: "最新の N 件、ファイル末尾から読む"
    notes:
      - "semantic 検索は edc search でローカルに実行します。edc search index init --yes は確認後に英語 MiniLM モデルと runtime をダウンロードします。"
      - "index はプロジェクト外のユーザー cache に保存します。変更したファイルは次の semantic 検索時に再ベクトル化します。"
      - "edc grep は literal、regex、log、code、file path を検索します。semantic の質問は edc search だけで受け付けます。"
      - "端末でパターンだけを指定すると現在のディレクトリのコードを検索します。パイプは stdin を読み、パス指定時は従来のログ検索を使います。"
      - "コード・パス検索は現在のディレクトリから隠しファイルと .git を除いて探します。--hidden と --no-ignore で対象を広げます。"
      - "コード検索はログ index を使わず現在のファイルを読み、行番号を出力します。"
      - "ディレクトリは中のファイルをすべて探します。binary ファイルは飛ばし、.gz と .zst は展開しながら順に読みます。"
      - "出力は grep と同じです。ファイルが複数なら path を、-n なら行番号を付け、-C は前後の行を加えます。"
      - "--since と --until は時刻で行を絞ります。--ordered を付けると --since は時刻順のファイルを二分探索し、その時刻より前で終わるファイルを飛ばすため、数 GB のログでも最近の範囲なら数 MB しか読みません。 edc は 16 か所でしか順序を確認しないため、その間に順序が乱れた区間があると、その区間の行を見落とすことがあります。複数の出所が混ざるログや時刻が戻るログでは --ordered を付けないでください。"
      - "--last はファイル末尾から逆に読み、N 件見つかると止まります。"
      - "--level, --status, --since, --until があるとき、最初の引数が実在するファイルかディレクトリなら pattern を省略できます。"
      - "stack trace の行はその ERROR 行の level と時刻を受け継ぐため、--level error は trace も返します。"
      - "64 MB 以上のファイルは 24 時間以内の 2 回目の検索でキャッシュディレクトリに index を作ります。1 MB ブロックごとにどの文字、時刻、level、status があるかを記録し、次の検索は一致し得るブロックだけ読みます。index はログが末尾にだけ伸びると仮定します。その場で書き換えたファイルは、縮むか先頭または最後の index 済み block が変わるまで index を使い続けるため、そのようなファイルには --no-index か --verify-index を使ってください。"
      - "stderr が端末なら、検索ごとに index を使ったか、作ったか、なぜ使わなかったかを知らせます。"
      - "pipe や NO_COLOR では行のバイトをそのまま出力します。終了コードは見つかれば 0、なければ 1、エラーなら 2 です。"
      - "edc alias は eg、egs、ege のような短い alias を出力します。"
  find:
    summary: "名前でファイルとディレクトリを探す、選択画面付き"
    option:
      type: "この種類だけ: f ファイル、d ディレクトリ、l symlink。複数回またはカンマ区切り"
      size: "N 以上 (+N、N) または N 未満 (-N) のファイル。K、M、G、T は 1024 のべき乗"
      changed: "この時間内に変わったもの: 10m、2h、1d"
      regex: "パターンをパスに対する正規表現として扱う"
      no_ignore: "git の作業ツリー内でも .gitignore を適用しない"
      cross_mounts: "パスの下にある別のファイルシステムも検索"
      layers: "コンテナイメージのレイヤーも検索"
      nul: "パスを改行ではなく NUL で区切る (xargs -0 用)"
