      - "まだ書き込まれているログには --rm を使わないでください。macOS や、別のホストが NFS で書くファイルでは書き込むプロセスが見えず、最後の確認のあとに書いたデータは失われます。"
  pack:
    summary: "ファイルやディレクトリを内容から判断して圧縮または展開"
    option:
      compress: "すでに圧縮したファイルでも圧縮"
      extract: "名前に関係なく展開し、gzip・zstd・xz・bzip2・zip・tar でなければ失敗"
      list: "アーカイブ内の一覧だけを表示し、何も書かない"
      zstd: ".gz や .tar.gz の代わりに .zst や .tar.zst で書く"
      level: "圧縮レベル 1〜9。既定値は gzip が 6、zstd が 3"
      exclude: "ディレクトリをまとめるとき、.gitignore 形式のパターンに合うパスを除く。複数回指定できる"
      gitignore: ".gitignore が無視する項目と .git を除く"
      output: "出力パス: 書くファイル、または展開先のディレクトリ。入力が複数なら、それらをすべて入れる 1 つのアーカイブ"
      remove: "出力を書いてディスクに同期した後、入力ファイルを削除"
      force: "既存の出力ファイルを置き換える。ディレクトリは置き換えない"
      verbose: "判断結果と項目ごとの 1 行、端末なら進行状況を表示"
    notes:
      - "名前ではなく先頭のバイトを見ます。gzip、zstd、xz、bzip2、tar は展開し、他のファイルは圧縮し、ディレクトリは .tar.gz にまとめます。"
      - "zip は名前が .zip で終わるときだけ tar と同じように展開します。.docx や .jar などの文書も中身は zip なので、-x か -z がなければ展開も圧縮もしません。__MACOSX/ はスキップし、zip の項目からは group と other の書き込み権限を外します。"
      - "7z、rar、lz4 のデータはこれ以上小さくならないため、再び圧縮しません。それでも圧縮するには -z を指定します。"
      - "1 KB 以上のファイルを圧縮した結果が入力より小さくなければ、そのことを知らせます。-z がなければ、このとき --rm は入力を残します。"
      - "-z と -x で方向を決めます。gzip データが入った backup.bin に -x を使うと backup.bin.out を書きます。"
      - "最上位がディレクトリ 1 つの tar はそのディレクトリに展開します。項目が複数の tar はアーカイブ名のディレクトリに展開します。"
      - "出力の横の一時ディレクトリに展開してから、最後に所定の場所へ移します。失敗するか Ctrl-C を押すと、途中まで書いた出力を削除します。"
      - "出力ディレクトリの外を指す項目やリンクは拒否します。setuid と setgid は残さず、root なら所有者を保ちます。"
      - "ディレクトリをまとめるとき、symlink はリンクのまま入れます。ソケット、デバイス、FIFO はスキップし、数を知らせます。"
      - "既存のファイルやディレクトリは上書きしません。--rm はディレクトリを削除せず、項目をスキップしたアーカイブは残します。"
      - "-o がなければパスごとに別々に処理します。そのため edc pack * はファイルごとに .gz を 1 つずつ書きます。"
      - "-o と複数のパスを指定すると、1 つの .tar.gz にまとめます。各パスはベース名で最上位に入り、アーカイブも展開せずそのまま入れます。同じ名前のパスが 2 つあるとまとめません。このとき -x と --rm は使えません。"
      - "--force は既存の出力ファイルを置き換えますが、入力そのものは置き換えません。ディレクトリは置き換えません。出力ファイルがすでにあるときは、-o に使える空いている名前を知らせます。"
      - "--exclude と --gitignore はまとめるディレクトリの中に適用し、直接指定したパスは必ずまとめます。--gitignore は git 作業ツリーの最上位まで、そのディレクトリより上の .gitignore も読みます。"
      - "stdin、stdout、-j N が必要なら edc compress と edc decompress を使います。"
  decompress:
    summary: ".gz と .zst ファイルの展開"
    option:
      stdout: "stdout に書き、入力を残す"
      output: "出力パス、入力が一つのとき"
      remove: "出力を書き終えて fsync したあと入力を消す"
    notes:
      - "名前ではなく先頭のバイトを読んで gzip と zstd を見分けます。"
      - "app.log.gz の隣に app.log を書き、app.log.gz は残します。既にあるファイルは上書きしません。"
      - "名前が .gz か .zst で終わらないファイルには -o か -c が要ります。"
      - "入力が壊れているか途切れていると、作りかけの出力を消して exit code 1 で終わります。"
      - "ファイルを渡さないと stdin を読み stdout に書きます。"
      - "Linux では、別のプロセスが入力を書き込み用に開いていると、--rm を付けても消しません。"
      - "まだ書き込まれているログには --rm を使わないでください。macOS や、別のホストが NFS で書くファイルでは書き込むプロセスが見えず、最後の確認のあとに書いたデータは失われます。"
  update:
    summary: "最新 release の導入"
    option:
      check: "新しい版を確認するだけで導入しない"
      yes: "確認を省く"
      timeout: "network の制限時間"
    notes:
      - "GitHub release から asset を取り、SHA-256 を確かめます。"
      - "そのうえで実行ファイルを置き換えます。"
      - "新しいファイルを隣に書いて名前を変えるため、失敗しても元のファイルが残ります。"
      - "書き込む権限がなければ、取得の前に exit code 3 で止まります。"
  version:
    summary: "版の表示"
    notes:
      - "terminal では banner、それ以外では 1 行で出します。"

  history:
    summary: "保存した resource 観測履歴を検索"
    sub:
      list: "top -w と snapshot の記録"
      overview: "実行または時間範囲の要約"
      export: "記録したスナップショットを報告に"
      trend: "期間ごとの件数・最小・平均・p95・最大"
      growth: "ディスクの日次増加と変化したディレクトリ"
      prune: "期間より古い実行を削除"
      top: "host sample、新しい順"
      process: "process sample、新しい順"
      log: "edc log が記録したコマンド実行"
