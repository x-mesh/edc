      - "trace syscall は条件が 5 秒以上続くと event として残します: 同じ呼び出しが毎秒 100 回失敗 (error loop)、1 つのパスへの呼び出しが ENOENT か ENOTDIR で毎秒 50 回失敗 (missing path)、1 つの呼び出しが通常の 10 倍に増加 (call spike)。"
