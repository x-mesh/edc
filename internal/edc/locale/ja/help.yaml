      - "edc history log も同じ画面を開きます。"
      - "history は引数別のキーを表示し、選択すると実行履歴を開きます。"
      - "Enter で履歴と実行詳細、Esc で戻る、q で終了します。"
      - "history <command> [args...] は argv 検索、--command はキー一覧です。"
      - "--failed は失敗のみ、--limit は最近の実行数を指定します。"
      - "d は選んだコマンドか実行を y の確認後に削除します。共有ログは残します。"
      - "prune は古い実行を削除します: edc log prune --older-than 30d"
      - "履歴画面は2秒ごとに更新します。r で即時更新、p で一時停止します。"
      - "--follow は実行の開始と終了を1行ずつ出力します。"
      - "パイプではキー一覧を出力し、入力を待ちません。"
      - "設定なしで stdout と stderr を実行ごとのファイルに記録します。"
      - "実行ごとに CPU 時間、メモリの最大と平均、ディスク量を記録します。"
      - "所要時間・メモリ・CPU 時間が通常の2倍以上なら黄色になります。"
      - "同じ出力ファイルを指定したコマンドは別のロックファイルで直列実行します。"
      - "再起動と timeout は既定で無効です。"
      - "外部の終了シグナルでは再起動しません。"
      - "ローテーションは指定ログの .edc.N のみを整理します。"
      - "他の実行のファイルは削除しません。"
      - "引数に認証情報がある場合は command-display name または none を使用してください。"
  remote:
    summary: "inventory group で recipe を実行"
    option:
      inventory: "inventory YAML の場所"
      recipe: "recipe YAML の場所"
      dry_run: "計画だけを出して終了"
      list: "inventory の group と host を表示"
      force: "確認を省く"
      parallel: "同時に動かす host 数"
      group: "positional な group 引数の別名"
      connect_timeout: "SSH 接続の制限時間"
      output_limit: "command ごとの出力 byte 上限"
    notes:
      - "group を省くと選択画面を出します。"
      - "inventory.yaml と recipe.yaml を探します。"
      - "現在のディレクトリ、次に config ディレクトリの順です。"
      - "計画と結果は host×step の表 1 つを使います。"
      - "Ctrl-C で中断すると残りの step を SKIP にし、exit code 4 を返します。"
  tunnel:
    summary: "SSH トンネルを管理し、実行中のトンネルを確認"
    option:
      file: "tunnels YAML のパス"
      name: "アドホックトンネルの名前、既定はホストとポートから作成"
      local: "ローカルフォワード、[ポート|auto]:ホスト:ポート"
      reverse: "リモートフォワード、ポート:ホスト:ポート"
      socks: "SOCKS プロキシのポートまたは auto"
      save: "アドホックなトンネルを開始後に tunnels.yaml へ保存"
      all: "実行中のすべてのトンネルに適用"
      connect_timeout: "SSH 接続の制限時間"
    sub:
      list: "定義済みと実行中のトンネルを表示"
      up: "名前でトンネルを開始、または -L、-R、-D でアドホックトンネルを開始"
      test: "トンネルを開始せずに接続をテスト"
      down: "名前でトンネルを停止"
    notes:
      - "サブコマンドがない場合は、トンネルの開始、停止、作成、削除を行うターミナル画面を開きます。"
      - "ターミナルでない場合や --json を指定した場合は一覧を表示します。"
      - "トンネルは tunnels.yaml に定義します。edc は ./.edc、カレントディレクトリ、設定ディレクトリの順に探します。"
      - "host はインベントリのホスト名か ~/.ssh/config のエイリアスです。"
      - "edc は OpenSSH をバックグラウンドで実行し、トンネルごとに状態ファイルを1つ保持します。"
      - "ポートは 127.0.0.1 にバインドします。auto は空いているポートを選びます。"
      - "到達は、宛先が接続を維持すれば ok、すぐに切断すれば refused です。リバーストンネルは - を表示します。"
      - "test はローカルポート、SSH ログイン、ホストから見た宛先を確認します。リバーストンネルではリモートポートとローカル対象を確認します。トンネルは開始しません。"
  shell:
    summary: "シェル補完と短いエイリアスを出力"
    option:
      no_alias: "エイリアスを除き補完だけを出力"
    notes:
      - "シェル名を省略すると $SHELL を使います。zsh と bash に対応します。"
      - "source <(edc shell) で現在のシェルに適用します。"
      - "zsh で継続して使うには ~/.zshrc の末尾に source <(edc shell zsh) を追加します。"
      - "bash で継続して使うには ~/.bashrc の末尾に source <(edc shell bash) を追加します。"
      - "スクリプトを出力するだけで起動ファイルは変更しません。追加した行を削除すると次のシェルから無効になります。"
      - "既存のエイリアス、関数、コマンドを保持します。"
    unsupported_shell: "edc shell: %s は未対応です。zsh または bash を指定してください。"
    current_session: "現在のセッションに適用: %s"
    startup: "継続して使うには %s の末尾に次の行を追加してください:"
    read_only: "スクリプトの出力のみでシェル起動ファイルは変更しません。"
  alias:
    summary: "shell 用の短い alias を出力"
    sub:
      zsh: "zsh 用の alias を出力"
      bash: "bash 用の alias を出力"
    option:
      plain: "guard なしで alias 行だけを出力します。shell の設定ファイルに貼るときに使います"
    notes:
      - "source <(edc alias zsh) または source <(edc alias bash)。shell 名がなければ $SHELL を使います。"
      - "すでに alias、関数、コマンドである名前は飛ばし、名前を変えるか自分のものを消す方法を知らせます。"
      - "alias は引数の前にオプションを足すだけで、同じオプションを後ろで指定するとその値が勝ちます: ege --last 50 app.log。"
      - "route、disk、change に alias はありません。短い名前はホスト変更での誤操作を招くためです。"
    unsupported_shell: "edc alias: %s は対応していません。zsh か bash を使ってください。"
  completion:
    summary: "shell completion の出力"
    sub:
      zsh: "zsh completion script を出力"
      bash: "bash completion script を出力"
      groups: "inventory group 名を 1 行に 1 つ出力"
    notes:
      - "source <(edc completion zsh) または source <(edc completion bash)。"
      - "groups は inventory の group 名を 1 行ずつ出します。"
  setup:
    summary: "command デフォルトの設定"
    option:
      inventory: "編集するインベントリファイル、既定は edc remote が見つけるファイル"
      recipe: "編集するレシピファイル、既定は edc remote が見つけるファイル"
    notes:
      - "wizard は既存値を保ち、選択した section だけを変更します。"
      - "設定全体を表示してから atomic に保存します。"
      - "terminal が必要で、取消は exit code 4 です。"
      - "edc setup remote は edc remote のインベントリを端末画面で編集します。"
      - "ファイルのコメントを保ち、原子的に置き換えます。新しいファイルの権限は 0600 です。"
      - "パスワードや鍵は保存しません。接続先には SSH alias を使います。"
      - "同じコマンドの Step 画面でレシピも編集します。レシピがなければ初回の保存時に ./.edc/recipe.yaml を作ります。"
  update:
    summary: "最新 release の導入"
    option:
      check: "新しい版を確認するだけで導入しない"
      yes: "確認を省く"
      timeout: "network の制限時間"
    notes:
      - "GitHub release から asset を取り、SHA-256 を確かめます。"
      - "そのうえで実行ファイルを置き換えます。"
      - "新しいファイルを隣に書いて名前を変えるため、失敗しても元のファイルが残ります。"
      - "書き込む権限がなければ、取得の前に exit code 3 で止まります。"
  version:
    summary: "版の表示"
    notes:
      - "terminal では banner、それ以外では 1 行で出します。"

  history:
    summary: "保存した resource 観測履歴を検索"
    sub:
      list: "top -w と snapshot の記録"
      overview: "実行または時間範囲の要約"
      export: "記録したスナップショットを報告に"
      trend: "期間ごとの件数・最小・平均・p95・最大"
      growth: "ディスクの日次増加と変化したディレクトリ"
      prune: "期間より古い実行を削除"
