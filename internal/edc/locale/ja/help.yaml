      no_files: "trace syscall: ファイル表を省略"
      all: "trace syscall: 表のすべての行を表示。既定は先頭の行のみ"
      denied: "trace priv: 拒否された capability 検査だけ"
      frequency: "trace cpu: CPU ごとの毎秒 sample 数、既定 99"
      folded: "trace cpu: flame graph 用の folded stack を保存"
      lock_kind: "trace lock: kernel か futex の待ちだけ"
      off_cpu: "trace cpu: thread が眠った時間を stack ごとに"
    notes:
      - "terminal では既定で全画面の trace を開きます。"
      - "/ で process、destination、event、source を絞り込みます。"
      - "s、t、p、c、e で source、target、port、process、event 行を表示します。"
      - "g はスクロールを表示します。"
      - "event 一覧で Up か Down を押すと event を選び、一覧は止まります。"
      - "Enter で全 field と payload 全体を表示し、l か Esc で最新に戻ります。"
      - "trace syscall は kernel 内で数えます。terminal では表を 1 秒ごとに描き直し、Ctrl-C で最終の表を表示します。"
      - "trace syscall -- <コマンド> はコマンドを実行し、終了するまでそのコマンドと子プロセスの呼び出しを数え、コマンドの終了コードを返します。"
