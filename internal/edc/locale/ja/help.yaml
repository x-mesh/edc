# 日本語メッセージ。欠けたキーは en.yaml に落ちる。
help:
  tagline: "everyday carry for SE/SRE"
  usage_label: "使い方"
  usage: "edc <command> [options] [target]"
  common_label: "共通"
  detail_label: "詳細"
  help_command_summary: "command の一覧を表示"
  detail_hint: "edc help <command>"
  options_label: "options"
  common_options_label: "共通 options"
  group:
    diagnose: "診断"
    observe: "観測"
    record: "記録・遠隔"
    tool: "ツール"

option:
  timeout: "実行の制限時間"
  json: "JSON の出力先、stdout は -"
  verbose: "詳細な evidence を表示"
  redact: "出力の機微な値を伏せる"

command:
  doctor:
    summary: "DNS・TCP・TLS・HTTP をまとめて確認"
    option:
      profile: "full は bandwidth と responsiveness を加える"
      all_ips: "DNS の全 IP を確認し ASN holder を参照します"
    notes:
      - "probe を 9 つまとめて実行し、同じ形式で並べます。"
      - "terminal では probe ごとに 1 行を保ち、その場で更新します。"
      - "Ctrl-C で中断すると exit code 4 を返します。"
  dns:
    summary: "名前解決と resolver 設定"
    option:
      resolver: "比較する DNS サーバー。複数指定できます"
    notes:
      - "lookup はアドレス、compare は system DNS と別の resolver を比較します。"
      - "compare は --resolver がなければ 1.1.1.1 を使います。"
  tcp:
    summary: "TCP 接続の確認"
    notes:
      - "接続できないと phase と cause を残し、exit code 1 を返します。"
  tls:
    summary: "証明書と handshake の確認"
    option:
      min_days: "残り日数が N より少なければ fail にします"
    notes:
      - "既定では残り 30 日未満が warning です。--min-days はその基準を fail に上げます。"
  http:
    summary: "HTTP 応答の確認"
    option:
      expect_status: "応答 code が N と違えば fail にします"
    notes:
      - "既定では 4xx が warning、5xx が fail です。"
  net:
    summary: "interface、route、ping、trace"
  route:
    summary: "gateway VM の default route を点検・切り替え・ロールバック"
    notes:
      - "経路を変更する gateway VM 上でローカルに実行するコマンドです。"
      - "switch と rollback には root 権限が必要です。sudo は付けません。"
      - "check は経路を変更しません。switch はまずタイマーを武装します。"
      - "status は /run/edc を読み、rollback --state は 1 件を再実行します。"
  change:
    summary: "自動ロールバック付きのホスト変更"
  top:
    summary: "リアルタイムの resource ダッシュボード"
    option:
      interval: "sampling の間隔"
      count: "表示する行数、0 は継続実行"
      no_header: "host と列見出しを省く"
      process: "一致する PID か command 名のみ、カンマ区切り"
      full: "コマンドライン全体で照合して表示する"
      split: "cpu, mem, disk, net, psi を 1 画面の枠で表示、省略時は全部"
      detail: "CPU 待ちと I/O 遅延を追加 (eBPF, root)、Linux"
      ebpf: "--detail と同じ"
      write: "SQLite に追記、path 省略時は既定 DB"
      json: "sample ごとに 1 行の JSON、stdout は -"
    notes:
      - "terminal ではダッシュボードを開きます。q 終了、p 一時停止、+/- interval。"
      - "--count か --json を渡すか、terminal でないか、NO_COLOR なら表で出力します。"
      - "--process では process 表示で開きます。1 で host、f で戻ります。"
      - "f で signal を追跡 (表示→最も忙しい process)。/ で絞り込み、Esc で解除。"
  watch:
    summary: "HTTP・ファイル変更の観測と条件付きaction実行"
    option:
      interval: "sample 間隔(秒)、最小 0.1"
      duration: "指定時間で終了。省略時は Ctrl-C まで実行"
    notes:
      - "HTTP観測はwatch httpで実行します。従来のwatch URL形式も利用できます。"
      - "watch fsは既定で現在のディレクトリを監視します。"
      - "ファイルイベントはcreate,modify,remove,renameです。読み取りは検出しません。"
      - "--execまたは--rulesでcommandを実行します。"
  info:
    summary: "system、network、disk の情報"
    option:
      public: "外部 ipinfo.io への問い合わせを止める"
      timeout: "public 取得の制限時間"
      verbose: "public 取得に失敗した理由を表示"
    notes:
      - "既定で public IP を取得し、制限時間内に応答がなければその行を外します。"
      - "disk 使用量は全体から空き容量を引いた値です。"
  where:
    summary: "近い地域とこの網の姿"
    option:
      provider: "測定する事業者: all、aws、gcp"
      count: "地域ごとの測定回数"
    notes:
      - "公開 endpoint に TCP handshake だけを開いて閉じます。"
      - "要求を送らず、本文も読みません。"
      - "名前は先に一度だけ解決するので、DNS の時間が距離の値に混ざりません。"
      - "public IP と ASN、Cloudflare PoP、NAT と tunnel の有無もあわせて示します。"
      - "通常はアドレスを表示します。--redact は画面と JSON のアドレスを伏せます。"
      - "terminal では進捗行が確認できた地域の数を示します。q で中断します。"
      - "-v を渡すと事業者ごとの値をすべて開きます。"
  listen:
    summary: "接続を待つ socket の一覧"
    option:
      tcp: "TCP socket だけを表示します"
      udp: "バインドされた UDP socket だけを表示します"
      unix: "unix domain socket だけを表示します"
      all: "TCP と UDP、unix domain socket をすべて表示します"
      watch: "中断するまで開閉する port を表示"
      verbose: "アカウントと descriptor、キューの列を開きます"
    notes:
      - "既定は LISTEN 状態の TCP socket とバインドされた UDP socket です。"
      - "種類の flag は加算ではなく filter です。--tcp は TCP だけ残します。"
      - "二つ渡せば両方残り、--all は unix domain socket まで表示します。"
      - "unix socket は port がなく、経路を住所に書き port 列は - にします。"
      - "macOS の lsof は unix socket の状態を返さないため近似です。"
      - "接続済み socket は対象外です。"
      - "-v はアカウントと file descriptor、キューの列を開きます。"
      - "キューは Recv-Q/Send-Q で、TCP listener では accept キューです。"
      - "キューを返すのは Linux だけで、macOS では - になります。"
      - "-v が増やすのは列だけです。行は変わりません。"
  quality:
    summary: "ネットワークの応答性 (RPM) とスループット"
    option:
      server: "応答性測定の config URL"
    notes:
      - "macOS は networkQuality、他の OS は内蔵の測定を使います。"
      - "内蔵の測定は IETF responsiveness draft に従います。"
      - "--server で config URL を変えます。既定は Apple の mensura サーバーです。"
      - "測定には数十秒かかります。"
      - "制限時間は 30s です。defaults.quality.timeout で変えます。"
      - "defaults.common.timeout は使いません。内蔵の測定は制限時間まで測ります。"
  capture:
    summary: "packet capture (Linux と macOS)"
    option:
      mode: "capture mode (pcap、events)"
      interface: "capture する interface (必須)"
      duration: "capture 時間、最大 60s"
      count: "packet 数、最大 10000"
      filter: "BPF filter"
      output: "pcap の保存先"
      yes: "確認を省く"
    notes:
      - "権限が要る操作です。開始前に計画を示して確認を取ります。"
      - "PCAP には credential や個人情報が入ることがあります。"
      - "JSON の redaction は PCAP の payload には効きません。"
  trace:
    summary: "network、I/O、socket、drop、scheduler を表示・要約"
    option:
      duration: "trace 時間、最大 60s。省略で Ctrl-C"
      slow: "最小 latency。例: 20us、250ms。io/sched の既定 1ms"
      raw: "raw event JSONL を表示"
      live: "互換 flag。trace は既定でリアルタイムに実行"
      group_by: "source、target、port、process、event、path で集計"
      process: "一致する PID か command 名のみ、カンマ区切り"
      destination: "宛先 host と port で絞る"
      detail: "要約で接続や flow を 1 行ずつ表示"
      yes: "確認を省く"
      side: "http と mysql は既定で両側、dns は client 側"
      payload: "trace http, socket: 先頭 4 KiB、=all は 1 MiB まで"
      show_secrets: "http --payload: header 値。mysql: SQL 値"
      tls: "http: OpenSSL の HTTPS 平文、=パスはそのファイル"
      port: "http: この port だけ。mysql: サーバー port、3306"
      container: "この docker container だけ、名前か ID"
      reason: "trace drop: この理由だけ、カンマ区切り"
      device: "trace io: block device major:minor"
    notes:
      - "terminal では既定で全画面の trace を開きます。"
      - "/ で process、destination、event、source を絞り込みます。"
      - "s、t、p、c、e で source、target、port、process、event 行を表示します。"
      - "g はスクロールを表示します。"
      - "event 一覧で Up か Down を押すと event を選び、一覧は止まります。"
      - "Enter で全 field と payload 全体を表示し、l か Esc で最新に戻ります。"
      - "f で詳細表示が最新の event を追います。"
      - "i で一覧の下にプレビューを開閉し、J と K でスクロールします。"
      - "trace http: v は payload 行、m は secret、z は gzip 展開を切り替えます。"
      - "Tab で次の表示、Shift+Tab で前の表示に切り替えます。"
      - "--group-by source、target、port、process、event で group live 行を表示します。"
      - "trace http は path でもまとめます。u を押すか --group-by path を使います。"
      - "trace io は device、process、cgroup、event で行をまとめます。"
      - "trace io の --slow は request latency の下限です。既定は 1ms です。"
      - "trace sched の --slow は span latency の下限です。既定は 1ms です。"
      - "--slow には 20us、500us、2ms のように単位が必要です。数字だけは失敗します。"
      - "グループ画面は event 数を EVENT/s、socket payload traffic を表示します。"
      - "B/s は byte rate、bps と Mbps は bit rate です。Mbps は bps / 1,000,000 です。"
      - "--duration を省略した場合は Ctrl-C で trace を終了します。"
      - "JSONL event には --raw を使います。"
      - "--container は Linux で docker container 一つの event だけを表示します。"
      - "要約は process と相手ごとに行をまとめます。-d は接続ごとに表示します。"
      - "trace dns は Linux で DNS の問い合わせと応答を表示します。port 表示なし。"
      - "trace arp は Linux と macOS で neighbor table の変化を表示します。root 不要。"
      - "trace ndp は IPv6 neighbor について同じことをします。"
      - "trace http は Linux 5.15 以降で平文 HTTP/1.x を表示します。"
      - "trace http は両側を表示します。各行の先頭に client: か server: が付きます。"
      - "client: はこの host が送った要求、server: は local server が受けた要求です。"
      - "--side client か server で片側だけを残します。trace dns は client 側を見ます。"
      - "proxy では 1 つの要求が、受けた server: と送った client: の 2 行になります。"
      - "HTTPS は暗号文なので、新しい接続ごとに tls_hello 行だけを表示します。"
      - "tls_hello には path ではなく server 名 (SNI) と ALPN protocol があります。"
      - "--payload は各 message の先頭を表示します。"
      - "--payload=all は各 message を 1 MiB まで表示します。=all は続けて書きます。"
      - "--port は、この host か相手がその port を使う接続だけを見ます。"
      - "例: trace http --side server --port 8080 は local server を 1 つだけ見ます。"
      - "Authorization、Proxy-Authorization、Cookie、Set-Cookie の値は隠します。"
      - "X-Api-Key、X-Goog-Api-Key、Api-Key、X-Amz-Security-Token の値も隠します。"
      - "trace mysql は Linux 5.15 以降で平文 MySQL のコマンドと結果を表示します。"
      - "両側を表示します。各行の先頭に client: か server: が付きます。"
      - "--port は MySQL サーバーの port です。既定値は 3306 です。"
      - "--slow は最初の応答 latency が指定時間以上の MySQL 行だけを表示します。"
      - "--slow は Go duration 構文を受け付け、応答なしの command は表示しません。"
      - "SQL の文字列値は隠します。--show-secrets で表示します。"
      - "エラー message は隠しません。message に値が入ることがあります。"
      - "TCP だけを見ます。mysql -h localhost は unix socket を使います。"
      - "TCP で見るには -h 127.0.0.1 を使います。"
      - "TLS と圧縮接続は解釈しません。"
      - "trace socket <path> は Linux で stream unix socket ファイルを 1 つ見ます。"
      - "connect、accept、send、recv、eof、close を表示します。SOURCE は相手です。"
      - "client 側の相手は server process です。accept 前は listen した process です。"
      - "accept は接続が backlog で待った時間を表示します。"
      - "payload は隠さずそのまま表示します。全画面では v で表示します。"
      - "trace drop は kernel が packet を破棄した理由と kernel 関数を表示します。"
      - "packet に local socket があれば process を付けます。--reason で絞ります。"
      - "理由ごとの合計は正確です。CPU ごとに毎秒 1,000 件を超えると event は標本です。"
      - "accept queue が満杯で解放された SYN は event にならず、summary で数えます。"
  ai:
    summary: "AI コーディングツールの使用量とリセット時刻"
    option:
      poll: "制限の照会間隔、15s 以上。Claude は 5m 以上"
      count: "表示するサンプル数、0 は継続実行"
    notes:
      - "terminal ではこの host の区間別 token 表をダッシュボードで開きます。"
      - "▸ 行は進行中の区間です。↑↓ 過去の行、+/- 行の区間、End で実時間。"
      - "Σ 行は直近 10 分、1 時間、24 時間の合計です。行の区間に関係しません。"
      - "下の枠は Claude と Codex の制限、リセット時刻、残り時間です。"
      - "Claude は ~/.claude/.credentials.json の token で照会します。"
      - "token は画面にもファイルにも残しません。"
      - "Codex は codex app-server で照会します。"
      - "リセットを検出すると history DB の隣の ai-resets.jsonl に記録します。"
      - "最後に受け取った Claude の値は同じ場所の ai-claude.json に残します。"
  report:
    summary: "保存した edc 診断結果の表示と比較"
    notes:
      - "edc 診断コマンドが --json で保存した結果を読みます。"
      - "一般 JSON、report diff の出力、edc log のテキストログは非対応です。"
      - "list [directory] はパス、実行時刻、結果数を新しい順に表示します。"
      - "指定ディレクトリのみ検索し、サブディレクトリは検索しません。"
      - "terminal ではビューアを開きます。f 絞り込み、e 詳細、q 終了。"
      - "diff は probe ごとの status の変化と metric の差を示します。"
      - "悪化した probe があれば exit code 1 を返します。"
  log:
    summary: "コマンド出力と終了状態を記録"
    option:
      stream: "記録する出力 (既定 both)"
      output: "ログファイル。既定は実行ごとに作成"
      command_display: "開始記録に残すコマンドの範囲"
      max_size: "ファイル最大サイズ MiB。0 は無効 (既定 10)"
      keep_files: "保持するローテーションファイル数 (既定 3)"
      restart: "再起動モード (既定 never)"
      max_restarts: "最大追加実行回数 (既定 3)"
      restart_delay: "次の実行までの待ち時間 (既定 5s)"
      timeout: "試行ごとの時間制限。0 は無制限 (既定 0s)"
      kill_after: "SIGKILL までの猶予時間 (既定 5s)"
    notes:
      - "history は引数別のキーを表示し、選択すると実行履歴を開きます。"
      - "Enter で履歴と実行詳細、Esc で戻る、q で終了します。"
      - "history <command> [args...] は argv 検索、--command はキー一覧です。"
      - "--failed は失敗のみ、--limit は最近の実行数を指定します。"
      - "パイプではキー一覧を出力し、入力を待ちません。"
      - "設定なしで stdout と stderr を実行ごとのファイルに記録します。"
      - "同じ出力ファイルを指定したコマンドは別のロックファイルで直列実行します。"
      - "再起動と timeout は既定で無効です。"
      - "外部の終了シグナルでは再起動しません。"
      - "ローテーションは指定ログの .edc.N のみを整理します。"
      - "他の実行のファイルは削除しません。"
      - "引数に認証情報がある場合は command-display name または none を使用してください。"
  remote:
    summary: "inventory group で recipe を実行"
    option:
      inventory: "inventory YAML の場所"
      recipe: "recipe YAML の場所"
      dry_run: "計画だけを出して終了"
      list: "inventory の group と host を表示"
      force: "確認を省く"
      parallel: "同時に動かす host 数"
      group: "positional な group 引数の別名"
      connect_timeout: "SSH 接続の制限時間"
      output_limit: "command ごとの出力 byte 上限"
    notes:
      - "group を省くと選択画面を出します。"
      - "inventory.yaml と recipe.yaml を探します。"
      - "現在のディレクトリ、次に config ディレクトリの順です。"
      - "計画と結果は host×step の表 1 つを使います。"
      - "Ctrl-C で中断すると残りの step を SKIP にし、exit code 4 を返します。"
  completion:
    summary: "shell completion の出力"
    notes:
      - "source <(edc completion zsh) または source <(edc completion bash)。"
      - "groups は inventory の group 名を 1 行ずつ出します。"
  setup:
    summary: "command デフォルトの設定"
    notes:
      - "wizard は既存値を保ち、選択した section だけを変更します。"
      - "設定全体を表示してから atomic に保存します。"
      - "terminal が必要で、取消は exit code 4 です。"
  update:
    summary: "最新 release の導入"
    option:
      check: "新しい版を確認するだけで導入しない"
      yes: "確認を省く"
      timeout: "network の制限時間"
    notes:
      - "GitHub release から asset を取り、SHA-256 を確かめます。"
      - "そのうえで実行ファイルを置き換えます。"
      - "新しいファイルを隣に書いて名前を変えるため、失敗しても元のファイルが残ります。"
      - "書き込む権限がなければ、取得の前に exit code 3 で止まります。"
  version:
    summary: "版の表示"
    notes:
      - "terminal では banner、それ以外では 1 行で出します。"

  history:
    summary: "保存した resource 観測履歴を検索"
