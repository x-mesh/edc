      - "trace priv は capability 検査、uid と gid の変更、module の読み込みを表示。"
      - "trace reclaim は task がメモリ回収を待った時間を数えます。"
      - "trace cpu は CPU ごとに stack を sampling し、CPU を多く使う関数を表示します。"
      - "trace lock は kernel lock の競合とアドレスごとの futex 待ちを表示します。"
      - "f で詳細表示が最新の event を追います。"
      - "i で一覧の下にプレビューを開閉し、J と K でスクロールします。"
      - "trace http: v は payload 行、m は secret、z は gzip 展開を切り替えます。"
      - "Tab で次の表示、Shift+Tab で前の表示に切り替えます。"
      - "--group-by source、target、port、process、event で group live 行を表示します。"
      - "trace http は path でもまとめます。u を押すか --group-by path を使います。"
      - "trace io は device、process、cgroup、event で行をまとめます。"
      - "trace io の --slow は request latency の下限です。既定は 1ms です。"
      - "trace sched の --slow は span latency の下限です。既定は 1ms です。"
      - "trace exec は exec、exit、signal、oom を表示し、--signal で絞ります。"
      - "trace show <raw.jsonl> は保存した --raw の要約を root なしで出します。"
      - "--slow には 20us、500us、2ms のように単位を付けます。単位のない数値は秒として読み、--slow 1 は 1s です。"
      - "グループ画面は event 数を EVENT/s、socket payload traffic を表示します。"
      - "B/s は byte rate、bps と Mbps は bit rate です。Mbps は bps / 1,000,000 です。"
      - "--duration を省略した場合は Ctrl-C で trace を終了します。"
      - "JSONL event には --raw を使います。"
      - "--container は Linux で docker container 一つの event だけを表示します。"
      - "要約は process と相手ごとに行をまとめます。-d は接続ごとに表示します。"
      - "trace dns は Linux で DNS の問い合わせと応答を表示します。port 表示なし。"
      - "trace arp は Linux と macOS で neighbor table の変化を表示します。root 不要。"
      - "trace ndp は IPv6 neighbor について同じことをします。"
      - "trace http は Linux 5.15 以降と macOS で HTTP/1.x と HTTP/2 の両側を監視します。"
      - "trace http は両側を表示します。各行の先頭に client: か server: が付きます。"
      - "client: はこの host が送った要求、server: は local server が受けた要求です。"
      - "--side client か server で片側だけを残します。trace dns は client 側を見ます。"
      - "proxy では 1 つの要求が、受けた server: と送った client: の 2 行になります。"
      - "bare trace http は Linux と macOS の HTTPS library を自動検出します。macOS の Go TLS には対応バージョンでシンボルを残した実行ファイルが必要です。"
      - "macOS は DTrace で OpenSSL・対応 Go TLS・SecureTransport の平文を読みます。--tls-keylog <パス> は key log 復号を選びます。"
      - "Linux は header の完成後に metadata を表示し、250ms ごとに更新します。macOS は HTTP/1 message の完了後に表示します。"
      - "長い stream は framing、接続、trace が終わるまで保持します。"
      - "text と --raw は message ごとに 1 MiB まで収集します。値なしの --payload は先頭 4 KiB です。"
      - "--payload=all は 1 MiB、--payload=false は payload なしです。=all は続けて書きます。"
      - "JSON 要約と --group-by は既定で payload を収集しません。--raw は message ごとに最終 event を 1 つ出します。"
      - "全画面は full message を収集しますが、payload 行は最初に隠します。Enter で詳細を開きます。"
      - "i は preview、v は payload 行、m は secret header、z は gzip data を表示します。"
      - "payload と gzip 元データは全画面で合計 64 MiB まで保持します。HTTP/1 と HTTP/2 の open message は 64 MiB、4096 件までです。"
      - "message は 1 MiB までです。HTTP/2 payload には header と trailer も入ります。"
      - "既知の secret header は text、raw、全画面で既定で隠します。--show-secrets または m だけで表示します。"
      - "TLS 自動通知は権限、ABI、attach、危険な kernel の理由を表示します。HTTP 収集は続けます。"
      - "Go TLS は Linux amd64、arm64 の Go 1.25.0、1.26.8、1.27.1 をサポートします。Java と HTTP/3 は未対応です。"
      - "--port は、この host か相手がその port を使う接続だけを見ます。"
      - "例: trace http --side server --port 8080 は local server を 1 つだけ見ます。"
