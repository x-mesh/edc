history:
  help_sections:
    storage:
      title: "DBとファイル"
      notes:
        - "ローカルhistory DBは`snapshot`と`top`の観測値を保存します。任意の引数`<DB>`で別のDBを指定します。"
        - "JSON snapshotは`edc report list`で一覧を表示し、`edc report show <file.json>`で開きます。"
    recording:
      title: "記録"
      notes:
        - "`edc snapshot`は既定で記録します。`--output <file>`でJSONも保存し、`edc history export --run <id>`で以前のsnapshotを書き出します。"
        - "`edc top -w`またはtopの`w`で記録を開始・停止します。`p`で収集と記録を一時停止します。"
    browsing:
      title: "閲覧"
      notes:
        - "端末では`edc history list`、`edc history top`、`edc history process`が対話画面を開きます。"
        - "`↑↓`で選択、`Enter`で詳細、`Home`で最新を追跡します。広い画面では列と詳細パネルを追加します。"
    analysis:
      title: "推移と増加量"
      notes:
        - "`edc history trend`はDB指標をローカルの時間・日・週で集計します。`edc history growth`はディスク・ディレクトリかprocess RSSの増加量を表示します (既定7日)。"
        - "processは`--process <filter>`で絞ります。未指定で保存したprocessは観測候補であり、host CPU%は全コア基準、processの100%は1コアです。"
    cleanup:
      title: "整理"
      notes:
        - "`edc history prune`は最終活動から`90d`経過した実行を表示します。`t`で期間変更、`d`の後`y`でチェックした実行の削除を確認します。"
        - "自動削除はしません。`--dry-run`、`--yes`、`--vacuum`は`edc history prune --help`を参照してください。"
  prune_help:
    interactive_title: "対話ブラウザー"
    retention: "`--older-than`省略時は最終活動から`90d`経過した実行をプレビューします。スクリプトでは`<age>`を指定してください。"
    keys: "`↑↓` 選択 · `Space` チェック · `a` 全件 · `Enter` 詳細 · `q` 終了。"
    period: "`t`で期間を選びます。既定の期間か`12h`、`14d`、`2w`などを直接入力できます。"
    deletion_title: "削除とディスク容量"
    confirm: "`d`の後`y`でチェックした実行と観測値を削除します。`--dry-run`はプレビューのみ、`--yes`は対話・確認なしで実行します。"
    recheck: "最終活動は開始・終了・最新の観測時刻の最大値です。削除直前に活動の更新を再確認します。"
    vacuum: "削除した領域はDB内で再利用します。`--vacuum`はディスクに領域を返し、その間は他の書き込みが待つ場合があります。"
    storage_title: "データベース"
    storage: "任意の引数`<DB>`で別のhistory DBを指定できます。Snapshot JSONは`edc report list`と`edc report show <file.json>`で確認します。"
