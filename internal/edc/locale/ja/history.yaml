history:
  usage: "使い方: edc history <list|top|process|export|trend|growth|prune> [options] [DB]"
  option:
    run: "この実行 ID のみ"
    from: "開始時刻を含む (RFC3339)"
    to: "終了時刻を含まない (RFC3339)"
    limit: "最大件数、既定 200。0 はすべて"
    json: "結果ごとに JSON 1 行、stdout は -"
    metric: "検索する数値 field 名"
    min: "最小値を含む。--metric が必要"
    max: "最大値を含む。--metric が必要"
    output: "export の報告ファイル、- は stdout"
    probe: "trend で見るスナップショット結果、例: info.disk:/、du.scan"
    by: "trend の期間: hour、day、week (ローカル時間)"
    root: "growth: このパスの du 結果のみ"
    each: "trend: プロセスごとに 1 行、--process が必要"
    growth_process: "growth: これらのプロセスの 1 日あたりの RSS 変化"
    older_than: "prune: この期間活動のない実行を削除(30d, 2w)"
    prune_command: "prune: top か snapshot の実行のみ"
    dry_run: "prune: 削除せず件数のみ"
    yes: "prune: 確認せずに削除"
    vacuum: "prune: ファイルを書き直して領域を返す"
  error:
    default_path: "既定の DB path を取得できません。--write <path> を指定してください"
    path: "DB の file path を指定してください。JSON は DB や journal を上書きできません"
    regular: "DB path は通常の file である必要があります"
    schema: "対応する edc history DB ではありません (schema version 1)"
    wal: "この DB で SQLite WAL mode を使用できません"
    queue: "記録 queue が満杯のため観測を停止します"
    write: "記録に失敗: %v"
    read: "履歴を読み取れません: %v"
    time: "1678~2261 年の RFC3339 時刻を指定し、--from は --to より前にしてください"
    metric: "--metric と有限の --min または --max を指定してください (min <= max)。field: %s"
    no_snapshots: "この DB にスナップショットはありません。edc snapshot --write で記録してください"
    no_run: "この DB に実行 %s はありません"
    not_snapshot: "実行 %s はスナップショットではなく %s の実行です"
    trend_by: "--by には次のいずれかを指定してください: %s"
    trend_metric: "--metric に top の field を指定するか、--probe とスナップショットの指標を指定してください。top field: %s"
    trend_probe: "スナップショット指標 %s はありません。記録済み: %s"
    trend_key: "%s に %s の値はありません。記録済み: %s"
    trend_process_metric: "--metric にプロセスの指標を指定してください。指標: %s"
    trend_process_probe: "--process と --probe は同時に使えません"
    trend_each: "--each には --process が必要です"
    growth_process_root: "--process と --root は同時に使えません"
  trend:
    title: "%s、%s 単位、ローカル時間 %s"
    empty: "この範囲に値はありません"
    process_title: "%s、%s、%s 単位、ローカル時間 %s"
    process_empty: "この範囲に %s のサンプルはありません。edc top -w --process %s で記録してください"
    unfiltered: "%s のサンプルの一部は --process なしで記録した実行のものです。CPU かメモリの使用量が上位に入った瞬間だけを数えています。edc top -w --process %s で記録してください"
  growth:
    window: "範囲: %s から %s まで (ローカル時間)"
    empty: "この範囲にディスクや du のスナップショットはありません。edc snapshot -w --du <path> で記録してください"
    few_samples: "記録不足 (%d 件)"
    short_span: "記録期間が 1 時間未満"
    full_in: "約 %s"
    days: "%.0f 日"
    hours: "%.0f 時間"
    per_day: "%s/日"
    dirs_title: "du %s: %s → %s (%.1f 日、スナップショット %d 件)"
    one_snapshot: "この範囲のスナップショットは 1 件のみです。もう 1 件記録すると比較します"
    no_change: "変化したディレクトリはありません"
    total: "全体 %s → %s (%s)"
    leak: "リークの疑い (適合度 %.2f)"
    more_processes: "… ほかに %d 個のプロセス、すべては --json"
  browser:
    targets: "対象"
    host: "ホスト"
    loading: "読み込み中"
    growth: "RSS %s、最も速い pid %d"
    growth_none: "RSS の変化: %s"
    leak: "リークの疑い: %d/%d プロセス (適合度 %.2f)"
    help: "↑↓ 対象   m 指標   b 期間   e プロセス別   PgUp/PgDn スクロール   q 終了"
  prompt:
    top_source: "top · host sample"
    source_title: "どの記録の推移を見ますか?"
    source_label: "記録"
    metric_title: "どの指標を見ますか?"
    metric_label: "指標"
    run_title: "どのスナップショットを書き出しますか?"
    run_label: "スナップショット"
    run_item: "%s  %s  結果 %d 件"
    target_title: "ホスト全体とプロセスのどちらを見ますか?"
    target_label: "対象"
    host_target: "ホスト · 全サンプル"
    process_item: "%s  %d サンプル"
  prune:
    usage: "使い方: edc history prune --older-than <age> [--command top|snapshot] [--dry-run] [--yes] [--vacuum] [DB]"
    none: "それより古い実行はありません。"
    plan: "実行 %d 件(top %d、snapshot %d)とサンプル %d 件を削除します。"
    dry_plan: "[dry-run] 実行 %d 件(top %d、snapshot %d)とサンプル %d 件を削除する予定です。"
    dry_note: "何も削除していません。削除するには --dry-run なしで再実行してください。"
    confirm: "削除しますか? y/N "
    yes_required: "端末なしで削除するには --yes、件数だけなら --dry-run を付けてください。"
    done: "実行 %d 件とサンプル %d 件を削除しました。"
    reusable: "ファイルサイズは変わらず、%s は新しい記録に再利用されます。領域を返すには --vacuum を付けてください。"
    vacuumed: "ファイルサイズ %s -> %s。"
    vacuum_failed: "VACUUM に失敗: %v"
command:
  history:
    notes:
      - "growth は期間 (既定 7 日) の速度でディスクが満杯になる時期を推定します。"
      - "trend は 1 つの指標をローカル時間の hour、day、week で古い順にまとめます。"
      - "snapshot -w [DB] で記録し、export --run <id> で報告に書き出す。"
      - "top -w [DB] は dashboard を維持して記録します。"
      - "実行ごとに追記。top の一時停止中は記録も停止します。"
      - "list は実行一覧、top と process は新しい sample から表示。"
      - "host CPU% は user+system、process は core 1 個が 100%。"
      - "--metric には JSON の最上位の数値 field 名を指定。"
      - "process は観測した候補のみ。全 process を保存しません。"
      - "自動削除なし。local DB file を使用してください。"
      - "DB path を省略すると既定の履歴 DB を読みます。"
