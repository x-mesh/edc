command:
  history:
    notes:
      - "prune画面ではtで期間を選択します。候補の選択か直接入力で再取得し、選んだ期間で削除条件を再確認します。"
      - "端末でhistory pruneの--older-thanを省略すると、最終活動から90日経過した実行をプレビューします。対話画面以外では--older-thanが必要です。"
      - "growthは選択・詳細画面を開きます。pruneはSpaceでチェック、aで全件選択、dの後yで削除を確定します。--dry-runはプレビューのみ、--yesは従来のコマンド出力を使います。"
      - "history processも対話画面です。↑↓で選択し、EnterでPID・CPU・メモリ・I/Oと取得した制限を表示します。広い画面では列と詳細を追加します。"
      - "端末のhistory topは対話画面です。↑↓で選択、Enterで詳細、Homeで最新を追跡します。"
      - "画面幅に合わせてディスク・ネットワーク・swap列を追加し、広い画面では選択した観測の詳細を表示します。"
      - "history DBは既定で保存するsnapshotとtop -wの繰り返しの観測値を保存するローカルSQLiteファイルです。"
      - "trendとgrowthはこのDBを読み、snapshotが作るJSONファイルは読みません。"
      - "JSON snapshotの一覧はedc report list、内容はedc report show <file.json>で表示します。"
      - "growth は期間 (既定 7 日) の速度でディスクが満杯になる時期を推定します。"
      - "trend は 1 つの指標をローカル時間の hour、day、week で古い順にまとめます。"
      - "overview は実行または時間範囲のホスト指標と記録済み上位プロセスを要約します。"
      - "overview は実行または時間範囲のホスト指標と記録済み上位プロセスを要約します。"
      - "snapshotは既定で記録します。snapshot -w <DB>でDBを選び、export --run <id>でJSONを書き出します。"
      - "top -w [DB] は dashboard を維持して記録します。"
      - "実行ごとに追記。top の一時停止中は記録も停止します。"
      - "list は実行一覧、top と process は新しい sample から表示。"
      - "host CPU% は user+system、process は core 1 個が 100%。"
      - "--metric には JSON の最上位の数値 field 名を指定。"
      - "process は観測した候補のみ。全 process を保存しません。"
      - "自動削除なし。local DB file を使用してください。"
      - "DB path を省略すると既定の履歴 DB を読みます。"
