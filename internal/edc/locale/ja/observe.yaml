    quality_darwin_only: "networkQuality は macOS 専用です"
    quality_done: "networkQuality の測定が完了しました"
    trace_missing: "traceroute または tracepath コマンドが見つかりません"

  doctor:
    cancelled: "診断を中断しました"
    completed: "%d/%d 完了"
    cancelling: "中断中、実行中の probe を終了します"

  live:
    start_failed: "リアルタイム画面を表示できませんでした: %v"
