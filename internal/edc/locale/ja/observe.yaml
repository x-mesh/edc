      host: "host の情報を読めませんでした: %v"
      resource: "resource を読めませんでした: %v"

  probe:
    cancelled: "probe を中断しました"
    tcp_connected: "%s に接続しました (%s)"
    certificate_below_minimum: "証明書の残りは %d 日で、基準の %d 日より短いです"
    certificate_expiring: "証明書の残りは %d 日です"
    status_mismatch: "HTTP %d、期待値 %d"
