# 観測領域の日本語メッセージ。欠けたキーは en に落ちる。
observe:
  where:
    option:
      provider: "測定する事業者: all、aws、gcp"
      count: "地域ごとの測定回数"
    usage: "使い方: edc where [--provider all|aws|gcp] [--count 3] [options]"
    count_minimum: "--count は 1 以上にしてください"
    unknown_provider: "不明な provider: %s (all、aws、gcp)"
    progress: "地域を確認"
