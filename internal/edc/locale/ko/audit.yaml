    proc_unreadable: "/proc를 읽지 못해(%s) process의 LD_PRELOAD는 확인하지 않았습니다"
    reason:
      temp: "임시 디렉터리에서 실행"
      deleted: "실행 파일이 지워짐"
      deleted_lib: "패키지 디렉터리 밖에서 지워진 라이브러리를 씀"
      memfd: "메모리(memfd)에서 실행"
