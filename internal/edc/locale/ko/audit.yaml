    journal_none: "journalctl이 없어 세션의 끝과 터미널 없는 ssh 접속을 찾지 않았습니다"
    journal_error: "journal을 읽지 못했습니다: %s"
    journal_limited: "범위 안의 journal 항목이 %d개를 넘어 최근 것만 읽었습니다"
    later_login: "sshd와 wtmp에는 더 늦은 로그인이 있습니다 (%s %s, %s)"
    unlogged: "wtmp의 원격 터미널 로그인 %d건에 sshd journal의 Accepted가 없습니다 (journal은 %s부터)"
    joined_by_time: "wtmp 로그인 %d개가 sshd journal의 PID와 맞지 않아(OpenSSH 9.8 미만) 사용자, 출발지, 시각으로 짝지었습니다"
    unjoinable: "sshd journal이 wtmp 로그인과 PID로도, 사용자·출발지·시각으로도 맞지 않아 짝짓지 않았습니다"
    compressed: "%s는 압축되어 있어 다음 파일부터 판정했습니다"
    limited: "%s의 마지막 64 MiB만 읽었습니다"
    truncated: "%s의 끝에 완전하지 않은 레코드가 있습니다"
  history:
    tampered_ok: "계정 %d개의 history에 지운 흔적 없음"
    tampered_bad: "로그인 뒤 history 파일 %d개가 지워졌거나 다른 곳을 가리킵니다"
    older_bad: "history 파일 %d개가 1분 넘는 마지막 세션 동안 바뀌지 않았습니다"
    since: "(wtmp는 %s부터)"
    empty_after: "%s  %s가 %s~%s 세션(%s) 뒤에 비어 있거나 없습니다"
    older_than: "%s  %s는 %s에 마지막으로 바뀌어 %s~%s 세션보다 앞섭니다"
    char_device: "문자 장치"
    no_logins: "로그인 기록을 읽지 못해 /dev/null 연결만 확인했습니다"
    no_logout: "계정 %d개는 로그인 기록은 있지만 wtmp와 journal에 로그아웃 기록이 없어 시각을 비교하지 않았습니다"
    short_only: "계정 %d개는 1분 이하의 세션만 있어 시각을 비교하지 않았습니다"
    skipped: "root가 아니라 홈 디렉터리 %d개를 읽지 못했습니다"
    disabled_ok: "shell history를 끄는 시작 파일 설정 없음"
    disabled_bad: "shell history를 끄는 시작 파일 설정이 %d개 있습니다"
    not_judged:
      zsh_no_histfile: "%s: zsh는 HISTFILE이 없으면 history를 저장하지 않아 확인하지 않았습니다"
      histfile_off: "%s: HISTFILE이 history를 끕니다. history.disabled를 보세요"
      history_off: "%s: 시작 파일이 history를 끕니다. history.disabled를 보세요"
      histfile_custom: "%s: HISTFILE이 다른 경로를 가리켜 확인하지 않았습니다"
  proc:
    exe_ok: "임시 디렉터리, 메모리, 패키지 디렉터리 밖에서 지워진 파일이나 라이브러리로 실행 중인 process 없음 (%d개 확인)"
    exe_bad: "임시 디렉터리, 메모리, 패키지 디렉터리 밖에서 지워진 파일이나 라이브러리로 실행 중인 process가 %d개 있습니다"
    unreadable: "root가 아니라 process %d개의 실행 파일을 읽지 못했습니다"
    preload_ok: "미리 넣은 라이브러리 없음 (process %d개 확인)"
