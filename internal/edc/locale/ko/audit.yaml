    sysctl_ok: "하드닝 값 %d개 정상"
    sysctl_bad: "권장 값과 다른 하드닝 값: %s"
  patch:
    reboot_flag: "패키지가 재부팅을 요구합니다: %s"
    reboot_kernel: "커널 %s가 설치되어 있는데 %s로 실행 중입니다"
    reboot_ok: "실행 중인 커널 %s가 설치된 것 중 최신"
    reboot_none: "재부팅 요청 없음"
  ctr:
    privileged: "edc가 모든 capability를 가집니다. %s container가 privileged입니다 (CapEff %s)"
    caps_limited: "container가 일부 capability를 뺐습니다 (CapEff %s)"
