    uid0_ok: "UID 0은 root뿐"
    uid0_bad: "root 외에 UID 0인 계정: %s"
    empty_ok: "빈 비밀번호 계정 없음"
    empty_bad: "빈 비밀번호 계정: %s"
    sudo_ok: "비밀번호 없이 모든 명령을 허용하는 sudo 규칙 없음"
    sudo_bad: "비밀번호 없이 모든 명령을 허용하는 sudo 규칙 %d개"
    groups_ok: "docker, lxd 그룹에 멤버 없음"
    groups_bad: "root와 같은 권한을 주는 그룹의 멤버: %s"
  file:
    sensitive_ok: "민감 파일 %d개의 권한 정상"
    sensitive_bad: "다른 사용자에게 열린 민감 파일 %d개"
    path_ok: "다른 사용자가 쓸 수 있는 PATH 디렉터리 없음 (%d개 확인)"
    path_bad: "다른 사용자가 바꿀 수 있는 PATH 항목: %s"
  login:
    mismatch_bad: "계정 %d개의 lastlog가 wtmp나 sshd journal과 어긋납니다 (wtmp는 %s부터)"
    mismatch_ok: "계정 %d개의 lastlog와 wtmp 일치 (wtmp는 %s부터)"
