    zeroed: "wtmp에 0으로 채운 레코드가 %d개 있습니다 (wtmp는 %s부터)"
    none: "로그인 기록 없음"
    before_since: "계정 %d개는 마지막 로그인이 wtmp의 시작보다 앞서 비교하지 않았습니다"
