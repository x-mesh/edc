# audit 명령의 한국어 메시지.
audit:
  accepted: "받아들임 (%s): %s"
  skip:
    linux_only: "audit는 Linux에서만 동작합니다"
    needs_root: "%s를 읽으려면 root가 필요합니다"
    unreadable: "%s를 읽지 못했습니다: %s"
    no_firewall_tool: "nft와 iptables-save가 모두 없습니다"
    no_sshd: "%s에 sshd 설정이 없습니다"
    login_sqlite: "SQLite 형식의 로그인 기록(wtmpdb, lastlog2)만 있습니다. edc는 binary 형식의 wtmp와 lastlog만 읽습니다"
    no_sysctl: "/proc/sys에서 하드닝 값을 하나도 읽지 못했습니다"
  net:
    exposed_none: "loopback 밖에 열린 DB·제어 포트 없음 (소켓 %d개)"
    exposed_open: "%s가 loopback 밖에 열려 있고, 호스트 방화벽이 들어오는 트래픽을 허용합니다"
    exposed_filtered: "%s가 loopback 밖에 열려 있습니다. 호스트 방화벽은 기본으로 차단합니다"
    exposed_unknown: "%s가 loopback 밖에 열려 있습니다. root가 아니라 방화벽은 확인하지 못했습니다"
    cloud_note: "edc는 이 호스트만 봅니다. 클라우드 보안 그룹이 포트를 막고 있을 수 있습니다"
    docker_note: "docker-proxy가 연 포트는 FORWARD를 지나므로 INPUT 정책이 적용되지 않습니다. DOCKER-USER chain을 확인하세요"
    firewall_drops: "%s: 규칙에 맞지 않는 트래픽 차단 (input chain %d개, 규칙 %d개)"
    firewall_rules: "%s: 기본 허용, input 규칙 %d개 (규칙 순서는 해석하지 않음)"
    firewall_open: "%s에 input 규칙이 없어 들어오는 트래픽을 모두 허용합니다"
    allowed_ports: "설정의 allow_ports가 %s를 허용합니다"
    forward_off: "IP forwarding 꺼짐"
    forward_container: "IP forwarding 켜짐 (%s가 사용)"
    forward_on: "IP forwarding이 켜져 있는데 컨테이너 런타임을 찾지 못했습니다"
  ssh:
    root_login_yes: "PermitRootLogin yes라 root가 비밀번호로 로그인할 수 있습니다 (%s)"
    root_login_ok: "PermitRootLogin %s (%s)"
    match_note: "Match 블록은 해석하지 않습니다. 실제 적용 값은 `sshd -T`로 확인하세요"
    empty_passwords: "비밀번호 로그인이 켜져 있고 PermitEmptyPasswords yes입니다"
    password_on: "비밀번호 로그인 켜짐: %s"
    password_off: "비밀번호 로그인 꺼짐"
    keys_ok: "authorized_keys %d개, 다른 사용자가 쓸 수 있는 파일 없음"
    keys_bad: "다른 사용자가 쓸 수 있는 ~/.ssh 경로 %d개"
    key_changed_ok: "최근 7일 안에 바뀐 authorized_keys 없음 (%d개 확인)"
    key_changed_bad: "최근 7일 안에 바뀐 authorized_keys가 %d개 있습니다"
    key_changed_at: "%s에 바뀜"
    key_mtime_older: "mtime은 %s로 더 이르며, touch나 chmod로 inode만 바뀌었습니다"
    key_no_login: "wtmp에 그 전 로그인이 없음"
    key_login: "바로 전 로그인 %s %s %s (%s)"
