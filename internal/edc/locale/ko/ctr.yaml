# ctr 명령의 한국어 메시지.
ctr:
  skip:
    linux_only: "ctr은 Linux에서 docker container만 읽습니다"
    no_docker: "이 host에 docker가 설치되어 있지 않습니다"
    not_running: "container에 실행 중인 process가 없습니다"
    needs_docker_access: "docker daemon에 접근하려면 root나 docker 그룹이 필요합니다"
  list:
    summary: "container %d개, 실패 %d개, 재시작·일시 중지·unhealthy %d개"
    failed: "container 목록을 읽지 못했습니다: %s"
    column:
      name: "이름"
      state: "상태"
      restarts: "재시작"
      uptime: "가동"
      memory: "메모리"
      image: "IMAGE"
  error:
    invalid_reference: "잘못된 container 이름 %q: 영문자, 숫자, _.-/만 쓰고 '-'로 시작할 수 없습니다"
    not_found: "container %s가 없습니다"
  state:
    summary: "%s, 가동 %s, 재시작 %d번(%s), image %s"
    no_policy: "재시작 정책 없음"
    restart_gave_up: "%d번 재시작해 %s 한도에 닿았으므로 docker가 다시 시작하지 않음"
    health_failed: "health check %d번 연속 실패, 최근 exit %d: %s"
    inspect_failed: "docker inspect 실패: %s"
  image:
    current: "이미지 참조가 실행 중인 이미지를 가리킴, %s 생성"
    outdated: "%s는 이제 %s(%s 생성)를 가리키지만 container는 %s(%s 생성)로 실행 중임. 반영하려면 container를 다시 만들어야 함"
    no_tag: "%s가 이 호스트에 없어 비교할 수 없음. container는 %s(%s 생성)로 실행 중"
    no_id: "docker inspect가 container의 image ID를 주지 않음"
    created: "%s(%s 전)"
  listen:
    none: "container process가 가진 listen 중인 tcp·udp 소켓 없음"
    published_none: "%s(%s로 publish)를 listen하는 container process 없음"
    published_loopback: "%s(%s로 publish)를 loopback에서만 listen함. publish한 port로 들어온 연결은 loopback에 닿지 않음"
  limits:
    summary: "memory %s · OOM kill %s · CPU throttle %s · pids %s"
    no_limit: "한도 없음"
    memory_high: "memory 사용량이 한도에 가깝습니다: %s"
    oom: "커널이 이 container의 process %d개를 메모리 부족으로 죽였습니다"
    throttled: "CPU 한도가 container를 throttle했습니다: %s"
    pids_high: "pids 한도가 거의 찼습니다: %s"
  log:
    none: "마지막 로그 %d줄에 오류 줄 없음"
    errors: "마지막 로그 %d줄 가운데 오류 %d줄, 최근: %s"
  evidence:
    log: "로그"
    health: "health check 기록"
    published: "publish한 port"
