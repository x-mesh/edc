# tcp check --diagnose의 한국어 메시지. 빠진 키는 en으로 내려간다.
diagnose:
  error:
    count_range: "--count는 1에서 %d 사이여야 합니다"
    interval_range: "--interval은 0s에서 %s 사이여야 합니다"
    timeout_range: "--timeout은 0s보다 커야 합니다"
  route:
    failed: "경로를 조회하지 못했습니다: %s"
  attempt:
    connected: "%s 만에 연결"
    refused: "%s 만에 거부 (RST)"
    timeout: "%s 동안 응답 없음"
    other: "%s: %s"
    local_port: "local port %d"
  fact:
    syn_retransmits: "SYN 재전송 %d"
    retransmits: "재전송 %d"
    slow_connects: "%d번은 연결에 %s 넘게 걸림"
    refused: "거부 %d"
    timeouts: "응답 없음 %d"
    other: "그 밖의 오류 %d"
    resets_received: "RST 수신 %d"
    rtt: "rtt %s"
    drops: "이 host의 drop %s"
  trace:
    skipped: "skip: %s"
    tcp_counts: "SYN 재전송 %d, 재전송 %d, RST 수신 %d, RST 송신 %d"
    tcp_skipped: "TCP 이벤트 skip"
    drop_counts: "흐름을 막은 drop %d, 그 밖의 drop %d"
    drop_skipped: "drop skip"
    lost: "추적이 이벤트 %d개를 놓쳐서 개수가 실제보다 적을 수 있습니다"
    overflow: "추적이 이벤트를 처음 %d개까지만 남기고 %d개를 세지 않아서 개수가 실제보다 적을 수 있습니다"
    failed: "이벤트 추적이 멈췄습니다: %v"
    not_ready: "이벤트 추적이 %s 안에 시작하지 않았습니다"
    linux_only: "이벤트 추적은 Linux의 eBPF가 필요한데, 이 host는 %s입니다"
    stopped_early: "이벤트 추적이 시작하기 전에 멈췄습니다"
  basis:
    phases: "이벤트 추적을 건너뛰어서 연결 phase만으로 판정했습니다: %s"
    partial: "이벤트 추적의 일부만으로 판정했습니다: %s"
  verdict:
    connected: "%d번 모두 재전송이나 지연 없이 연결했습니다. TCP 경로는 정상입니다. 다음으로 서비스, 애플리케이션, LB backend를 확인합니다"
    degraded: "%d번 모두 연결했지만 문제가 보였습니다 (%s). tunnel 품질, MTU/MSS, 비대칭 경로를 의심합니다"
    intermittent: "%d/%d번만 연결했습니다 (%s). 실패하는 LB backend나 시도마다 바뀌는 경로를 의심합니다"
    local_drop: "이 host가 이 흐름의 packet을 버렸습니다 (%s). 이 host를 먼저 의심합니다: NETFILTER_DROP이면 firewall, 그 밖에는 이유 이름이 가리키는 kernel 단계입니다"
    refused: "%d/%d번이 바로 거부됐습니다 (RST). 대상의 listener, 대상 host의 firewall, LB 정책을 의심합니다. 경로 중간의 firewall도 RST를 보낼 수 있습니다"
    no_reply: "%d/%d번이 응답을 받지 못했습니다: SYN 재전송 %d, handshake 없음, 이 host의 drop 없음. 원인은 이 host 밖에 있습니다: IPsec selector, 외부 firewall, VPN 장비 앞 경로, 돌아오는 경로"
    no_reply_untraced: "%d/%d번이 응답도 handshake도 받지 못했습니다. 이벤트 추적이 없어서 이 host의 drop을 배제하지 못했습니다. 그렇지 않다면 IPsec selector, 외부 firewall, VPN 장비 앞 경로, 돌아오는 경로를 의심합니다"
    unreachable: "응답을 받기 전에 연결이 실패했습니다: %s. 경로를 확인합니다"
    no_attempt: "끝난 시도가 없어서 판정하지 못했습니다"
  evidence:
    attempts: "시도"
  next:
    on_host: "%s에서 실행"
  peer:
    cancelled_early: "첫 연결을 시도하기 전에 멈췄으므로 판정할 결과가 없습니다"
    invalid: "--peer에는 host나 user@host 같은 ssh 접속 대상을 줍니다. %q는 쓸 수 없습니다"
    ssh_failed: "ssh로 %s에 접속하지 못했습니다: %s"
    edc_missing: "%s에 edc가 설치되어 있지 않습니다. 그 host에 설치한 뒤 이 명령을 다시 실행합니다: %s"
    version_unknown: "%s의 edc가 version을 알려 주지 않았습니다: %s"
    version_old: "edc %s(%s)는 --peer에 필요한 %s보다 오래되었습니다. %s에서 edc update를 실행합니다"
    sudo_password: "%s에서 tcp expect를 실행하려면 root나 CAP_NET_RAW가 필요한데, sudo가 password를 묻습니다 (%s). ssh 접속 대상을 root@%s 형태로 바꾸거나, %s를 password 없이 sudo로 실행할 수 있게 합니다"
    not_ready: "%s의 tcp expect가 %s 안에 시작하지 않았습니다: %s"
    ended: "%s의 tcp expect가 시작하기 전에 끝났습니다 (exit %s): %s"
    no_report: "%s의 tcp expect가 report를 돌려주지 않았습니다 (exit %s): %s"
    empty_report: "출력에 tcp.expect report가 없습니다"
    saved: "저장: %s"
