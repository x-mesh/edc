# disk 명령군(check, grow)의 한국어 메시지.
disk:
  skip:
    linux_only: "디스크 읽기와 확장은 Linux에서만 동작합니다"
  flag:
    dry_run: "아무것도 바꾸지 않고 계획만 출력"
    yes: "확인 생략"
  layer:
    disk: "디스크"
    partition: "파티션"
    pv: "pv"
    lv: "lv"
    filesystem: "파일시스템"
  evidence:
    rescan: "rescan"
    unknown_size: "크기 확인 불가 (%v)"
    step: "단계 %d"
    done: "완료"
  error:
    no_mount: "%s를 담은 마운트를 찾지 못했습니다"
    no_ext_superblock: "ext 슈퍼블록이 없습니다"
    lv_not_found: "lvs에 %s의 논리 볼륨이 없습니다"
    pv_not_found: "pvs에 물리 볼륨 %s가 없습니다"
  blocked:
    fs_type: "%s는 늘릴 수 없습니다. ext3, ext4, xfs만 지원합니다"
    not_lvm: "%s는 device-mapper 디바이스이지만 LVM 볼륨이 아닙니다"
    many_pvs: "%s는 물리 볼륨 %d개를 씁니다. 디스크 하나 위의 볼륨만 늘립니다"
    logical: "%s는 MBR의 논리 파티션이라 growpart로 늘릴 수 없습니다"
    not_last: "%s는 마지막 파티션이 아닙니다. 마지막 파티션 뒤에 %s가 남아 있습니다"
    mbr_limit: "%s는 2 TiB에서 끝나는 MBR 표를 씁니다. 먼저 GPT로 바꾸세요"
    no_growpart: "growpart가 없습니다. cloud-guest-utils(Debian, Ubuntu)나 cloud-utils-growpart(RHEL)를 설치하세요"
    no_tool: "%s가 없습니다"
  check:
    growable: "%s를 %s 더 늘릴 수 있습니다. edc disk grow %s를 실행하세요"
    full: "%s는 디스크 전체를 씁니다, %s"
    unknown: "%s: 파일시스템 크기를 읽지 못했습니다. root로 실행하세요"
    rescan_note: "%s는 SCSI 디스크입니다. edc disk grow가 먼저 rescan하므로 공간이 더 보일 수 있습니다"
    none: "마운트된 블록 디바이스가 없습니다"
  grow:
    dry_run: "계획만 출력, 변경 없음: %s가 %s 늘어납니다"
    summary: "%s가 %s에서 %s로 늘었습니다"
    cancelled: "취소했습니다. 아무것도 바꾸지 않았습니다"
    confirm:
      question: "%s를 늘릴까요?"
      detail: "파티션과 파일시스템은 다시 줄일 수 없습니다. 먼저 스냅샷을 만드세요."
    error:
      root_required: "edc disk grow는 root 권한이 필요합니다. 계획만 보려면 -n을 쓰세요"
      unchanged: "%s를 실행했지만 크기가 바뀌지 않았습니다"
      resume: "같은 명령을 다시 실행하면 실패한 단계부터 이어서 진행합니다."
