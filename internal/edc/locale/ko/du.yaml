# du 명령의 한국어 메시지.
du:
  skip:
    linux_only: "du는 Linux에서만 동작합니다"
  error:
    path: "%s를 읽지 못했습니다"
  summary: "%s (%s), 항목 %d개, %s, worker %d개"
  summary_partial: "지금까지 %s (%s), 항목 %d개, 제한 시간 %s에서 멈춤"
  warning:
    partial: "제한 시간에 멈춰서 크기는 읽은 부분만 센 값입니다"
    unreadable_root: "디렉터리 %d개를 읽지 못해 세지 않았습니다. root로 실행하면 셀 수 있습니다"
    unreadable: "디렉터리 %d개를 읽지 못해 세지 않았습니다"
    no_mountinfo: "마운트 표를 읽지 못해(%s) 경로 아래의 bind mount도 셉니다"
    deleted_open: "지워졌지만 process가 아직 열고 있는 파일이 %s입니다(%s). 가장 큰 파일은 %s(pid %d)가 열고 있습니다"
  evidence:
    unreadable: "읽지 못한 디렉터리"
  other: "(나머지 항목 %d개)"
  fs:
    title: "파일 시스템  %s  %s  %s 사용 / 전체 %s"
    counted: "센 크기"
    deleted: "지웠지만 열림"
    files: "(파일 %d개)"
    not_found: "찾지 못함"
    not_found_hint: "마운트 아래 가려진 파일이나 파일 시스템 metadata"
    partial_hint: "root로 실행하면 모든 process를 읽습니다"
  mounts:
    title: "건너뛴 마운트"
    used: "%s 사용"
    more: "%d개 더 있음, -v로 모두 보기"
