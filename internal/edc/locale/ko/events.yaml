# events 명령의 한국어 메시지.
events:
  option:
    since: "읽을 기간 (30m, 48h 같은 Go duration)"
  since_positive: "--since는 0보다 커야 합니다"
  skip:
    linux_only: "events는 Linux의 커널과 systemd 로그만 읽습니다"
    needs_root: "%s를 읽으려면 root나 adm, systemd-journal 그룹이 필요합니다"
    no_journal: "journalctl이 설치되어 있지 않습니다"
    no_systemd: "이 호스트에서 systemd가 실행 중이지 않습니다"
    unreadable: "%s를 읽지 못했습니다: %s"
    reports: "%s를 읽을 수 없습니다: %s"
    reports_admin: "%s를 읽으려면 관리자 계정(_analyticsusers 그룹)이나 root가 필요합니다"
  window:
    summary: "신호 %d개, 최근 %s (%s부터)"
    none: "최근 %s 동안의 로그 원천을 하나도 읽지 못했습니다"
    truncated: "%s 출력이 크기 상한에 닿아 일부 기록이 빠졌습니다"
  oom:
    none: "%s 이후 OOM kill 없음"
    found: "OOM kill %d번, 최근 %s"
  disk_io:
    none: "%s 이후 디스크 I/O 오류 없음"
    found: "디스크 I/O 오류 %d번, 최근 %s"
  fs_readonly:
    none: "%s 이후 읽기 전용으로 바뀐 파일 시스템 없음"
    found: "파일 시스템이 읽기 전용으로 바뀌거나 멈춘 기록 %d번, 최근 %s"
  link:
    none: "%s 이후 끊긴 링크 없음 (링크 기록 %d개)"
    down: "%s가 마지막 기록에서 끊긴 채입니다 (링크 기록 %d개)"
    flap: "%s가 끊겼다가 다시 연결되었습니다 (링크 기록 %d개)"
  units:
    none: "%s 이후 실패하거나 재시작한 unit 없음"
    ok: "unit 기록 %d개, 실패한 채이거나 반복해서 재시작하는 unit 없음"
    failed: "실패한 채인 unit %d개, 최근 %s"
    restarting: "실패 뒤 재시작했거나 3번 이상 재시작한 unit %d개, 최근 %s"
  segfault:
    none: "%s 이후 segfault나 general protection fault 없음"
    found: "segfault나 general protection fault %d번, 최근 %s"
  lockup:
    none: "%s 이후 CPU lockup이나 RCU stall 없음"
    found: "CPU lockup이나 RCU stall %d번, 최근 %s"
  oops:
    none: "%s 이후 커널 oops나 warning 없음"
    found: "커널 oops %d번, 최근 %s"
    warned: "커널 warning %d번, 최근 %s"
    tainted: "%s 이후 커널 oops 없음, 다만 부팅 뒤 커널이 %s로 tainted됨"
  hung_task:
    none: "%s 이후 hung task 한도를 넘겨 막힌 task 없음"
    found: "hung task 보고 %d번, 최근 %s"
  failed_units:
    none: "지금 failed 상태인 unit 없음"
    found: "지금 failed인 unit %d개: %s"
  journal_errors:
    none: "%s 이후 journal에 오류 줄 없음"
    found: "오류 줄 %d개, unit이나 program %d개, 가장 많은 것 %s (%d)"
  taint:
    D: "D: 커널에 oops나 BUG가 있었음"
    W: "W: 커널이 warning을 냈음"
    L: "L: soft lockup이 있었음"
    M: "M: machine check exception이 있었음"
    B: "B: bad page를 찾았음"
  clock:
    none: "%s 이후 1초 이상의 시계 점프 없음"
    found: "시계 점프 %d번, 최근 %s"
  evidence:
    timeline: "시간순 기록"
    source: "원천"
    events: "기록"
    more: "... %d개 더"
    tainted: "tainted"
    failed_units: "failed unit (load/active/sub)"
    error_sources: "unit별 오류 줄 (개수, unit, 최근, 메시지)"
  panic:
    none: "%s 이후 커널 패닉 없음"
    found: "커널 패닉 %d건, 최근 %s"
  jetsam:
    none: "%s 이후 jetsam이 종료한 process 없음"
    found: "jetsam이 종료한 process %d개, 최근 %s"
