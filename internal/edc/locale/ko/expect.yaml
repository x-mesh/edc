# edc tcp expect의 한국어 메시지.
expect:
  prompt_port: "port"
  prompt_hint: "대상 host에서 실행해, port로 SYN이 오는지와 이 host가 어떻게 답하는지 보여 줍니다.\nclient가 접속하는 port를 넣으세요. 예: 2142"
  port_invalid: "port는 1에서 65535 사이의 숫자여야 합니다: %s"
  from_invalid: "--from에는 IP 주소나 CIDR 대역을 주세요: %s"
  duration_range: "--duration은 0s 이상, %s 이하여야 합니다"
  until_invalid: "--until에는 syn이나 handshake를 주세요: %s"
  stop_after_invalid: "--stop-after는 1 이상이어야 합니다: %d"
  listen_busy: "--listen: port %d에서 이미 기다리는 process가 있습니다 (%v). edc는 port를 빼앗지 않습니다. 서비스를 시험하려면 --listen을 빼세요"
  listen_failed: "--listen: port %d에서 listener를 열지 못했습니다: %v"
  linux_only: "tcp expect는 Linux에서만 실행합니다. 지금은 %s입니다"
  live:
    from: "출발지 %s"
    stop: "멈춤"
    until_syn: "첫 SYN까지"
    until_handshake: "첫 handshake까지"
    stop_after: "연결 시도 %d개까지"
    drop_on: "kernel drop 이유: 켜짐 (kernel이 버린 packet은 DROP 줄에 이유와 함께 나옵니다)"
    drop_skip: "kernel drop 이유: skip (%s)"
    waiting: "port %d에 오는 SYN을 기다립니다. 지금 client에서 접속해 보세요. 예: %s"
    this_host: "<이-host-주소>"
    other_addresses: "이 host의 다른 주소: %s"
    retransmit: "재전송 %d"
    duplicate: "같은 packet이 다른 interface에도 보임"
    handshake_time: "handshake %s"
  listener:
    present: "listener: %[1]s, 주소 %[2]s"
    loopback: "listener: %[1]s, 주소 %[2]s. loopback에만 묶여 있어 다른 host의 SYN은 RST를 받습니다"
    none: "listener: 없음. --listen을 주지 않으면 SYN은 RST를 받습니다"
    unknown: "listener: 알 수 없음 (%s)"
    temporary: "listener: 임시. 끝날 때까지 edc가 %s에서 연결을 받자마자 닫습니다"
    unknown_process: "알 수 없는 process"
  summary:
    no_syn: "%[2]s 동안 port %[1]d에 온 SYN이 없습니다. packet이 이 host까지 오지 않습니다"
    no_syn_ipsec: "%[2]s 동안 port %[1]d에 온 SYN이 보이지 않았습니다. IPsec transport mode는 도착한 packet을 edc에게서 가릴 수 있습니다"
    completed: "%[1]s, %[2]s: 연결 %[4]d개 중 %[3]d개가 handshake를 마쳤습니다"
    rst: "%[1]s, %[2]s: SYN %[3]d개가 도착했고 RST %[4]d개를 보냈습니다. port에 listener가 없거나 host firewall이 거부합니다"
    synack_no_ack: "%[1]s, %[2]s: SYN %[3]d개가 도착했고 SYN-ACK를 %[4]d번 보냈지만 ACK가 오지 않았습니다. 돌아가는 경로(역방향 route나 역방향 IPsec selector)를 의심하세요"
    syn_no_reply: "%[1]s, %[2]s: SYN %[3]d개가 도착했지만 이 host가 SYN-ACK도 RST도 보내지 않았습니다. host firewall, rp_filter, 가득 찬 listen queue 중 하나가 버립니다"
    reply_hidden_ipsec: "%[1]s, %[2]s: SYN %[3]d개가 도착했고 handshake는 끝나지 않았습니다. 답은 IPsec policy를 타고 ESP로 나가서 edc가 볼 수 없습니다"
    rst_hidden: "%[1]s, %[2]s: SYN %[3]d개가 도착했고 kernel이 받을 socket을 찾지 못했습니다(NO_SOCKET). port에 listener가 없습니다. RST는 IPsec policy를 타고 ESP로 나가서 edc가 볼 수 없습니다"
    dropped_unseen: "%[1]s: packet socket에는 port %[2]d에 온 SYN이 보이지 않았지만 kernel이 그 port의 packet을 버렸습니다. packet은 이 host까지 옵니다"
    drops: "(kernel drop: %s)"
    more_sources: "(출발지 %d개 더)"
  warning:
    route_failed: "돌아가는 경로를 조회하지 못했습니다 (%s): %s"
    rp_filter_strict: "%[1]s의 rp_filter가 strict(1)이고, %[2]s 방향의 돌아가는 경로는 %[3]s 쪽으로 나갑니다. kernel이 이 SYN을 버립니다"
    asymmetric: "%[1]s 방향의 답은 SYN이 도착한 interface(%[3]s)가 아니라 %[2]s 쪽으로 나갑니다"
    ipsec_transport: "이 host에 이 출발지를 받는 IPsec transport mode policy가 있습니다. kernel은 복호화한 packet을 packet socket에 보여 주지 않으므로, 도착한 SYN을 edc가 놓칠 수 있습니다. ip -s xfrm state의 counter를 확인하세요"
    socket_drops: "packet socket이 packet %d개를 놓쳤습니다. 개수가 실제보다 적을 수 있습니다"
    drop_lost: "drop 추적이 이벤트 %d개를 놓쳐서 이 port의 kernel drop이 빠져 있을 수 있습니다"
    untracked: "연결 시도나 출발지가 너무 많아 연결 시도 %d개를 세지 않았습니다. --from으로 관측 범위를 좁히세요"
    other_ports: "port %[1]d에는 SYN이 오지 않았지만 다른 port에는 왔습니다: %[2]s. client가 접속하는 port를 확인하세요"
  status:
    syn: "SYN %d"
    handshakes: "handshake %d"
    drops: "drop %d"
    other_ports: "다른 port: %s"
  next:
    step: "다음 단계: %s"
    no_syn: "SYN이 이 host까지 오지 않습니다. 경로(tunnel selector, firewall, NAT)를 확인하세요"
    no_syn_ipsec: "IPsec transport mode는 도착한 SYN을 가릴 수 있습니다. 접속 전후로 ip -s xfrm state의 counter를 비교하세요"
    rst: "listener가 없거나 host firewall이 거부합니다. edc listen --tcp로 확인하거나, 경로만 시험하려면 --listen을 붙여 다시 실행하세요"
    synack_no_ack: "답이 client로 돌아가지 못합니다. 역방향 route와 역방향 selector를 확인하세요"
    syn_no_reply: "이 host가 SYN에 답하지 않습니다. host firewall, rp_filter, listen queue를 확인하세요 (edc trace drop)"
    dropped_unseen: "이 host의 kernel이 SYN을 버립니다. 위의 drop 이유를 확인하세요"
    reply_hidden_ipsec: "답이 ESP로 나갑니다. client에서 edc tcp check --diagnose를 실행하고 두 report를 합치세요"
    completed: "경로는 동작합니다. 다음으로 TLS와 application을 확인하세요"
    completed_temporary: "경로는 동작합니다. --listen의 임시 listener가 답했으므로 서비스 자체는 시험하지 않았습니다"
    join_file: "client report와 합치기: %s"
    join_rerun: "client report와 합치려면 --json target.json을 붙여 다시 실행하세요: %s"
  evidence:
    sources: "출발지"
    return: "돌아가는 경로"
    drops: "kernel drop"
    verdict: "판정"
    more: "... 출발지 %d개 더"
    drop_on: "켜짐"
    drop_skip: "skip: %s"
    other_drops: "연결 시도 밖의 drop: %s"
  verdict:
    no_syn: "SYN 없음"
    completed: "handshake 완료"
    rst: "RST 보냄"
    synack_no_ack: "SYN-ACK 뒤 ACK 없음"
    syn_no_reply: "응답 없음"
    dropped_unseen: "버려짐, 보이지 않음"
    reply_hidden_ipsec: "IPsec으로 응답이 가려짐"
  route:
    unknown: "알 수 없음"
    failed: "조회 실패: %s"
    device: "dev %s"
    via: "via %s"
    source: "src %s"
    table: "table %s"
    same_interface: "도착 interface와 같음"
    other_interface: "도착 interface(%s)와 다름"
    ipsec: "IPsec policy"
