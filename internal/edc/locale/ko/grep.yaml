# grep 명령의 한국어 메시지.
grep:
  failed: "edc grep: %v"
  stdin: "(표준 입력)"
  bad_level: "edc grep: 모르는 level %q입니다. trace, debug, info, warn, error, fatal 중 하나를 쓰세요"
  bad_status: "edc grep: status %q를 읽을 수 없습니다. 5xx, 404, 500-503을 쉼표로 이어 쓰세요"
  bad_time: "edc grep: 시각 %q를 읽을 수 없습니다. 10m, 2h, 1d, 2026-10-27 09:00, 09:00처럼 쓰세요"
  verify_failed: "index로는 %d줄을 찾았지만 전체를 읽으면 %d줄입니다. index를 지웠습니다"
  reason:
    short: "가득 찬 블록이 없는 파일"
  hint:
    prefix: "hint: "
    last: "%s: --last로 끝에서 %s를 읽었습니다"
    since_whole: "%s: --since로 파일 전체를 읽었습니다. 로그가 시간 순서면 --ordered를 주면 이진 탐색합니다"
    index_off: "%s: index를 쓰지 않음(--no-index), 파일 전체를 읽었습니다"
    index_small: "%d개 파일은 %s보다 작아 index 없이 전체를 읽었습니다"
    index_first: "%s: 이 파일의 첫 검색이라 전체를 읽었습니다. 24시간 안에 다시 검색하면 index를 만듭니다 (--index는 지금 만듦)"
    index_built: "%s: index를 만들었습니다 (%s, 파일의 %.1f%%, %s). 다음 검색부터 블록을 건너뜁니다"
    index_used: "%s: index를 썼습니다. %s/%s 블록을 읽음 (%s)"
    index_sequential_read: "%s: 블록의 %d%%보다 많이 맞을 수 있어 파일을 순서대로 읽었습니다"
    index_not_built: "%s: index를 만들지 못했습니다 (%s). 파일 전체를 읽었습니다"
    index_none: "%s: index를 쓰지 않고 파일 전체를 읽었습니다"
    index_extended: "%s: index에 새 블록 %s개를 더했습니다"
    index_no_letters: "%s: 패턴에 글자가 없어 index는 시각, level, status로만 블록을 건너뛰었습니다"
    index_invalid: "%s: index를 버렸습니다 (%s)"
    index_stale: "%s: 블록이 index와 맞지 않아 index를 지우고 파일 전체를 읽었습니다"
    index_last: "%s: --last는 index 없이 끝에서 읽습니다. %s를 읽음"
    index_sequential: "%s: pipe와 .gz는 차례로 읽으며 index를 쓰지 않습니다"
    index_unavailable: "%s: 캐시 디렉터리를 쓸 수 없어 index가 없습니다"
    seek: "%s: --since로 %s를 건너뛰고 %s를 읽었습니다"
    seek_failed: "%s: 줄이 시간 순서가 아니라 파일 전체를 읽었습니다"
    no_time: "%s: 시각을 찾지 못해 --since와 --until에 맞는 줄이 없습니다"
    counted: "%s: -n을 위해 건너뛴 %s줄을 셌습니다"
    skipped_old: "%d개 파일은 --since 앞에서 끝나 건너뛰었습니다(마지막 시각 기준, .gz는 수정 시각 기준): %s"
    binary: "%d개 binary 파일을 건너뛰었습니다: %s"
