# 한국어 메시지. 빠진 키는 en.yaml로 내려간다.
help:
  tagline: "everyday carry for SE/SRE"
  usage_label: "사용법"
  usage: "edc <command> [options] [target]"
  common_label: "공통"
  detail_label: "자세히"
  help_command_summary: "명령 목록 보기"
  detail_hint: "edc help <command>"
  options_label: "options"
  common_options_label: "공통 options"
  group:
    diagnose: "진단"
    observe: "관측"
    record: "기록·원격"
    tool: "도구"

option:
  timeout: "실행 제한 시간"
  json: "JSON 출력 경로, stdout은 -"
  verbose: "상세 evidence 출력"
  redact: "출력의 민감정보 가리기"

command:
  doctor:
    summary: "DNS·TCP·TLS·HTTP를 한 번에 확인"
    option:
      profile: "full은 bandwidth와 responsiveness를 더합니다"
      all_ips: "DNS 응답의 모든 IP를 검사하고 ASN holder를 조회합니다"
    notes:
      - "probe 9개를 한 번에 실행하고 결과를 같은 형식으로 모읍니다."
      - "terminal에서는 probe마다 한 줄씩 실시간으로 갱신합니다."
      - "Ctrl-C로 취소하면 exit code 4를 돌려줍니다."
  dns:
    summary: "이름 조회와 resolver 설정"
    option:
      resolver: "비교할 DNS 서버; 여러 번 지정할 수 있습니다"
    notes:
      - "lookup은 주소를, compare는 system DNS와 다른 resolver를 비교합니다."
      - "compare는 --resolver가 없으면 1.1.1.1을 사용합니다."
  tcp:
    summary: "TCP 연결 확인"
    notes:
      - "연결하지 못하면 phase와 cause를 남기고 exit code 1을 돌려줍니다."
  tls:
    summary: "인증서와 handshake 확인"
    option:
      min_days: "남은 일수가 N보다 작으면 fail로 처리합니다"
    notes:
      - "기본값은 30일 미만일 때 warning입니다. --min-days는 그 기준을 fail로 올립니다."
  http:
    summary: "HTTP 응답 확인"
    option:
      expect_status: "응답 code가 N과 다르면 fail로 처리합니다"
    notes:
      - "기본값은 4xx가 warning, 5xx가 fail입니다."
  net:
    summary: "interface, route, ping, trace"
  route:
    summary: "gateway VM의 default route를 점검·전환·원복"
    notes:
      - "경로를 바꾸는 gateway VM에서 로컬로 실행하는 명령입니다."
      - "switch와 rollback은 root 권한이 필요합니다. sudo는 붙이지 않습니다."
      - "check는 경로를 바꾸지 않습니다. switch는 먼저 롤백 타이머를 무장합니다."
      - "status는 /run/edc를 읽고, rollback --state는 파일 하나를 다시 실행합니다."
  change:
    summary: "자동 롤백을 제공하는 시스템 변경"
  top:
    summary: "실시간 resource 대시보드"
    option:
      interval: "sampling 간격"
      count: "출력할 row 수, 0은 계속 실행"
      no_header: "host와 column header 생략"
      json: "sample당 한 줄 JSON, stdout은 -"
    notes:
      - "terminal에서는 대시보드로 엽니다. q 종료, p 일시정지, +/- interval."
      - "--count나 --json을 주거나, 비 terminal이거나, NO_COLOR면 표로 출력합니다."
  watch:
    summary: "중단할 때까지 HTTP 상태 반복 관측"
    option:
      interval: "sample 간격(초), 최소 0.1"
      duration: "지정한 시간이 지나면 종료; 생략하면 Ctrl-C까지 실행"
    notes:
      - "매번 HTTP status, body byte, 소요 시간을 출력합니다."
      - "--json은 sample마다 JSON 한 줄과 마지막 요약을 씁니다."
  info:
    summary: "system, network, disk 정보"
    option:
      public: "외부 ipinfo.io 조회를 끕니다"
      timeout: "public 조회 제한 시간"
      verbose: "public 조회 실패 원인 출력"
    notes:
      - "public IP를 기본으로 조회하고, 제한 시간 안에 응답이 없으면 그 줄을 뺍니다."
      - "disk 사용량은 전체 크기에서 남은 공간을 뺀 값입니다."
  where:
    summary: "가까운 지역과 이 망의 모습"
    option:
      provider: "측정할 사업자: all, aws, gcp"
      count: "지역마다 측정할 횟수"
    notes:
      - "공개 endpoint에 TCP handshake만 보내고 끊습니다."
      - "요청을 보내지 않고 본문도 읽지 않습니다."
      - "이름을 먼저 풀고 그 주소로만 연결하므로 DNS 시간이 거리 값에 섞이지 않습니다."
      - "public IP와 ASN, Cloudflare PoP, NAT와 tunnel 여부를 함께 보여 줍니다."
      - "기본 출력에는 주소를 보여 줍니다. --redact를 주면 화면과 JSON에서 가립니다."
      - "terminal에서는 진행 줄로 몇 곳을 확인했는지 보여 주고 q로 취소합니다."
      - "-v를 주면 사업자별 값을 모두 펼칩니다."
  listen:
    summary: "연결을 기다리는 socket 목록"
    option:
      tcp: "TCP socket만 봅니다"
      udp: "바인드된 UDP socket만 봅니다"
      unix: "unix domain socket만 봅니다"
      all: "TCP와 UDP, unix domain socket을 모두 봅니다"
      watch: "중단할 때까지 열린 포트의 변화를 보여 줍니다"
      verbose: "계정과 descriptor, 큐 열을 함께 엽니다"
    notes:
      - "기본은 LISTEN 상태의 TCP socket과 바인드된 UDP socket입니다."
      - "종류 flag는 더하기가 아니라 filter입니다. --tcp는 TCP만 남깁니다."
      - "둘을 함께 주면 둘 다 남고 --all은 unix domain socket까지 봅니다."
      - "unix socket은 포트가 없어 경로를 주소에 적고 포트 열은 -로 둡니다."
      - "macOS의 lsof는 unix socket 상태를 알려 주지 않아 근사치입니다."
      - "연결된 socket은 대상이 아닙니다."
      - "-v는 계정과 file descriptor, 큐 열을 함께 엽니다."
      - "큐는 Recv-Q/Send-Q이고 TCP listener에서는 accept 큐입니다."
      - "큐를 주는 것은 Linux뿐이고 macOS에서는 -로 나옵니다."
      - "-v는 열만 늘립니다. 줄은 그대로입니다."
  quality:
    summary: "networkQuality 측정 (macOS)"
    notes:
      - "macOS의 networkQuality를 씁니다. 측정에 수십 초가 걸립니다."
  capture:
    summary: "packet capture (Linux와 macOS)"
    option:
      mode: "capture mode (pcap, events)"
      interface: "capture할 interface (필수)"
      duration: "capture 시간, 최대 60s"
      count: "packet 수, 최대 10000"
      filter: "BPF filter"
      output: "pcap 저장 경로"
      yes: "확인 질문 생략"
    notes:
      - "privileged 작업입니다. 시작 전에 계획을 보여 주고 확인을 받습니다."
      - "PCAP에는 credential과 개인정보가 들어갈 수 있습니다."
      - "JSON redaction은 PCAP payload에 적용되지 않습니다."
  trace:
    summary: "network, I/O, socket, drop, scheduler event 출력과 요약"
    option:
      duration: "trace 시간, 최대 60s. 생략하면 Ctrl-C"
      slow: "최소 latency. mysql은 첫 응답, io는 기본 1ms"
      raw: "raw event JSONL 출력"
      live: "호환성 flag. trace는 기본으로 실시간 실행"
      group_by: "source, target, port, process, event별로 묶습니다"
      process: "process 이름으로 필터"
      destination: "destination host와 port로 필터"
      detail: "요약에 연결이나 flow를 하나씩 표시"
      yes: "확인 질문 생략"
      side: "http, mysql은 기본으로 두 쪽, dns는 client 쪽"
      payload: "trace http, socket: 앞 4KiB, =all은 1MiB까지"
      show_secrets: "http --payload: header 값. mysql: SQL 값"
      port: "http: 이 port만. mysql: 서버 port, 기본 3306"
      container: "이 docker container만, 이름이나 ID"
      reason: "trace drop: 이 이유만, 쉼표로 구분"
      device: "trace io: block device major:minor"
    notes:
      - "terminal에서는 기본으로 전체 화면 trace를 엽니다."
      - "/를 누르면 process, destination, event, source를 필터할 수 있습니다."
      - "s, t, p, c, e는 각각 source, target, port, process, event 행을 표시합니다."
      - "g는 event 스크롤을 표시합니다."
      - "event 목록에서 Up이나 Down을 누르면 event를 고르고 목록이 멈춥니다."
      - "Enter는 모든 field와 payload 전체를 보여 주고, l이나 Esc는 다시 따라갑니다."
      - "f는 상세 보기에서 가장 최근 event를 따라갑니다."
      - "i는 목록 아래 미리 보기를 열고 닫으며, J와 K로 스크롤합니다."
      - "trace http: v는 payload 줄, m은 가린 값, z는 gzip 풀기를 켜고 끕니다."
      - "Tab은 다음 보기, Shift+Tab은 이전 보기로 바꿉니다."
      - "--group-by source, target, port, process, event로 group live 행을 표시합니다."
      - "trace io는 device, process, cgroup, event로 행을 묶습니다."
      - "그룹 화면은 event 수를 EVENT/s로 표시하고 socket payload traffic을 표시합니다."
      - "B/s는 byte rate이며 bps와 Mbps는 bit rate입니다. Mbps는 bps / 1,000,000입니다."
      - "--duration을 생략하면 Ctrl-C로 trace를 종료합니다."
      - "JSONL event가 필요하면 --raw를 사용합니다."
      - "--container는 Linux에서 docker container 하나의 event만 보여 줍니다."
      - "요약은 process와 상대별로 행을 묶습니다. -d는 연결마다 표시합니다."
      - "trace dns는 Linux에서 DNS 질의와 응답을 표시합니다. port 보기는 없습니다."
      - "trace arp는 Linux와 macOS에서 neighbor table 변화를 표시합니다. root 불필요."
      - "trace ndp는 IPv6 neighbor에 대해 같은 일을 합니다."
      - "trace http는 Linux 5.15 이상에서 평문 HTTP/1.x 요청을 표시합니다."
      - "trace http는 두 쪽을 모두 표시합니다. 행 앞에 client: 또는 server:가 붙습니다."
      - "client:는 이 host가 보낸 요청, server:는 로컬 서버가 받은 요청입니다."
      - "--side client나 server는 한 쪽만 남깁니다. trace dns는 client 쪽을 봅니다."
      - "proxy에서는 요청 하나가 받은 server:와 backend로 보낸 client:로 두 번 보입니다."
      - "HTTPS는 암호문이라 새 연결마다 tls_hello 행만 보입니다."
      - "tls_hello에는 path 대신 서버 이름(SNI)과 ALPN protocol이 있습니다."
      - "--payload는 message 앞부분을 표시합니다."
      - "--payload=all은 각 message를 1MiB까지 표시합니다. =all은 붙여 씁니다."
      - "--port는 이 host나 상대가 그 port를 쓰는 연결만 봅니다."
      - "예: trace http --side server --port 8080은 로컬 서버 하나만 봅니다."
      - "Authorization, Proxy-Authorization, Cookie, Set-Cookie 값은 가립니다."
      - "trace mysql은 Linux 5.15 이상에서 평문 MySQL의 명령과 결과를 표시합니다."
      - "두 쪽을 모두 표시합니다. 행 앞에 client: 또는 server:가 붙습니다."
      - "--port는 MySQL 서버 port입니다. 기본값은 3306입니다."
      - "--slow는 첫 응답 latency가 지정 시간 이상인 MySQL 행만 표시합니다."
      - "--slow는 Go duration 문법을 받고, 응답 없는 command는 표시하지 않습니다."
      - "SQL 문자열 값은 가립니다. --show-secrets를 쓰면 보입니다."
      - "오류 message는 가리지 않습니다. message에 값이 들어 있을 수 있습니다."
      - "TCP만 봅니다. mysql -h localhost는 unix socket을 씁니다."
      - "TCP로 보려면 -h 127.0.0.1을 사용합니다."
      - "TLS와 압축 연결은 해석하지 않습니다."
      - "trace socket <path>는 Linux에서 stream unix socket 파일 하나를 봅니다."
      - "connect, accept, send, recv, eof, close를 표시합니다. SOURCE는 상대입니다."
      - "클라이언트 쪽 상대는 서버 process입니다. accept 전에는 listen한 process입니다."
      - "accept는 연결이 backlog에서 기다린 시간을 표시합니다."
      - "payload는 가리지 않고 그대로 보입니다. 전체 화면에서는 v로 켭니다."
      - "trace drop은 kernel이 패킷을 버린 이유와 kernel 함수를 보여 줍니다."
      - "패킷에 local socket이 있으면 process를 붙입니다. --reason으로 이유를 거릅니다."
      - "이유별 합계는 정확합니다. CPU마다 초당 1,000건이 넘으면 event는 표본입니다."
      - "accept 대기열이 가득 차 해제된 SYN은 event가 아니고, 요약에서 셉니다."
  report:
    summary: "저장한 JSON report 보기와 비교"
    notes:
      - "terminal에서는 뷰어로 엽니다. f 필터, e 상세, q 종료."
      - "diff는 probe별 status 변화와 metric 차이를 보여 줍니다."
      - "악화된 probe가 있으면 exit code 1을 돌려줍니다."
  log:
    summary: "command stream 하나를 log file에 append"
    option:
      stream: "capture stream; config 기본값 가능"
      output: "append log file; config 기본값 가능"
      command_display: "marker에 기록할 command 범위"
    notes:
      - "선택한 stream만 file로 보내고 다른 stream은 그대로 둡니다."
      - "같은 file을 쓰는 command는 한 번에 하나씩 실행합니다."
      - "argument에 credential이 있으면 name 또는 none을 쓰십시오."
      - "edc setup으로 edc log -- command 짧은 형식을 설정합니다."
  remote:
    summary: "inventory group에 recipe 실행"
    option:
      inventory: "inventory YAML 경로"
      recipe: "recipe YAML 경로"
      dry_run: "계획만 출력하고 종료"
      list: "inventory의 group과 host 출력"
      force: "확인 질문 생략"
      parallel: "동시에 실행할 host 수"
      group: "positional group argument의 별칭"
      connect_timeout: "SSH 연결 제한 시간"
      output_limit: "command별 출력 byte 상한"
    notes:
      - "group을 생략하면 선택기를 띄웁니다."
      - "inventory.yaml과 recipe.yaml을 찾습니다."
      - "현재 디렉터리를 먼저 보고, 다음으로 config 디렉터리를 봅니다."
      - "계획과 결과가 host×step 표 하나를 씁니다."
      - "Ctrl-C로 취소하면 남은 step을 SKIP으로 표시하고 exit code 4를 돌려줍니다."
  completion:
    summary: "shell completion 출력"
    notes:
      - "source <(edc completion zsh) 또는 source <(edc completion bash)."
      - "groups는 inventory의 group 이름을 한 줄에 하나씩 출력합니다."
  setup:
    summary: "command 기본값 설정"
    notes:
      - "wizard는 기존 값을 유지하며 선택한 section만 수정합니다."
      - "config 전체를 보여 준 뒤 atomic하게 저장합니다."
      - "terminal이 필요하며 취소하면 exit code 4입니다."
  update:
    summary: "최신 release 설치"
    option:
      check: "새 버전만 확인하고 설치하지 않습니다"
      yes: "확인 질문 생략"
      timeout: "network 제한 시간"
    notes:
      - "GitHub release에서 asset을 받아 SHA-256을 확인합니다."
      - "그다음 실행 파일을 바꿉니다."
      - "새 파일을 옆에 쓰고 이름을 바꾸므로 실패해도 기존 파일이 남습니다."
      - "설치 디렉터리에 쓸 권한이 없으면 내려받기 전에 exit code 3으로 멈춥니다."
  version:
    summary: "버전 출력"
    notes:
      - "terminal에서는 banner로, 그 밖에서는 한 줄로 출력합니다."
