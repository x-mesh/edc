# 한국어 메시지. 빠진 키는 en.yaml로 내려간다.
help:
  notes_label: "안내"
  tagline: "everyday carry for SE/SRE"
  usage_label: "사용법"
  usage: "edc <command> [options] [target]"
  common_label: "공통"
  detail_label: "자세히"
  help_command_summary: "명령 목록 보기"
  detail_hint: "edc help <command>"
  options_label: "options"
  common_options_label: "공통 options"
  examples_label: "예시"
  group:
    diagnose: "진단"
    observe: "관측"
    host: "호스트 변경"
    record: "기록·원격"
    tool: "도구"

option:
  timeout: "실행 제한 시간"
  json: "JSON 출력 경로, stdout은 -"
  verbose: "상세 evidence 출력"
  redact: "출력의 민감정보 가리기"

command:
  doctor:
    summary: "DNS·TCP·TLS·HTTP를 한 번에 확인"
    option:
      profile: "full은 bandwidth와 responsiveness를 더합니다"
      all_ips: "DNS 응답의 모든 IP를 검사하고 ASN holder를 조회합니다"
    notes:
      - "probe 9개를 한 번에 실행하고 결과를 같은 형식으로 모읍니다."
      - "terminal에서는 probe마다 한 줄씩 실시간으로 갱신합니다."
      - "Ctrl-C로 취소하면 exit code 4를 돌려줍니다."
  dns:
    summary: "이름 조회와 resolver 설정"
    sub:
      lookup: "시스템 resolver가 돌려주는 주소"
      compare: "시스템 DNS를 1.1.1.1이나 --resolver와 비교"
      config: "이 host의 resolver 설정"
    option:
      resolver: "비교할 DNS 서버; 여러 번 지정할 수 있습니다"
    notes:
      - "lookup은 주소를, compare는 system DNS와 다른 resolver를 비교합니다."
      - "compare는 --resolver가 없으면 1.1.1.1을 사용합니다."
  tcp:
    summary: "TCP 연결 확인"
    notes:
      - "연결하지 못하면 phase와 cause를 남기고 exit code 1을 돌려줍니다."
  tls:
    summary: "인증서와 handshake 확인"
    option:
      min_days: "남은 일수가 N보다 작으면 fail로 처리합니다"
    notes:
      - "기본값은 30일 미만일 때 warning입니다. --min-days는 그 기준을 fail로 올립니다."
  http:
    summary: "HTTP 응답 확인"
    option:
      expect_status: "응답 code가 N과 다르면 fail로 처리합니다"
      header: "요청 header 추가, 여러 번 줄 수 있음"
      body: "마지막 응답 본문 저장, -는 stdout에 출력"
    notes:
      - "기본값은 4xx가 warning, 5xx가 fail입니다."
      - "redirect가 있으면 요청마다 status, URL, 시간 값, peer를 차례로 보여 줍니다."
      - "-v는 응답마다 header를, 마지막 응답의 본문 앞부분을 더합니다."
      - "Authorization, Cookie 같은 header의 값은 가립니다."
      - "--body -는 본문을 stdout에, 결과를 stderr에 씁니다."
  audit:
    summary: "호스트의 노출 상태와 설정 점검, 읽기 전용 (Linux)"
    notes:
      - "파일, sysctl 값, listen 소켓만 읽습니다."
      - "아무것도 바꾸지 않고 외부로 보내지 않습니다."
      - "root로 실행하세요. root가 아니면 일부 점검이 skip입니다."
      - "방화벽 점검은 이 호스트만 보고 클라우드 보안 그룹은 보지 않습니다."
      - "패키지 버전을 CVE와 대조하지 않습니다."
  changes:
    summary: "최근 패키지, /etc, service 변경 (Linux)"
    notes:
      - "dpkg·dnf·yum 로그, /etc의 mtime, systemd unit 상태만 읽습니다."
      - "아무것도 바꾸지 않고 외부로 보내지 않습니다."
      - "service마다 마지막 시작 시각과 재시작 횟수만 보입니다."
      - "/etc는 파일 내용이 아니라 mtime만 봅니다."
      - "압축된 로그는 읽지 않고 경고로 알립니다."
    option:
      since: "얼마나 이전까지 볼지, 24h나 90m 같은 Go duration"
      verbose: "최근 50건에서 자르지 않고 모두 보기"
  check:
    summary: "지금 고장 난 곳을 한 번에 훑는 점검 (Linux, macOS)"
    option:
      routine: "config.toml의 [check.routines]에 있는 루틴을 실행"
      group: "edc remote 그룹의 호스트마다 check를 실행"
      inventory: "--group에 쓸 inventory 파일"
    notes:
      - "service, process, 메모리, 디스크, 커널 로그, 시간, 네트워크, container, 파일 핸들, 재부팅 필요 여부를 봅니다."
      - "기본 점검은 아무것도 바꾸지 않고 외부로 보내지 않습니다."
      - "문제마다 이어서 볼 edc 명령을 next로 알려 줍니다."
      - "root가 아니면 일부 점검은 통과가 아니라 skip입니다."
      - "macOS에서는 launchd, memory pressure, 디스크, 네트워크, container, 파일 핸들, 진단 보고서, thermal pressure, Time Machine을 보고 time과 reboot은 skip입니다."
      - "--group은 SSH로 호스트마다 edc check를 실행합니다. 각 호스트에 check가 있는 edc가 필요합니다."
      - "루틴은 config.toml의 unit 규칙, 기준값, 셸 명령을 더합니다. 명령은 0으로 끝나면 통과입니다."
  events:
    summary: "커널과 systemd의 장애 신호를 시간 순서로 정리 (Linux)"
    option:
      since: "읽을 기간 (예: 30m, 48h)"
    notes:
      - "커널 로그와 systemd journal만 읽습니다."
      - "root나 adm, systemd-journal 그룹으로 실행하세요."
      - "권한이 없으면 점검은 통과가 아니라 skip입니다."
      - "Linux에서만 동작합니다."
  net:
    summary: "interface, route, ping, trace"
    sub:
      interfaces: "네트워크 interface와 주소"
      route: "host로 가는 interface와 gateway"
      ping: "host에 ping"
      trace: "host까지의 경로, traceroute나 tracepath 사용"
  route:
    summary: "gateway VM의 default route를 점검·전환·원복"
    sub:
      check: "현재 상태 점검, 변경 없음"
      switch: "롤백 timer를 걸고 전환한 뒤 검증"
      status: "대기 중이거나 끝난 전환 보기"
      rollback: "상태 파일 하나로 원복"
    notes:
      - "경로를 바꾸는 gateway VM에서 로컬로 실행하는 명령입니다."
      - "switch와 rollback은 root 권한이 필요합니다. sudo는 붙이지 않습니다."
      - "check는 경로를 바꾸지 않습니다. switch는 먼저 롤백 타이머를 무장합니다."
      - "status는 /run/edc를 읽고, rollback --state는 파일 하나를 다시 실행합니다."
  disk:
    summary: "디스크 증설 뒤 파티션과 파일시스템 확장"
    sub:
      check: "늘릴 수 있는 mount 보기, 변경 없음"
      grow: "파티션과 파일시스템 확장"
    notes:
      - "check는 층을 읽기만 하고 아무것도 바꾸지 않습니다."
      - "root로 실행하면 모든 층의 크기가 보입니다."
      - "grow는 root 권한이 필요합니다. sudo는 붙이지 않습니다."
      - "grow는 되돌릴 수 없습니다. 먼저 볼륨 스냅샷을 만드세요."
  change:
    summary: "자동 롤백을 제공하는 시스템 변경"
    sub:
      apply: "변경 적용, 확정하지 않으면 롤백"
      status: "대기 중인 변경과 남은 시간"
      confirm: "변경을 확정하고 롤백 timer 정지"
      rollback: "apply 전 상태로 원복"
  top:
    summary: "실시간 resource 대시보드"
    option:
      interval: "sampling 간격"
      count: "출력할 row 수, 0은 계속 실행"
      no_header: "host와 column header 생략"
      process: "PID나 command 이름이 맞는 process만, 쉼표로 구분"
      full: "전체 명령줄로 맞추고 보여 준다"
      split: "cpu, mem, disk, net, psi를 박스로 한 화면에, 생략하면 전부"
      view: "처음 보기, 예: network, split"
      panels: "표 아래 패널: cpu,mem,disk,net,psi,ai,events"
      columns: "all 보기 열 그룹, +는 자세히: net+,cpu,mem"
      interface: "net 값에 더할 interface: 이름, glob, physical, 기본값 all"
      detail: "CPU 대기·I/O 지연(Linux eBPF, root), macOS는 CPU 대기"
      ebpf: "--detail과 같음"
      write: "SQLite에 누적, 경로 생략 시 기본 DB 사용"
      json: "sample당 한 줄 JSON, stdout은 -"
    notes:
      - "w로 DB 기록을 시작·중지합니다. 다시 시작하면 새 실행으로 기록하며 p 일시정지 시 기록도 멈춥니다."
      - "terminal에서는 대시보드로 엽니다. q 종료, p 일시정지, +/- interval."
      - "--count나 --json을 주거나, 비 terminal이거나, NO_COLOR면 표로 출력합니다."
      - "--process를 주면 process 보기로 엽니다. 1은 host 열, f는 다시 process."
      - "f는 signal을 따라감: 그 보기, 다음은 가장 바쁜 process. / 필터, Esc 해제."
      - "edc top setup은 실제 화면을 미리 보며 보기, 박스, 패널을 고릅니다."
  watch:
    summary: "HTTP·파일 변경 관측과 조건별 action 실행"
    sub:
      http: "Ctrl-C까지 URL 반복 요청"
      fs: "파일 변경 관측, 원하면 명령 실행"
    option:
      interval: "sample 간격(초), 최소 0.1"
      duration: "지정한 시간이 지나면 종료; 생략하면 Ctrl-C까지 실행"
    notes:
      - "HTTP 관측은 watch http로 실행합니다. 기존 watch URL 형식도 지원합니다."
      - "watch fs는 기본으로 현재 디렉터리를 감시합니다."
      - "파일 이벤트는 create,modify,remove,rename입니다. 파일 읽기는 감지하지 않습니다."
      - "--exec나 --rules를 지정하면 커맨드를 실행합니다."
  info:
    summary: "system, network, disk 정보"
    option:
      public: "외부 public IP 조회를 끕니다(DNS, -v에서는 ipinfo.io)"
      timeout: "public 조회 제한 시간"
      verbose: "public 조회 실패 원인 출력"
    notes:
      - "public IP를 기본으로 조회하고, 제한 시간 안에 응답이 없으면 그 줄을 뺍니다."
      - "disk 사용량은 전체 크기에서 남은 공간을 뺀 값입니다."
  view:
    summary: "로그를 색으로 읽고, 파일이 늘어나면 따라감"
    option:
      lines: "마지막 N줄, 화면은 N줄을 보관 (기본 10,000)"
      follow: "pipe에서 tail -F처럼 따라감, 화면은 항상 따라감"
    notes:
      - "터미널에서는 파일 끝에서 화면을 열고 새 줄을 따라갑니다."
      - "↑나 PgUp을 누르면 목록이 멈추고, 머리 줄에 새 줄 수를 셉니다. End, l, Esc를 누르면 다시 따라갑니다."
      - "access log는 목록에 시각, status, method, bytes, path를 보입니다. 보관한 줄에서 모두 같은 host, client, 날짜는 숨기고 머리 줄에 그 값을 적습니다. c는 원문 줄을 보이고, ← →는 목록을 가로로 밉니다."
      - "nginx와 Apache access log, JSON lines, ERROR나 WARN 같은 level이 있는 줄을 읽습니다."
      - "통계 패널은 status 범주나 level별 수, 상위 path와 client, 마지막 오류를 보여 줍니다."
      - "통계는 화면이 보관한 줄만 셉니다. i로 패널을 숨깁니다."
      - "화면이 120열 이상이면 패널을 오른쪽에, 그보다 좁으면 목록 아래에 둡니다."
      - "Enter는 필드와 줄 전체, 그 아래로 이어지는 stack trace 줄을 보여 줍니다."
      - "파일이 회전되거나 잘리면 그 자리를 표시하고 새 파일을 처음부터 읽습니다."
      - "pipe나 NO_COLOR에서는 cat처럼 바이트를 그대로 냅니다. -f는 tail -F처럼 따라갑니다."
      - "edc alias는 ev, evn, evf 같은 짧은 alias를 출력합니다."
  grep:
    summary: "로그 검색, 시각으로 건너뛰고 최근 것부터 읽고 index를 다시 씀"
    option:
      ignore_case: "대소문자 무시"
      regex: "패턴을 정규식으로 해석 (기본: 문자열 그대로)"
      numbers: "줄 번호 표시"
      files: "맞는 줄이 있는 파일 이름만 출력"
      context: "맞는 줄 앞뒤 N줄 표시"
      level: "이 level 이상인 줄: trace, debug, info, warn, error, fatal"
      status: "HTTP status: 5xx, 404, 500-503을 쉼표로 이음"
      since: "이 시각 이후의 줄: 10m, 2h, 1d, 2026-10-27 09:00, 09:00"
      until: "이 시각 이전의 줄"
      ordered: "로그가 시간 순서임: --since가 파일을 이진 탐색하고 그 시각 앞에서 끝나는 파일을 건너뜀"
      index: "index를 지금 만들거나 쓰지 않음 (기본: 24시간 안의 두 번째 검색에서 만듦)"
      jobs: "index를 만드는 goroutine 수 (기본: 코어의 절반, 최대 4, 상한 64)"
      verify: "index 결과를 전체 읽기와 비교하고 틀린 index를 지움"
      last: "가장 최근 N건, 파일 끝에서 읽음"
    notes:
      - "디렉터리는 안의 파일을 모두 찾습니다. binary 파일은 건너뛰고, .gz는 풀면서 차례로 읽습니다."
      - "출력은 grep과 같습니다. 파일이 여럿이면 경로를, -n이면 줄 번호를 붙이고, -C는 앞뒤 줄을 더합니다."
      - "--since와 --until은 시각으로 줄을 거릅니다. --ordered를 주면 --since가 시간 순서인 파일을 이진 탐색하고 그 시각 앞에서 끝나는 파일을 건너뛰어, 수 GB 로그의 최근 구간도 수 MB만 읽습니다."
      - "--last는 파일 끝에서 거꾸로 읽어 N건을 찾으면 멈춥니다."
      - "--level, --status, --since, --until이 있으면 첫 인자가 실제 파일이나 디렉터리일 때 패턴을 생략할 수 있습니다."
      - "stack trace 줄은 그 ERROR 줄의 level과 시각을 물려받으므로, --level error는 trace도 함께 냅니다."
      - "64 MB 이상인 파일은 24시간 안의 두 번째 검색에서 캐시 디렉터리에 index를 만듭니다. 1 MB 블록마다 어떤 글자, 시각, level, status가 있는지 적어 두어, 다음 검색은 맞을 수 있는 블록만 읽습니다. index는 로그가 뒤에만 쌓인다고 가정합니다. 제자리에서 고친 파일은 크기가 줄거나 첫 블록이나 마지막 index 블록이 바뀌기 전까지 index를 그대로 쓰므로, 그런 파일에는 --no-index나 --verify-index를 쓰세요."
      - "stderr가 터미널이면 검색마다 index를 썼는지, 만들었는지, 왜 쓰지 않았는지 알립니다."
      - "pipe나 NO_COLOR에서는 줄의 바이트를 그대로 냅니다. 종료 코드는 찾으면 0, 없으면 1, 오류면 2입니다."
      - "edc alias는 eg, egs, ege 같은 짧은 alias를 출력합니다."
  du:
    summary: "디렉터리 아래 디스크 사용량, 큰 항목부터 (Linux와 macOS)"
    option:
      top: "보여 줄 줄 수, 기본값은 터미널 높이에 맞춤"
      workers: "동시에 읽는 디렉터리 수"
      cross_mounts: "경로 아래의 마운트도 셈"
      no_browse: "진행 상황과 용량 막대를 보여 주고 자동 종료"
      timeout: "제한 시간, 지나면 그때까지 센 크기를 보여 줌"
      verbose: "읽지 못한 디렉터리와 건너뛴 마운트를 모두 표시"
    notes:
      - "읽기만 합니다. 아무것도 바꾸거나 지우지 않습니다."
      - "du처럼 disk block을 세고, hard link는 한 번만 셉니다."
      - "한 파일 시스템 안에서만 세고, 건너뛴 마운트를 보여 줍니다."
      - "bind·overlay mount는 파일 시스템을 공유하므로 크기를 -로 표시합니다."
      - "Linux에서는 지워졌지만 process가 아직 열고 있는 파일도 보여 줍니다."
      - "터미널에서는 탐색 화면을 열고, q로 닫으면 결과를 출력합니다."
      - "Linux에서는 docker 저장 경로에 container 이름도 표시합니다."
