history:
  help_sections:
    storage:
      title: "DB와 파일"
      notes:
        - "로컬 history DB에는 `snapshot`과 `top` 관측값을 저장합니다. 선택 인자 `<DB>`로 다른 DB를 지정합니다."
        - "JSON snapshot은 `edc report list`로 목록을 보고 `edc report show <file.json>`으로 엽니다."
    recording:
      title: "기록"
      notes:
        - "`edc snapshot`은 기본으로 기록합니다. `--output <file>`로 JSON도 저장하고 `edc history export --run <id>`로 이전 snapshot을 꺼냅니다."
        - "`edc top -w` 또는 top의 `w`로 기록을 시작·중지합니다. `p`로 일시정지하면 수집과 기록이 함께 멈춥니다."
    browsing:
      title: "탐색"
      notes:
        - "터미널에서 `edc history list`, `edc history top`, `edc history process`는 인터랙티브 탐색 화면을 엽니다."
        - "`↑↓` 선택, `Enter` 상세, `Home` 최신 추적을 지원합니다. 넓은 화면에는 컬럼과 상세 패널을 추가합니다."
    analysis:
      title: "추이와 증가량"
      notes:
        - "`edc history trend`는 DB 지표를 로컬 시간·일·주 단위로 묶습니다. `edc history growth`는 디스크·디렉터리 또는 process RSS 증가량을 봅니다 (기본 7일)."
        - "process는 `--process <filter>`로 좁힙니다. 필터 없이 저장한 process는 관측된 후보이며, host CPU%는 전체 코어 기준이고 process 100%는 한 코어입니다."
    cleanup:
      title: "정리"
      notes:
        - "`edc history prune`은 마지막 활동이 `90d` 이전인 실행을 미리 봅니다. `t`로 기간 변경, `d` 다음 `y`로 체크한 실행 삭제를 확인합니다."
        - "자동 삭제하지 않습니다. `--dry-run`, `--yes`, `--vacuum`은 `edc history prune --help`를 참고하세요."
  prune_help:
    interactive_title: "인터랙티브 탐색"
    retention: "`--older-than`을 생략하면 마지막 활동이 `90d` 이전인 실행을 미리 봅니다. 스크립트에서는 `<age>`를 지정하세요."
    keys: "`↑↓` 선택 · `Space` 체크 · `a` 전체 · `Enter` 상세 · `q` 종료."
    period: "`t`로 기간을 고릅니다. 기본 기간 또는 `12h`, `14d`, `2w`처럼 직접 입력할 수 있습니다."
    deletion_title: "삭제와 디스크 공간"
    confirm: "`d` 다음 `y`로 체크한 실행과 관측값을 삭제합니다. `--dry-run`은 미리보기만, `--yes`는 탐색·확인 없이 실행합니다."
    recheck: "마지막 활동은 시작·종료·최근 관측 시각 중 가장 늦은 값입니다. 삭제 직전에 활동이 갱신되었는지 다시 확인합니다."
    vacuum: "삭제한 공간은 DB 안에서 재사용됩니다. `--vacuum`은 공간을 디스크에 반환하며 그동안 다른 기록이 기다릴 수 있습니다."
    storage_title: "데이터베이스"
    storage: "선택 인자 `<DB>`로 다른 history DB를 지정합니다. Snapshot JSON 파일은 `edc report list`와 `edc report show <file.json>`으로 조회합니다."
