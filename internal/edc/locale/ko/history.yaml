command:
  history:
    notes:
      - "prune 탐색 화면에서 t로 기간 선택을 엽니다. 기본 기간을 고르거나 직접 입력하면 후보를 다시 조회하고 선택한 기간으로 삭제 조건을 재확인합니다."
      - "터미널에서 history prune을 옵션 없이 실행하면 마지막 활동이 90일 이전인 실행을 미리 봅니다. 탐색 화면 밖에서는 --older-than이 필요합니다."
      - "growth는 선택·상세 탐색 화면을 엽니다. prune은 후보를 표시하며 Space 체크, a 전체 선택, d 다음 y로 삭제를 확인합니다. --dry-run은 미리보기만, --yes는 기존 명령 출력으로 실행합니다."
      - "history process도 탐색 화면을 엽니다. ↑↓ 선택, Enter로 PID·CPU·메모리·I/O와 수집된 한도를 확인하며 넓은 화면에는 컬럼과 상세를 추가합니다."
      - "터미널에서 history top은 탐색 화면을 엽니다. ↑↓ 선택, Enter 상세, Home 최신 관측 추적."
      - "화면 너비에 따라 디스크·네트워크·swap 컬럼을 추가하며, 넓은 화면에는 선택한 관측의 상세를 표시합니다."
      - "history DB는 기본 저장되는 snapshot과 top -w의 반복 관측값을 모으는 로컬 SQLite 파일입니다."
      - "trend와 growth는 이 DB를 읽으며, snapshot이 만든 JSON 파일은 읽지 않습니다."
      - "JSON snapshot 목록은 edc report list, 내용은 edc report show <file.json>으로 봅니다."
      - "growth는 기간(기본 7일)의 속도로 디스크가 가득 차는 시점을 추정합니다."
      - "trend는 지표 하나를 로컬 시간의 hour, day, week로 묶어 오래된 순으로 보입니다."
      - "snapshot은 기본으로 기록하며, snapshot -w <DB>로 DB를 지정하고 export --run <id>로 JSON을 꺼냅니다."
      - "top -w [DB]는 대시보드를 유지하며 기록합니다."
      - "실행별로 누적합니다. top 일시정지는 기록도 멈춥니다."
      - "list는 실행 목록, top과 process는 최신 sample부터 조회합니다."
      - "host CPU%는 user+system, process는 core 하나가 100%입니다."
      - "--metric에는 JSON의 최상위 숫자 필드 이름을 씁니다."
      - "process는 관측한 후보만 저장하며 전체 process 목록이 아닙니다."
      - "자동 삭제는 없습니다. 로컬 DB 파일을 사용하세요."
      - "DB 경로를 생략하면 기본 이력 DB를 조회합니다."
