# edc report join의 한국어 메시지. 빠진 키는 en으로 내려간다.
join:
  error:
    not_pair: "report join에는 tcp.diagnose report 하나와 tcp.expect report 하나가 필요합니다: %s은(는) %s, %s은(는) %s입니다"
    no_probe: "tcp.diagnose도 tcp.expect도 아님"
  label:
    client: "client"
    target: "대상"
    time: "시간"
    verdict: "판정"
    warning: "경고:"
    checklist: "장비 담당자가 볼 항목:"
  line:
    client_counts: "연결 %d/%d · 거부 %d · 응답 없음 %d · SYN 재전송 %d · client의 drop: %s"
    target_source: "%s에서 %s로 도착"
    target_overall: "client와 맞는 출발지 없음 (전체 판정 %s)"
    target_counts: "SYN 수신 %d · SYN-ACK 송신 %d · RST 송신 %d · handshake %d · kernel drop: %s"
    time: "시작 시각 차이 %s (대상 − client) · %s"
    overlap_yes: "두 실행이 겹칩니다"
    overlap_no: "두 실행이 겹치지 않습니다 (간격 %s)"
  value:
    unknown: "알 수 없음"
    none: "없음"
  warning:
    no_overlap: "두 실행의 시간이 겹치지 않습니다: client %s, 대상 %s, 간격 %s. client가 보내는 동안 대상이 보고 있지 않았으므로 판정이 약합니다"
    port_mismatch: "client는 port %s에 연결했는데 대상은 port %d를 보았습니다"
    from_excludes: "대상은 --from %s만 보았는데, client 출발지 %s는 그 범위에 없습니다"
    source_missing: "client 출발지 %s가 대상의 출발지 목록(%s)에 없습니다. client가 연결되지 않았다면 이 client에 대해 no_syn으로 판정합니다. 경로의 NAT가 출발지 주소를 바꿨을 수 있습니다"
    temporary_listener_works: "경로는 동작합니다. 대상이 tcp expect --listen으로 실행했으므로 서비스 자체는 시험하지 않았습니다"
    temporary_listener: "대상이 tcp expect --listen으로 실행해서 서비스가 아니라 edc의 임시 listener가 답했습니다. 서비스 자체는 시험하지 않았습니다"
    temporary_listener_silent: "대상은 tcp expect --listen으로 실행했지만 임시 listener가 SYN-ACK를 보내지 않았습니다. 서비스 자체는 시험하지 않았습니다"
  reason:
    basis_phases: "client는 이벤트 추적 없이 연결 phase만으로 판정했습니다. client host 자신의 drop을 배제하지 못합니다"
    rst_lost: "대상은 RST를 보냈는데 client는 응답을 받지 못했습니다. RST가 돌아오지 않았으므로 돌아오는 경로를 의심합니다"
    rst_from_path: "client는 RST를 받았는데 대상에는 SYN이 닿지 않았습니다. 경로 위의 장비가 RST를 보냈습니다"
    reply_hidden: "대상의 응답이 IPsec policy를 거쳐 ESP로 나가서 edc는 보냈는지 볼 수 없습니다. 양쪽의 IPsec SA 카운터를 비교합니다"
    intermittent: "일부 시도만 연결됐습니다. 양쪽의 시도 수를 비교해 SYN이 사라졌는지 봅니다"
    mismatch: "두 report가 같은 흐름을 담고 있지 않습니다: port, 시간 창, 출발지 주소를 확인합니다"
    dns_failed: "client가 host 이름을 해석하지 못해 SYN을 보내지 않았습니다"
    no_attempt: "client가 시도를 끝내지 못해 client 판정이 없습니다"
    unreachable: "client가 응답 전에 네트워크 오류를 받았습니다. client의 경로를 먼저 확인합니다"
    unknown_pair: "이 판정 조합은 표에 없습니다"
    from_excludes: "대상의 filter가 client 출발지를 걸러 냈으므로 no_syn은 증거가 아닙니다"
  segment:
    between_hosts: "두 host 사이의 경로가 %s → %s의 SYN을 버립니다: tunnel selector, firewall 정책, NAT"
    return_path: "%s → %s로 돌아오는 경로가 응답을 버립니다: 역방향 route, 역방향 selector, client 쪽 rp_filter"
    target_host: "대상 host %s가 잘못 답하거나 답하지 않습니다: listener 없음, host firewall, rp_filter, 가득 찬 listen queue"
    client_host: "client host %s가 자기 packet을 버립니다 (%s): 자기 firewall"
    path_quality: "%s → %s 경로는 동작하지만 packet을 잃습니다: edc net mtu로 확인합니다"
    works: "%s → %s 경로는 동작합니다. 다음은 TLS와 애플리케이션입니다"
    inconsistent: "두 report가 맞지 않습니다 (client %s, 대상 %s): port, 시간 창, 출발지를 확인합니다"
    undetermined: "구간을 정하지 못했습니다 (client %s, 대상 %s)"
  check:
    selector_forward: "traffic selector에 %s → %s가 들어 있어야 합니다"
    policy_hits: "%s → %s의 policy hit count와 deny log"
    nat_exemption: "%s → %s의 NAT 예외 (SYN이 출발지 주소를 유지해야 합니다)"
    forward_path: "장비에서 %s 쪽과 %s 쪽으로 가는 route"
    target_filter: "대상 앞의 장비 filter가 %[2]s 쪽 port %[1]s를 막는지"
    selector_reverse: "역방향 traffic selector에 %s → %s가 들어 있어야 합니다"
    reverse_route: "장비에서 %s가 %s로 돌아가는 역방향 route"
    client_rp_filter: "client %s의 rp_filter와 host firewall이 돌아오는 packet을 받는지"
    target_return: "대상은 응답을 이렇게 보냅니다: %s"
    listener: "port %s에 listen하는 process가 있는지: edc listen --tcp"
    host_firewall: "대상의 host firewall이 %[2]s에서 오는 port %[1]s를 받는지: nft list ruleset"
    listen_queue: "port %s의 listen queue가 가득 차지 않았는지: ss -ltn"
    target_drops: "대상의 kernel drop 이유: %s"
    target_rp_filter: "%s의 rp_filter: 응답이 다른 interface로 나갑니다 (%s)"
    client_firewall: "client의 firewall 규칙 중 %s → %s (drop 이유: %s)"
    client_ruleset: "client에서 sudo nft list ruleset 또는 iptables -S"
    mtu: "edc net mtu %s"
    retransmits: "재전송: client SYN %d, 데이터 %d · 대상 SYN %d, SYN-ACK %d"
    attempt_counts: "시도: client %d (연결 %d) · 대상 %d (handshake %d)"
    tls: "edc tls check %s"
    application: "대상의 애플리케이션 로그"
    same_port: "양쪽 port가 같은지: client %s, 대상 %d"
    same_time: "두 명령을 같은 시간에 실행했는지"
    same_source: "출발지 주소가 같은지: client %s, 대상 %s"
    rerun: "두 명령을 같은 시간에 다시 실행합니다. client는 이벤트 추적을 위해 root로 실행합니다"
