    same_name: "%s와(과) %s은(는) 묶음 안의 이름이 같습니다: %s. 하나의 이름을 바꾸거나 따로 묶습니다"
    unsafe_path: "압축 파일에 출력 디렉터리 밖의 항목이 있습니다: %s"
