    kind_plain: "압축 안 됨"
    action_pack: "묶기"
    action_compress: "압축"
    action_extract: "풀기"
    action_list: "목록"
    progress: "%s  %s / %s (%d%%)  %s"
    progress_bytes: "%s  %s  %s"
    progress_files: "%s  파일 %d개  %s  %s"
    apple_double: "macOS AppleDouble"
    socket: "소켓"
    char_device: "문자 장치"
    block_device: "블록 장치"
