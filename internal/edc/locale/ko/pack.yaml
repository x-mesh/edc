    exists_named: "%s이(가) 이미 있습니다. 지우거나 -o를 줍니다"
    kept: "항목 %d개를 건너뛰어 압축 파일을 남겼습니다. 필요 없으면 직접 지웁니다"
    no_replace: "이 파일 시스템은 이미 있는 디렉터리를 덮지 않고 옮기는 기능이 없어 여기에는 풀지 않습니다. -o로 다른 파일 시스템의 디렉터리를 줍니다"
