# route 명령군(check, switch, status, rollback)의 한국어 메시지. 빠진 키는 en으로 내려간다.
route:
  skip:
    linux_only: "edc는 Linux에서만 경로를 바꿉니다"
  flag:
    state: "복원할 route 상태 파일 경로"
    to: "exits.yaml에서 고를 전환 대상 출구 이름"
    seconds: "롤백 유예 시간(초, 10~900)"
    exits: "exits.yaml 경로. 기본 탐색을 덮어씁니다"
    force: "자기 차단 위험이 높고 안전장치가 확인되지 않아도 전환합니다"
    yes: "출구 신원 확인이 일치하면 확인을 건너뜁니다"
    dry_run: "아무것도 바꾸지 않고 계획만 출력합니다"
  reach:
    current: "현재 출구"
    summary: "사용 가능 %d개, 미확인 %d개, 실패 %d개"
    detail: "via %s dev %s: %s (이웃 %s, 장치 %s, mtu %d)"
    skip:
      no_candidate: "살펴볼 출구가 없습니다. 경로에 via가 없고 exits.yaml도 없습니다"
    warn:
      broken: "지금 트래픽을 보낼 수 없는 출구: %s"
  exits:
    error:
      not_found: "exits.yaml을 찾지 못했습니다"
      incomplete_entry: "%s: 모든 출구는 name, via, dev를 가져야 합니다"
  switch:
    error:
      to_required: "--to가 필요합니다"
      seconds_range: "--seconds는 %d에서 %d 사이여야 합니다"
      root_required: "edc route switch는 root 권한이 필요합니다"
      unknown_exit: "알 수 없는 출구 %s, 사용 가능: %s"
      guard_denied: "롤백 안전장치가 전환을 거부했습니다: %s"
      identity_check_failed: "출구 신원 확인에 실패했습니다: %s"
      identity_mismatch: "출구 신원이 일치하지 않습니다: 기대 %s, 실제 %s"
      exit_unreachable: "출구 %s로는 지금 트래픽을 보낼 수 없습니다(이웃 %s, 장치 %s). --force로 넘길 수 있습니다"
    dry_run:
      summary: "계획만 확인했고 아무것도 바꾸지 않았습니다: 출구 %s, 롤백 유예 %d초"
      guard: "systemd-run --collect --on-active=%[2]d --timer-property=AccuracySec=1s --unit=%[1]s"
      label:
        current: "현재 경로"
        apply: "적용"
        rollback: "롤백"
        guard: "안전장치"
        reach: "도달성"
    cancelled:
      signal: "확정 전에 신호를 받아 원복했습니다"
      declined: "확정하지 않아 원복했습니다"
    confirm:
      question: "이 경로 변경을 유지할까요?"
      detail: "출구 %s로 전환했습니다(신원 확인: %s). 확정하지 않으면 무장된 타이머가 %d초 뒤 원복합니다(안전장치 등급 %d). 기존 연결은 새 연결이 이 경로를 타기 전에 끊깁니다."
    summary: "출구 %s로 전환했습니다(신원 확인: %s)"
  status:
    skip:
      none: "route 상태 파일이 없습니다. 진행 중이거나 기록된 전환이 없습니다"
    warn:
      timer_mismatch: "상태 파일은 아직 진행 중인데 롤백 타이머 %s가 active가 아닙니다"
    summary:
      pending: "출구 %s(실행 %s)가 확정이나 원복을 기다리고 있습니다"
      completed: "출구 %s(실행 %s)가 끝났습니다"
  rollback:
    error:
      state_required: "--state가 필요합니다"
      state_unreadable: "route 상태 파일 %s을(를) 읽지 못했습니다: %s"
      already_completed: "route 상태 파일 %s은(는) 이미 완료 표시가 있습니다"
      verify_failed: "rollback이 기준선을 복원하지 못했습니다: 기대 %d개, 실제 %d개"
    warn:
      rules_changed: "전환이 열려 있는 동안 정책 라우팅 rule이 바뀌었습니다. 경로 자체는 복원됐습니다"
    summary: "%s을(를) %d개 경로로 되돌렸습니다"
  table:
    summary: "경로 %d개, rule %d개"
    warn:
      parse_errors: "ip route show table all에서 %d줄을 읽지 못했습니다"
      rule_parse_error: "%s"
  target:
    summary: "검증 대상 %d개 확인, %d개 제외"
    error:
      no_route: "%s로 가는 경로를 찾지 못했습니다"
    warn:
      exits_missing: "exits.yaml을 찾지 못해 출구 기반 검증 대상을 건너뜁니다"
      get_failed: "ip route get %s 실패: %s"
      get_unparsed: "%s의 ip route get 출력을 읽지 못했습니다"
      excluded: "제외됨(더 구체적인 경로를 탐): %s"
  lockout:
    reason:
      session_rides: "세션 트래픽이 바꾸려는 경로를 탑니다"
      session_clear: "세션 트래픽이 바꾸려는 경로를 타지 않습니다"
      underlay_unresolved: "세션이 터널을 타는데 underlay 엔드포인트를 확인하지 못해 위험을 높게 봅니다"
      underlay_rides: "터널 underlay 트래픽이 바꾸려는 경로를 탑니다"
      underlay_clear: "터널 underlay 트래픽이 바꾸려는 경로를 타지 않습니다"
    skip:
      no_ssh_connection: "SSH_CONNECTION이 없어 이 세션의 자기 차단 위험을 판정할 수 없습니다"
    summary:
      high: "자기 차단 위험 높음: %s"
      low: "자기 차단 위험 낮음: %s"
  guard:
    reason:
      allowed: "안전장치 %d등급, 자기 차단 위험 %s"
      forced: "--force가 안전장치 %d등급과 자기 차단 위험 %s를 무시합니다"
      denied: "자기 차단 위험이 높은데 안전장치 %d등급은 확인된 롤백 타이머를 주지 못합니다"
    skip:
      check_only: "롤백 타이머 확인은 switch 실행 시점에만 합니다. check는 무장하지 않습니다"
