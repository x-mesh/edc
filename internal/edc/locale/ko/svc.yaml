    no_limit: "한계 없음"
    high: "fd 한계의 80%% 이상을 쓰는 process %d개: %s"
    unlimited: "fd 한계가 없는 process %d개"
    ok: "fd를 가장 많이 쓰는 process: %s"
  listen:
    none: "unit process가 가진 tcp·udp 대기 소켓 없음"
    summary: "%s에서 대기"
  journal:
    none: "journal에 오류 줄 없음"
    errors: "최근 오류 %d줄, 마지막: %s"
  evidence:
    processes: "process (%d / %d)"
    fd: "열린 fd / soft 한계"
    sockets: "소켓"
    journal: "journal"
